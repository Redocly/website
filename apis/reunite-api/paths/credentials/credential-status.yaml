get:
  tags:
    - Credentials
  security:
    - UserCookie: []
  summary: Retrieve a credential status
  description: Returns credential validity.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  operationId: getCredentialStatus
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/CredentialId.yaml
  responses:
    '200':
      description: Connection status.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/credentials/CredentialStatus.yaml
          example:
            id: cred_01h1s5z6vf2mm1mz3hevnn9va7
            object: credentialStatus
            isValid: false
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
