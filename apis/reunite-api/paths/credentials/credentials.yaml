post:
  tags:
    - Credentials
  security:
    - UserCookie: []
  summary: Create credential
  description: Create credential.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  operationId: createCredential
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
  requestBody:
    content:
      application/json:
        schema:
          description: Payload to create credential.
          $ref: ../../components/schemas/credentials/CredentialSchemaPost.yaml
  responses:
    '201':
      description: Credential connection created successfully.
      content:
        application/json:
          schema:
            description: Created credential.
            $ref: ../../components/schemas/credentials/CredentialSchema.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
      description: Credential cannot be created.
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
get:
  tags:
    - Credentials
  security:
    - UserCookie: []
  summary: List all credentials
  description: List all credentials (user-owned and shared).
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  operationId: listCredentials
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
  responses:
    '200':
      description: Successful credentials retrieval.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/credentials/CredentialsList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
