patch:
  tags:
    - Credentials
  security:
    - UserCookie: []
  summary: Partially update a credential
  description: Update credential by ID.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  operationId: patchCredential
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/CredentialId.yaml
  requestBody:
    content:
      application/json:
        schema:
          description: Payload to update credential.
          $ref: ../../components/schemas/credentials/CredentialSchemaPatch.yaml
  responses:
    '200':
      description: Credential updated successfully.
      content:
        application/json:
          schema:
            description: Updated credential
            $ref: ../../components/schemas/credentials/CredentialSchema.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
get:
  tags:
    - Credentials
  security:
    - UserCookie: []
  summary: Retrieve a credential
  description: Get credential by id.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  operationId: getCredential
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/CredentialId.yaml
  responses:
    '200':
      description: Successful GIT credential retrieval.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/credentials/CredentialSchema.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
delete:
  tags:
    - Credentials
  security:
    - UserCookie: []
  summary: Delete a credential
  description: Delete credential by ID.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  operationId: deleteCredential
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/CredentialId.yaml
  responses:
    '204':
      description: Credential deleted successfully.
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
