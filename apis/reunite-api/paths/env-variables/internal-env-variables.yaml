get:
  tags:
    - Environment Variables
  security:
    - InternalAuth: []
  summary: List all environment variables for internal use only
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: listEnvVariablesInternal
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/env-variables/EnvVariable.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
