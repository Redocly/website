post:
  tags:
    - Invites
  security:
    - UserCookie: []
  summary: Resend invite
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: resendInvite
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/InviteId.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/invites/Invite.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
put:
  tags:
    - Invites
  security:
    - UserCookie: []
  summary: Replace an invite
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: updateInvite
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/InviteId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/invites/Invite.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/invites/Invite.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
delete:
  tags:
    - Invites
  security:
    - UserCookie: []
  summary: Delete an invite
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: deleteInvite
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/InviteId.yaml
  responses:
    '204':
      $ref: ../../common/responses/NoContent.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
