put:
  tags:
    - WYSIWYG
  security:
    - UserCookie: []
  summary: Wake up WYSIWYG job in the background
  description: >
    Ensures the WYSIWYG preview container for this branch is running, starting it in the
    background if it is not already active. Unlike restart, this is a no-op if the job is
    already running.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: blips-and-chitz
  operationId: warmUpWysiwyg
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/BranchName.yaml
  responses:
    '204':
      $ref: ../../common/responses/NoContent.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '409':
      description: >-
        The organization's concurrent WYSIWYG job limit has been reached, or this branch's job
        was stopped for exceeding that limit and is still in its cool-down window.
      $ref: ../../common/responses/ConflictError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
