post:
  tags:
    - OAuth2 clients
  security:
    - UserCookie: []
  summary: Create OAuth2 client for organization
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: createOAuthClient
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/oauth-client/OAuthClient.yaml
  responses:
    '201':
      description: New OAuth2 client created. clientSecret is shown only once.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/oauth-client/OAuthClientWithSecret.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
get:
  tags:
    - OAuth2 clients
  security:
    - UserCookie: []
  summary: List all OAuth2 clients
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: listOAuthClients
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/oauth-client/OAuthClientList.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
