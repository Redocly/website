get:
  summary: Retrieve a project service
  description: >
    Internal endpoint called by Caddy after a 5xx upstream error to determine
    whether a project is registered.
    Returns the project service resource if the project or custom domain exists —
    Caddy then serves `service_unavailable.html` (503) for transient outages.
    Returns 404 if the project does not exist — Caddy serves `deployment_not_found.html` (404).
    Preview deployments and the deprecated `portal-` prefix are not supported.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: borsch
  tags:
    - Project services
  security:
    - InternalAuth: []
  operationId: getProjectService
  parameters:
    - in: path
      name: serviceId
      schema:
        type: string
        maxLength: 253
      required: true
      description: >
        Consul service name of the project deployment. Either a project service name
        (`project-{slug}`) or a custom domain (`docs.example.com`).
        Preview deployments and the deprecated `portal-` prefix are not supported.
      example: project-acme
  responses:
    '200':
      description: Project service retrieved successfully.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/project-services/ProjectService.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
