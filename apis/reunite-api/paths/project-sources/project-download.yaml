get:
  tags:
    - Project sources
  security:
    - UserCookie: []
  summary: Download project
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  operationId: getSourceArchive
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
  responses:
    '200':
      description: ZIP file with project source.
      content:
        application/zip:
          schema:
            type: string
            format: binary
    '302':
      $ref: ../../common/responses/Found.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
