get:
  tags:
    - Teams
  security:
    - UserCookie: []
  summary: List all team members
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: listTeamMembers
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/team-members/TeamMembersList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
post:
  tags:
    - Teams
  security:
    - UserCookie: []
  summary: Add a member to a team
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: createTeamMember
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
  requestBody:
    description: Team member.
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/team-members/TeamMember.yaml
  responses:
    '201':
      description: Team member created.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/team-members/TeamMember.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '409':
      $ref: ../../common/responses/ConflictError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
