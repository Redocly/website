get:
  tags:
    - Project custom domains
  security:
    - UserCookie: []
  summary: List all project custom domains
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: borsch
  operationId: listProjectCustomDomains
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
  responses:
    '200':
      description: Custom domain for project.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/project-custom-domain/ProjectCustomDomainList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
put:
  tags:
    - Project custom domains
  security:
    - UserCookie: [ ]
  summary: Upsert custom domain for project
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: borsch
  operationId: upsertProjectCustomDomain
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/project-custom-domain/ProjectCustomDomain.yaml
  responses:
    '200':
      description: Project custom domain created.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/project-custom-domain/ProjectCustomDomain.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
