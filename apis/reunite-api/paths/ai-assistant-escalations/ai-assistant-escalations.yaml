post:
  tags:
    - AI Assistant
  summary: Create AI assistant escalation
  description: >-
    Escalates an AI assistant conversation to the project's support team.
    The ticket is delivered to the support email configured in the project's
    AI assistant settings.
  operationId: createAiAssistantEscalation
  x-internal: true
  x-catalogRelations: []
  security: []
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ai-assistant-escalations/AiAssistantEscalationCreate.yaml
  responses:
    '201':
      description: Escalation created and handed off to the configured support channel.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ai-assistant-escalations/AiAssistantEscalation.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
