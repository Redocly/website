get:
  tags:
    - Branches
  security:
    - UserCookie: []
  operationId: getBranchById
  summary: Retrieve a branch
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/BranchId.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/branches/Branch.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
delete: 
  tags:
    - Branches
  security:
    - ApiKey: []
    - UserCookie: []
  operationId: deleteBranch
  summary: Delete a branch
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/BranchId.yaml
    - name: userId
      in: query
      required: false
      description: ID of the user performing the action. Unique identifier prefixed with `usr_`.
      schema:
        type: string
      example: usr_01h1s5z6vf2mm1mz3hevnn9va7
  responses:
    '204':
      description: No content.
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
patch:
  tags:
    - Branches
  security:
    - UserCookie: []
    - InternalAuth: []
  operationId: updateBranch
  summary: Partially update a branch
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/BranchId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/branches/Branch.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/branches/Branch.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
  
