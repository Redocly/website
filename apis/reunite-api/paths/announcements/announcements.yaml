get:
  tags:
    - Announcements
  security:
    - UserCookie: []
  summary: List all announcements for current user
  description: Returns announcements for the authenticated user based on filter mode. Defaults to unseen mode within the requested latest limit.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: listAnnouncements
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - in: query
      name: filter
      required: false
      description: Announcement filters (for announcements use `type:unseen` or `type:latest`).
      schema:
        type: string
        default: type:unseen
      example: type:unseen
    - in: query
      name: limit
      required: false
      description: Max number of announcements returned.
      schema:
        type: integer
        minimum: 1
        maximum: 100
      example: 5
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/announcement/AnnouncementList.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml

