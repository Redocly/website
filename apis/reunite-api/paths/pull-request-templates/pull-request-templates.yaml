get:
  tags:
    - Pull request templates
  security:
    - UserCookie: []
  operationId: listPullRequestTemplates
  summary: List all pull request templates for branch
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/query/BranchNameRequired.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/pull-request-template/PullRequestTemplate.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
