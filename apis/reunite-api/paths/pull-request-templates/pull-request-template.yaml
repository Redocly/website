get:
  tags:
    - Pull request templates
  security:
    - UserCookie: []
  operationId: getPullRequestTemplate
  summary: Retrieve a pull request template
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/PullRequestTemplatePath.yaml
  responses:
    '200':
      description: OK.
      content:
        text/plain:
          schema:
            type: string
          example: |-
            ### Pull request description
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
