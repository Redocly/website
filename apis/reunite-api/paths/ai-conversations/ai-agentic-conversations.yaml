post:
  tags:
    - AI conversations
  summary: Start agentic conversation with AI assistant
  description: |-
    Initiate AI conversations with agentic tool calling and MCP integration.

    **Processing Flow:**
    1. **Initial Search** - Performs preliminary documentation search
    2. **Agent Setup** - Configures LLM with search_documentation tool and optional MCP tools
    3. **Iterative Search** - LLM autonomously searches multiple times as needed
    4. **Answer Synthesis** - Streams response chunks
    5. **Report Generation** - Produces structured JSON with confidence scores

    **Key Features:**
    - Multi-turn tool calls (up to MAX_TOOL_CALLS_PER_RESPONSE)
    - Optional MCP tool integration
    - Structured output with confidence scoring (0-1)

    **SSE Events:**
    - `messageId`, `sources`, `answer`, `toolCall`, `toolResult`, `error`

    **Differences from v1:**
    - Agentic behavior with autonomous tool usage
    - MCP integration support
    - Tool execution visibility in SSE stream.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: lightsabers
  operationId: startAgenticConversation
  security: []
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - name: x-redocly-ai-assistant-identity
      in: header
      required: false
      description: >-
        Identity JWT minted by the embedding page's backend. Verified against the project's
        `aiAssistant.identityVerification` config; verified tokens carry the visitor's RBAC teams,
        so the assistant can use RBAC-protected content. Invalid or expired tokens degrade the
        answer to anonymous access instead of failing the request.
      schema:
        type: string
      example: 'eyJhbGciOiJSUzI1NiJ9.eyJhdWQiOiJyZWRvY2x5LWFpLWFzc2lzdGFudCJ9.signature'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ai-conversation/Message.yaml
  responses:
    '201':
      description: AI conversation started (Server-Sent Events stream).
      headers:
        x-redocly-ai-assistant-identity-status:
          description: >-
            Verification status of the identity token for this request. `absent` means the
            request carries no token.
          schema:
            type: string
            enum: [ok, absent, invalid, expired]
          example: ok
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
