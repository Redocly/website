get:
  tags:
    - Homepage
  security:
    - UserCookie: []
    - {}  # For public access
  summary: Redirect to organization or login
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: redirectToLastVisitedOrganization
  description: Redirects the user to their last visited organization, to the login page if not authenticated, or to the switch-login-method page when the organization requires SSO and the session uses a different login method.
  parameters:
    - in: cookie
      name: organizationContext
      schema:
        type: string
      required: false
      description: ID of the last visited organization.
      example: org_1234567890
  responses:
    '307':
      description: Redirects to the appropriate page.
      headers:
        Location:
          schema:
            type: string
          description: URL to redirect to (organization page, login page, or switch-login-method page).
          example: "https://app.cloud.redocly.com/switch-login-method/acme"
