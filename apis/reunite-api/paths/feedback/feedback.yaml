get:
  tags:
    - Feedback
  security:
    - InternalAuth: []
    - UserCookie: []
    - ApiKey: []
    - OAuth2: ['project.feedback.read']
  summary: Retrieve a feedback item
  description: |-
    Retrieve a feedback item.
    
    Requires `project.feedback.read` permission.
  x-internal: false
  x-rateLimit:
    events: 1000
    window: 1m
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: getFeedback
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/FeedbackId.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/feedback/Feedback.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
patch:
  tags:
    - Feedback
  security:
    - UserCookie: []
    - ApiKey: []
    - OAuth2: ['project.feedback.update']
  summary: Partially update a feedback item
  description: |-
    Partially update a feedback item.
    
    Requires `project.feedback.update` permission.
  x-internal: false
  x-rateLimit:
    events: 1000
    window: 1m
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: updateFeedback
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/FeedbackId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/feedback/PatchFeedbackRequest.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/feedback/Feedback.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
delete:
  tags:
    - Feedback
  security:
    - UserCookie: []
    - ApiKey: []
    - OAuth2: ['project.feedback.delete']
  summary: Delete a feedback item
  description: |-
    Delete a feedback item.
    
    Requires `project.feedback.delete` permission.
  x-internal: false
  x-rateLimit:
    events: 1000
    window: 1m
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: deleteFeedback
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/FeedbackId.yaml
  responses:
    '204':
      $ref: ../../common/responses/NoContent.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
