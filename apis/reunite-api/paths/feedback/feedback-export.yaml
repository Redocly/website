get:
  tags:
    - Feedback
  summary: Export feedback report
  description: |-
    Download a feedback report as CSV or JSON file.
    Response Content-Type is `text/csv` when `format=csv` and `application/json` when `format=json`.

    Requires `project.feedback.read` permission.
  x-internal: false
  x-rateLimit:
    events: 10
    window: 1m
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: exportFeedbackReport
  security:
    - UserCookie: []
    - ApiKey: []
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - name: format
      in: query
      required: false
      description: Export file format. Defaults to `csv`.
      schema:
        type: string
        enum:
          - csv
          - json
        default: csv
      example: csv
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - name: limit
      description: |-
        Maximum number of feedback rows to include in the export (from the current sort order).

        When omitted, the export includes up to the server maximum for a single file.
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 100000
      example: 10000
    - $ref: ../../common/components/parameters/query/Sort.yaml
      description: |-
        Feedback report can be sorted by the following properties:
          - `id`
          - `createdAt`
          - `path`
          - `email`
          - `score`
          - `agent`
          - `targetFeature`

        To sort in descending order, prefix the field with `-` (for example `-createdAt`).
        To sort in ascending order, use the field name without a prefix (for example `createdAt`).

        By default, feedback report is sorted by `id` in descending order, which corresponds to the newest feedback first.
    - $ref: ../../common/components/parameters/query/Filter.yaml
      description: |-
        Filter feedback by:
          - `createdAt`
          - `email`
          - `path`
          - `location`
          - `comment`
          - `internalComment`
          - `agent`
          - `targetFeature`
          - `status` (one of `NEW`, `IN_REVIEW`, `RESOLVED`, `ARCHIVED`, `SPAM`)
          - `feedbackComponent` (one of `SENTIMENT`, `RATING`, `COMMENT`, `MOOD`, `PROBLEM`, `SCALE`)
          - `origin` (one of `FORM`, `API`, `MCP`)

        This field requires a special format.

        For more information, see
        [Using filter with collections](#section/pagination).
    - $ref: ../../common/components/parameters/query/Search.yaml
      description: |-
        Search feedback by query string.

        Feedback is searched by:
          - `email`
          - `path`
          - `location`
          - `comment`
          - `internalComment`
          - `agent`
          - `targetFeature`
  responses:
    '200':
      description: |-
        Export file. Media type depends on the `format` query parameter.

        The response is sent as a download: `Content-Disposition` is `attachment` with a generated filename unless the server chooses otherwise.

        Default filename pattern: `feedback_export_{orgId}_{projectId}_{timestamp}.{format}`,
        where `{timestamp}` is milliseconds since the Unix epoch and `{format}` is either `csv` or `json`.
      headers:
        Content-Disposition:
          description: |-
            Attachment hint for browsers and HTTP clients. Includes the suggested filename in the `filename` parameter (quoted).

            By default the filename follows `feedback_export_{orgId}_{projectId}_{timestamp}.{format}`,
            using the same `orgId` and `projectId` as in the path and a millisecond timestamp.
          schema:
            type: string
          example: attachment; filename="feedback_export_org_01hh1t9sa6gwfv5naz04gr7ehm_prj_01hh1t9sa6gwfv5naz04gr7ehm_1715432100123.csv"
      content:
        text/csv:
          schema:
            type: string
            format: binary
        application/json:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
