post:
  tags:
    - Session
  security: []
  summary: Update access token expiration time
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: refresh
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/session/RefreshSession.yaml
  responses:
    '200':
      description: Returns refresh token for extended session.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/session/SessionToken.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
