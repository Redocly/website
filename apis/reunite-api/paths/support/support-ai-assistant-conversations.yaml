get:
  tags:
    - Support
  security:
    - Support: []
  summary: List all AI assistant conversations
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  operationId: listSupportAiAssistantConversations
  description: |-
    Lists AI assistant conversations grouped by search session across all organizations.
    Supports the same filters as the messages list; a conversation matches when any of its messages match.
  parameters:
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/support-ai-assistant/SupportAiAssistantConversationSummaryList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
