get:
  tags:
    - Support
  security:
    - Support: []
  summary: Retrieve a full AI assistant conversation
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  operationId: getSupportAiAssistantConversation
  description: |-
    Returns all messages of a single AI assistant conversation (search session) ordered by time.
  parameters:
    - name: conversationId
      description: Identifier of the conversation (search session).
      in: path
      required: true
      schema:
        type: string
      example: '01HV5XK1T2J9R8Z3Q4W5E6R7T8'
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/support-ai-assistant/SupportAiAssistantConversation.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
