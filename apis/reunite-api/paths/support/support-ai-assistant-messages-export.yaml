get:
  tags:
    - Support
  security:
    - Support: []
  summary: List all AI assistant messages as a CSV file
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  operationId: listSupportAiAssistantMessagesCsv
  description: |-
    Downloads AI assistant messages as a CSV file for offline analysis.
    Honors the same filters and search as the messages list.
    The export is capped at 100,000 rows; narrow the filters (for example, the time range)
    if a matching result set could exceed that.
  parameters:
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
  responses:
    '200':
      description: Export file.
      content:
        text/csv:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
