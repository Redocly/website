get:
  tags:
    - Support
  x-internal: true
  security:
    - UserCookie: []
  operationId: listSupportAnnouncements
  summary: List all support announcements
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/announcement/AnnouncementList.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
post:
  tags:
    - Support
  x-internal: true
  security:
    - UserCookie: []
  operationId: createAnnouncement
  summary: Create announcement
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            title:
              type: string
              description: Title of the announcement. Recommended maximum 70 characters to fit on one line in the modal.
              example: "What's New: Enhanced Respect Monitoring"
            content:
              type: string
              description: Markdown content of the announcement.
              example: "We've added new features to Respect Monitoring. Check out our [blog post](https://redocly.com/blog) for more details."
            mediaUrl:
              type: string
              format: uri
              description: URL to the media file (image or GIF) displayed in the announcement.
              example: "https://s3.us-east-1.amazonaws.com/stage-bh-announcements-cdn/announcements/01h1s5z6vf2mm1mz3hevnn9va7.gif"
            buttons:
              type: object
              description: Button configuration for the announcement.
              properties:
                primary:
                  type: object
                  properties:
                    text:
                      type: string
                      example: "Explore Respect Monitoring"
                    url:
                      type: string
                      format: uri
                      example: "https://redocly.com/docs/monitoring"
                    action:
                      type: string
                      example: "explore_monitoring"
                secondary:
                  type: object
                  properties:
                    text:
                      type: string
                      example: "View documentation"
                    url:
                      type: string
                      format: uri
                      example: "https://redocly.com/docs"
                    action:
                      type: string
                      example: "view_docs"
            products:
              type: array
              description: Optional list of product badges shown in the announcement.
              items:
                type: string
                enum:
                  - reunite
                  - realm
                  - redoc
                  - reef
                  - revel
            scheduledStartAt:
              type: string
              format: date-time
              description: Date and time when the announcement should start being displayed.
            scheduledEndAt:
              type: string
              format: date-time
              description: Date and time when the announcement should stop being displayed.
          required:
            - title
            - content
  responses:
    '201':
      description: Announcement created.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/announcement/Announcement.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
