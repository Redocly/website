post:
  tags:
    - Support
  security:
    - Support: []
  summary: Create a Redocly login link for an SSO-only portal or MCP URL
  description: >-
    Follows the portal or MCP OAuth redirect chain to the SSO authorize URL,
    rejecting private, loopback, and non-https hops along the way. On success it
    rewrites login_type to the support login value and returns the authorize URL.
    When the portal cannot be reached (WAF or IP allowlist) or the URL is not
    https, it returns needsManualInput so the authorize URL can be pasted by hand.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: generateSsoLoginLinkForSupport
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/sso-login-helper/SsoLoginLinkRequest.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/sso-login-helper/SsoLoginLinkResult.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
