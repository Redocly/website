get:
  summary: List all uptime monitoring targets
  description: >
    Internal Prometheus `http_sd` discovery endpoint. Returns the inventory of
    project URLs eligible for uptime monitoring, each as an `http_sd` target
    group with labels. See https://prometheus.io/docs/prometheus/latest/http_sd/.


    Eligible projects have at least one successful production build and belong to
    an organization with an active, canceled, or unset subscription.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: borsch
  tags:
    - Uptime monitoring
  security:
    - InternalAuth: []
  operationId: listUptimeTargets
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/uptime-monitoring/UptimeTarget.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
