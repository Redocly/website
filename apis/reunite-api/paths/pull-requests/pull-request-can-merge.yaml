get:
  tags:
    - Pull requests
  security:
    - UserCookie: []
  operationId: canMergePullRequest
  summary: Get if pull request can be merged
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: blips-and-chitz
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/PullRequestId.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/pull-request/CanMergePullRequest.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
