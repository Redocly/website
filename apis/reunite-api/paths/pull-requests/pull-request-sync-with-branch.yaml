patch:
  tags:
    - Pull requests
  security:
    - UserCookie: []
  operationId: syncPullRequestWithBranch
  summary: Sync pull request with branch
  description: Temporary internal endpoint to sync pull requests with branches.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: blips-and-chitz
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/PullRequestId.yaml
  responses:
    '200':
      description: Pull Request data after sync.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/pull-request/SyncPullRequestBranch.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
