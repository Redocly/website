get:
  tags:
    - Pull requests
  security:
    - UserCookie: []
  operationId: getReview
  summary: Retrieve a review
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: blips-and-chitz
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/ReviewId.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/pull-request-reviews/Review.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
put:
  tags:
    - Pull requests
  security:
    - UserCookie: []
    - InternalAuth: []
  operationId: updateReview
  summary: Replace a review
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: blips-and-chitz
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/ReviewId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/pull-request-reviews/UpdateReview.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/pull-request-reviews/Review.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
delete:
  tags:
    - Pull requests
  security:
    - UserCookie: []
  operationId: deleteReview
  summary: Delete a review
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: blips-and-chitz
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/ReviewId.yaml
  responses:
    '204':
      description: No Content.
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml