put:
  tags:
    - Pull requests
  security:
    - UserCookie: []
  summary: Commit suggestions
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: blips-and-chitz
  operationId: commitSuggestions
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/PullRequestId.yaml
    - $ref: ../../components/parameters/path/FilePath.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            content:
              type: string
              description: New content.
              example: content
            lineFrom:
              type: integer
              minimum: 1
              description: From 1-based line number, if not provided, updates whole file.
              example: 2
            lineTo:
              type: integer
              minimum: 1
              description: To 1-based line number, if not provided, updates one line.
              example: 4
            message:
              type: string
              description: Commit message.
              example: commit message
            commitHash:
              type: string
              description: Commit hash.
              example: commit hash
          required:
            - content
  responses:
    '204':
      $ref: ../../common/responses/NoContent.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
