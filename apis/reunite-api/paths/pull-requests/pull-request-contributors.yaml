get:
  tags:
    - Pull requests
  security:
    - UserCookie: []
  summary: List all pull request contributors
  description: >-
    Get all users that contributed to the given pull requests, including external
    users that are not organization members.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: blips-and-chitz
  operationId: listPullRequestContributors
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - name: pullRequestId
      description: One or more pull request IDs to list contributors for.
      required: true
      in: query
      style: form
      explode: true
      example: [pr_01h1s5z6vf2mm1mz3hevnn9va7]
      schema:
        type: array
        minItems: 1
        items:
          type: string
          pattern: ^pr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          example: pr_01h1s5z6vf2mm1mz3hevnn9va7
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/pull-request-contributors/PullRequestContributorList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
