get:
  tags:
    - Git
  security:
    - UserCookie: []
  summary: List all namespaces
  description: |
    Returns namespaces for a given connection.

    Namespace is a generic name for top level entity across different Git providers.
    For example,
    - in GitHub it is called "owner"
    - in GitLab it is called "namespace"
    - in Bitbucket Cloud it is called "workspace"
    - in Bitbucket DataCenter/Server it is called "project"
    - in Azure DevOps it is called "organization" (TODO: need to confirm, thanks copilot!)

    This namespace should be used for subsequent calls to get repositories, branches, etc.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  operationId: listNamespaces
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/CredentialId.yaml
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
  responses:
    '200':
      description: Namespaces list.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/git/NamespaceList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
