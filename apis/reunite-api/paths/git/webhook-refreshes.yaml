put:
  tags:
    - Git
  security:
    - Support: []
  summary: Create Git webhook refresh
  description: Refreshes the Git webhook for a repository using the provided credential.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  operationId: createGitWebhookRefresh
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/CredentialId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/git/RefreshGitWebhookRequest.yaml
  responses:
    '200':
      description: Git webhook refresh completed.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/git/RefreshGitWebhookResponse.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
