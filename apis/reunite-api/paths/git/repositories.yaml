get:
  tags:
    - Git
  security:
    - UserCookie: []
  summary: List all repositories
  description: |
    Returns repositories list for a given connection.

    > Note: Omit `namespace` query parameter for GiLab Cloud when you use Project Access Token.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  operationId: listRepositories
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/CredentialId.yaml
    - $ref: ../../components/parameters/query/NamespaceInfo.yaml
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
  responses:
    '200':
      description: Repositories list.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/git/RepositoryList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
