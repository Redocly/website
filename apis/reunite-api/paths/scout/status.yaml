post:
  tags:
    - Scout
  security:
    - ApiKey: []
  summary: Push status
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  description: Scout uses this to periodically report it's status back to main api.
  operationId: reportStatus
  parameters:
    - $ref: ../../components/parameters/header/X-Redocly-Scout-Version.yaml
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/scout/Status.yaml
  responses:
    '204':
      description: No content.
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
