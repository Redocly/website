get:
  tags:
    - Scout
  security:
    - ApiKey: []
  summary: Retrieve a task
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  description: Get task.
  operationId: getJobById
  parameters:
    - $ref: ../../components/parameters/header/X-Redocly-Scout-Version.yaml
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - name: jobId
      description: Job ID. Unique identifier prefixed with `sjob_`.
      required: true
      in: path
      schema:
        type: string
        pattern: ^sjob_[0-9abcdefghjkmnpqrstvwxyz]{26}$
      example: sjob_01h2t9ksv7vmsvbhh5ty40zctw
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/scout/Job.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
patch:
  tags:
    - Scout
  security:
    - ApiKey: []
  summary: Partially update a job
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  description: |-
    Scout sends this API request after completing a job.
    Supports only `PROCESSING` -> `COMPLETED` and `PROCESSING` -> `FAILED` transitions.
  operationId: updateJob
  parameters:
    - $ref: ../../components/parameters/header/X-Redocly-Scout-Version.yaml
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - name: jobId
      description: Job ID. Unique identifier prefixed with `sjob_`.
      required: true
      in: path
      schema:
        type: string
        pattern: ^sjob_[0-9abcdefghjkmnpqrstvwxyz]{26}$
      example: sjob_01h2t9ksv7vmsvbhh5ty40zctw
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/scout/PatchJob.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/scout/Job.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
