get:
  summary: List all link checks
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: lightsabers
  tags:
    - Link checks
  security:
    - UserCookie: []
  operationId: listLinkChecks
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/link-check/LinkCheckList.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
post:
  tags:
    - Link checks
  security:
    - InternalAuth: []
  summary: Create link check
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: lightsabers
  operationId: createLinkCheck
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/link-check/LinkCheck.yaml
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/link-check/LinkCheck.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '409':
      $ref: ../../common/responses/ConflictError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
