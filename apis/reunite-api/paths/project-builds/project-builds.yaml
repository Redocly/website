get:
  tags:
    - Project builds
  security:
    - UserCookie: []
    - InternalAuth: []
  summary: List all project builds
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: borsch
  operationId: listProjectBuilds
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    # Pagination
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            type: object
            properties:
              # TODO: move to separate file
              object:
                type: string
                enum: [list]
              page:
                $ref: ../../components/schemas/Page.yaml
              data:
                type: array
                minItems: 0
                items:
                  $ref: ../../components/schemas/project-build/ProjectBuildResponse.yaml
              items:
                type: array
                minItems: 0
                items:
                  $ref: ../../components/schemas/project-build/ProjectBuildResponse.yaml
                deprecated: true
              total:
                type: number
            required:
              - object
              - page
              - items
              - data
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
post:
  tags:
    - Project builds
  security:
    - UserCookie: []
  summary: Create project build
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: borsch
  operationId: createProjectBuild
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/project-build/CreateProjectBuild.yaml
  responses:
    '201':
      description: New project build created.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/project-build/ProjectBuildDetailedResponse.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
