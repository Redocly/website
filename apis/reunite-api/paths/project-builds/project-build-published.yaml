get:
  tags:
    - Project builds
  security:
    - UserCookie: []
  summary: Get published project build
  description: Retrieves the latest successfully published deployment for a project. This endpoint finds the most recent successful deployment and returns its associated project build details.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: borsch
  operationId: getPublishedProjectBuild
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  responses:
    '200':
      description: Published project build retrieved successfully.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/project-build/ProjectBuildDetailedResponse.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
