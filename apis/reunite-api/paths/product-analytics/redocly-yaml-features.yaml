get:
  operationId: listFeatures
  summary: List all available features
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  tags:
    - Product analytics
  security:
    - Support: []
  description: |-
    List of available features from the schema.
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/product-analytics/RedoclyYamlFeatureNamesList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml