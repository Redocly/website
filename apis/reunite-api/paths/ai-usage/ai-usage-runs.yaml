post:
  tags:
    - AI usage
  security:
    - InternalAuth: []
  summary: Create AI usage run
  description: Creates an AI usage run for internal worker accounting.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: createAiUsageRun
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ai-usage/AiUsageRun.yaml
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ai-usage/AiUsageRun.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
