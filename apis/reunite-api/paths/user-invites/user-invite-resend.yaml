post:
  tags:
    - User invites
  security:
    - UserCookie: []
  summary: Resend the invitation email to the current user
  description: >-
    Resends the invitation email for a pending invite addressed to the current
    user. The invite email must match the authenticated user's email, otherwise
    the request is rejected with `403`. An invite can only be resent once every
    60 seconds; earlier attempts are rejected with `400`.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: resendUserInvite
  parameters:
    - $ref: ../../components/parameters/path/InviteId.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/user-invites/UserInvite.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
