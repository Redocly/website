get:
  summary: Retrieve scorecard details
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  tags:
    - Scorecards
  security:
    - InternalAuth: []
  operationId: getScorecardDetails
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/ScorecardId.yaml
    - name: contentPath
      in: path
      schema:
        type: string
        description: URL encoded path in the project.
      example: '%2Fdocs%2Fapi%2Fpayments'
      required: true
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/scorecards/ScorecardDetails.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
