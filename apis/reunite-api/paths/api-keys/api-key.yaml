get:
  tags:
    - API keys
  security:
    - UserCookie: []
  summary: Retrieve an API key
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: getApiKeyById
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ApiKeyId.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/api-key/ApiKey.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
put:
  tags:
    - API keys
  security:
    - UserCookie: []
  summary: Replace an API key
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: updateApiKey
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ApiKeyId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/api-key/ApiKey.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/api-key/ApiKey.yaml
    '201':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/api-key/ApiKey.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
delete:
  tags:
    - API keys
  security:
    - UserCookie: []
  summary: Delete an API key
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: deleteApiKey
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ApiKeyId.yaml
  responses:
    '204':
      $ref: ../../common/responses/NoContent.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
