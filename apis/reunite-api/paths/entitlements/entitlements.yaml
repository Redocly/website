get:
  security: []
  summary: Get public key in jwks format for verifying plan gates
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  tags:
    - Entitlements
  operationId: entitlementsJwks
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            type: object
            properties:
              keys:
                type: array
                minItems: 1
            required:
              - keys
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml