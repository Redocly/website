post:
  tags:
    - Respect Monitoring
  security:
    - UserCookie: []
  summary: Create Respect Monitoring workflow run
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: createWorkflowRun
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/api-monitoring/ApiMonitoringWorkflowRun.yaml
  responses:
    '201':
      description: Respect Monitoring workflow run created.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/api-monitoring/ApiMonitoringWorkflowRun.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
get:
  tags:
    - Respect Monitoring
  security:
    - UserCookie: []
  summary: List all Respect Monitoring workflow runs
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: listWorkflowRuns
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/api-monitoring/ApiMonitoringWorkflowRunList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
