post:
  tags:
    - Pull requests
  security:
    - UserCookie: []
  operationId: createPullRequestReviewRequest
  summary: Create pull request review request
  description: >-
    Re-request a review from a reviewer that has already submitted a review
    (APPROVED, COMMENTED, or REQUESTED_CHANGES). All prior non-draft reviews
    for that reviewer on the given pull request are marked as dismissed, and a
    `REQUESTED_REVIEW` timeline event is emitted. The reviewer then appears as
    pending again in the UI.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: blips-and-chitz
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/pull-request-review-requests/CreatePullRequestReviewRequest.yaml
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/pull-request-review-requests/PullRequestReviewRequest.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
