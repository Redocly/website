post:
  tags:
    - Code completions
  security:
    - UserCookie: []
  summary: Create code completion
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  description: Create a code completion.
  operationId: createCodeCompletion
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/code-completions/CodeCompletionRequest.yaml
  responses:
    '201':
      description: Code completion created successfully.
      content:
        application/json:
          schema:
            description: Created code completion.
            $ref: ../../components/schemas/code-completions/CodeCompletionResponse.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
      description: Code completion cannot be created.
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
