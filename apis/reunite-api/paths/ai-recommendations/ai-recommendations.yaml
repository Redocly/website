post:
  tags:
    - AI Recommendations
  security:
    - UserCookie: []
  summary: Get scaffold feature suggestions for a new project
  description: |-
    Accepts a project description and a list of already-selected features,
    then returns AI-suggested features from a predefined catalog. Each
    suggestion includes a short reason explaining why the feature fits
    the description.

    The frontend calls this endpoint on a debounce while the user types
    a project description in the "Scaffold with AI" flow.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: suggestFeatures
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ai-recommendation/AiRecommendationRequest.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ai-recommendation/AiRecommendationResponse.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
