get:
  operationId: listSupportRemotes
  summary: List all support remotes
  description: Lists Git remotes for the selected provider that have repository and credential data and are attached to usable credentials. Intended for support operations.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  security:
    - Support: []
  tags:
    - Remotes
  parameters:
    - name: filter
      in: query
      required: true
      description: Filter expression. Only `providerType:<GitProviderType>` is supported.
      schema:
        type: string
      example: providerType:GITLAB_CLOUD
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/remotes/SupportRemoteList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml