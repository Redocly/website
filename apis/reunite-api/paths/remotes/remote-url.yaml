get:
  tags:
    - Remotes
  security:
    - InternalAuth: []
    - UserCookie: []
  summary: Get remote content url
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  description: Get remote content url for cloning repo or downloading file.
  operationId: getRemoteUrl
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/RemoteId.yaml
  responses:
    '200':
      description: Remote Content URL.
      content:
        application/json:
          schema:
            type: object
            properties:
              url:
                type: string
                description: Remote Content URL.
                example: https://oauth2:ghs_mYIRQsBTztLR6ejwlKYdjNOkvuXQbd31A6q1@github.com/some-gh-org/repo.git
              type:
                type: string
                enum:
                  - GIT
                  - URL
                description: Remote Content type.
            required:
              - url
              - type
          examples:
            Git:
              value:
                url: https://oauth2:ghs_mYIRQsBTztLR6ejwlKYdjNOkvuXQbd31A6q1@github.com/some-gh-org/repo.git
                type: GIT
            Url:
              value:
                url: https://some-host/main/examples/v3.0/petstore.yaml
                type: URL
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
