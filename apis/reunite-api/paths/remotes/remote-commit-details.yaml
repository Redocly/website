get:
  tags:
    - Remotes
  security:
    - UserCookie: []
    # TODO: Move this endpoint to git module with remoteId as query parameter
  summary: Retrieve a Git remote content commit details
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  description: Get commit details by SHA1 of the remote content with type GIT.
  operationId: getGitRemoteCommitDetails
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/RemoteId.yaml
    - $ref: ../../components/parameters/path/CommitSha.yaml
  responses:
    '200':
      description: Git Remote Content commit details.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/git/CommitDetailsSchema.yaml
          example:
            message: Initial commit
            sha: '1234567890'
            url: https://gitlab.com/org/project/commit/1234567890
            author:
              username: user
              email: user@mail.com
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
