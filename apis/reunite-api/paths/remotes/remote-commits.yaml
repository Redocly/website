parameters: 
  - $ref: ../../components/parameters/path/OrgId.yaml
  - $ref: ../../components/parameters/path/ProjectId.yaml
get:
  tags:
    - Remotes
  security:
    - UserCookie: []
    - InternalAuth: []
  operationId: listRemoteCommits
  summary: List all remote content commits
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  parameters:
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml 
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/remotes/RemoteCommitList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
post: 
  tags: 
    -  Remotes
  security:
    - UserCookie: []
  operationId: createRemoteCommit
  summary: Create remote content commit
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/remotes/RemoteCommit.yaml
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/remotes/RemoteCommit.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml