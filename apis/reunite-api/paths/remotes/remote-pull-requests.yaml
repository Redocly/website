get:
  tags:
    - Remotes
  security:
    - InternalAuth: []
  summary: List all pull requests in a remote content's upstream repository
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  description: |
    Lists pull requests in the provider repository that a GIT remote syncs from.
  operationId: listRemotePullRequests
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/RemoteId.yaml
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
  responses:
    '200':
      description: Pull requests in the provider repository.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/remote-pull-requests/RemotePullRequestList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
post:
  tags:
    - Remotes
  security:
    - InternalAuth: []
  summary: Upsert a pull request in a remote content's upstream repository
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  description: |
    Creates a pull request in the provider repository that a GIT remote syncs from,
    or returns the existing open pull request with the same source and target branches.
  operationId: upsertRemotePullRequest
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/RemoteId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/remote-pull-requests/CreateRemotePullRequest.yaml
  responses:
    '200':
      description: Created or existing open pull request.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/remote-pull-requests/RemotePullRequest.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
