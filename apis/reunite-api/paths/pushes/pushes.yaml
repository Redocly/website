post:
  operationId: push
  summary: Push files to remote
  x-internal: false
  x-rateLimit:
    events: 100000
    window: 1m
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  security:
    - UserCookie: []
    - ApiKey: []
  description: |-
    Push discovered files as a remote content.
    Files should be sent as a multipart/form-data.
    Commit details like commit message and author can be sent as a JSON object in the `commit` field.

    Requires `project.remotes.update` permission.
  tags:
    - Pushes
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    content:
      multipart/form-data:
        schema:
          $ref: ../../components/schemas/pushes/Push.yaml
  responses:
    '201':
      description: Content pushed.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/pushes/Push.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
get:
  tags:
    - Pushes
  security:
    - UserCookie: []
    - ApiKey: []
  summary: List all pushes
  description: |-
    List all pushes.

    Requires `project.remotes.read` permission.
  x-internal: false
  x-rateLimit:
    events: 100000
    window: 1m
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  operationId: listPushes
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
      description: |-
        Push list can be sorted by `id` only.

        To sort in descending order, use `-id`.
        To sort in ascending order, use `id`.

        By default, push list is sorted by `id` in descending order, which corresponds to the newest pushes first.
    - $ref: ../../common/components/parameters/query/Filter.yaml
      description: |-
        Filter pushes by:
          - `id`
          - `isMainBranch`
          - `replace`
          - `scoutJobId`

        This field requires a special format.

        For more information, see
        [Using filter with collections](#section/pagination).
    - $ref: ../../common/components/parameters/query/Limit.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
      description: |-
        Search pushes by query string.

        Pushes are searched by:
          - `id`
          - `isMainBranch`
          - `replace`
          - `scoutJobId`
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/pushes/PushList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
