patch:
  tags:
    - Pages usage
  operationId: reportPagesUsage
  summary: Report organization pages usage
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  description: Endpoint to report organization pages usage.
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
  security:
    - InternalAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/pages-usage/PagesUsage.yaml
  responses:
    '200':
      description: Pages usage reported successfully.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/pages-usage/PagesUsage.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml