get:
  tags:
    - Support
  security:
    - Support: []
  operationId: getUserForSupport
  summary: Retrieve a user with attributes (Support)
  description: 'Support team endpoint to retrieve user attributes including identity information.'
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  parameters:
    - $ref: ../../components/parameters/path/UserId.yaml
  responses:
    '200':
      description: User attributes retrieved successfully.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/users/User.yaml
              - type: object
                properties:
                  identityIds:
                    description: List of identity provider IDs associated with the user.
                    type: array
                    items:
                      type: string
                    example: ['2d084b93-fd77-416c-9abe-22f54458505d']
                  idpClaims:
                    description: JSON object containing identity provider claims.
                    type: object
                    additionalProperties: true
                    example:
                      sub: user@example.com
                      email: user@example.com
                      email_verified: true
                  kratosIdentity:
                    description: Kratos identity object if available.
                    type: [object, 'null']
                    additionalProperties: true
                  organizations:
                    description: List of organizations where the user is a member.
                    type: array
                    items:
                      type: object
                      properties:
                        organizationId:
                          type: string
                          description: Organization ID.
                        organizationSlug:
                          type: string
                          description: Organization slug.
                        role:
                          type: string
                          description: User role in the organization.
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
delete:
  tags:
    - Support
  security:
    - Support: []
  operationId: deleteUserForSupport
  summary: Delete a user account (Support)
  description: 'Support team endpoint to permanently delete user account by obfuscating personal data and removing all associated identities and sessions. This action is irreversible.'
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  parameters:
    - $ref: ../../components/parameters/path/UserId.yaml
  responses:
    '204':
      description: User account successfully deleted.
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
