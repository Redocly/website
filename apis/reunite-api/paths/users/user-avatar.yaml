get:
  tags:
    - Users
  security: []
  operationId: getUserAvatar
  summary: Retrieve a user avatar
  description: >-
    Streams a user avatar image by its unguessable ID. Public and immutably
    cacheable: the ID is unique per upload, so the URL changes whenever the
    avatar changes. The avatar URL is stored on the user's `imageUrl` field.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  parameters:
    - $ref: ../../components/parameters/path/AvatarId.yaml
  responses:
    '200':
      description: Avatar image stream.
      headers:
        Cache-Control:
          description: Immutable long-lived caching; the URL is content/version-addressed.
          schema:
            type: string
          example: public, max-age=31536000, immutable
        Access-Control-Allow-Origin:
          description: Allows the image to load from any origin (custom domains).
          schema:
            type: string
          example: '*'
        Cross-Origin-Resource-Policy:
          description: Allows cross-origin embedding under a cross-origin embedder policy.
          schema:
            type: string
          example: cross-origin
        X-Content-Type-Options:
          description: Prevents the browser from MIME-sniffing the response away from its declared type.
          schema:
            type: string
          example: nosniff
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
