get:
  tags:
    - AI jobs
  security:
    - UserCookie: []
  summary: List all AI scaffold availabilities
  description: |-
    Returns whether AI scaffold can currently be used to create a new project
    in this organization, along with a high-level reason when unavailable.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: listAiJobsAvailabilities
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ai-job/AiJobScaffoldAvailabilityList.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
