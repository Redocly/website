get:
  tags:
    - Teams
  security:
    - UserCookie: []
  summary: List all teams
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: listTeams
  description: |-
    Get all organization teams.

    The `filter` parameter supports the `managedBy` attribute: `filter=managedBy:idp` lists only teams
    synchronized from an identity provider, `filter=managedBy:reunite` lists only teams managed in Reunite.
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/teams/TeamsList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
post:
  tags:
    - Teams
  security:
    - UserCookie: []
  summary: Create team
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: createTeam
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
  requestBody:
    description: Team.
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/teams/CreateTeam.yaml
  responses:
    '201':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/teams/Team.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '409':
      description: This name is already taken.
      $ref: ../../common/responses/ConflictError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
