parameters:
  - $ref: ../../components/parameters/path/OrgId.yaml
  - $ref: ../../components/parameters/path/ProjectId.yaml

get:
  tags:
    - AI Writer Agent
  summary: List all source code repositories
  description: List source code repositories configured for writer agent context in a project.
  operationId: listSourceCodeRepositories
  x-internal: true
  x-catalogRelations: []
  security:
    - UserCookie: []
    - InternalAuth: []
  parameters:
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
  responses:
    '200':
      description: Source code repositories fetched successfully.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ai-writer-agent/SourceCodeRepositoryList.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml

post:
  tags:
    - AI Writer Agent
  summary: Create source code repository
  description: Creates a source code repository connection for writer agent context in a project.
  operationId: createSourceCodeRepository
  x-internal: true
  x-catalogRelations: []
  security:
    - UserCookie: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ai-writer-agent/SourceCodeRepository.yaml
  responses:
    '201':
      description: Source code repository created successfully.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ai-writer-agent/SourceCodeRepository.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '409':
      $ref: ../../common/responses/ConflictError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
