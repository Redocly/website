parameters:
  - $ref: ../../components/parameters/path/OrgId.yaml
  - $ref: ../../components/parameters/path/ProjectId.yaml
  - $ref: ../../components/parameters/path/SourceCodeRepositoryId.yaml

get:
  tags:
    - AI Writer Agent
  summary: Get source code repository clone URL
  description: Returns the authenticated clone URL for a source code repository. Accessible only to internal services.
  operationId: getSourceCodeRepositoryCloneUrl
  x-internal: true
  x-catalogRelations: []
  security:
    - InternalAuth: []
  responses:
    '200':
      description: Clone URL fetched successfully.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ai-writer-agent/SourceCodeRepositoryCloneUrl.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
