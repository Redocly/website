put:
  tags:
    - AI Writer Agent
  summary: Upsert writer agent notifications Slack config
  description: Creates or updates the writer agent Slack notifications configuration for a project.
  operationId: upsertWriterAgentNotificationsSlackConfig
  x-internal: true
  x-catalogRelations: []
  security:
    - UserCookie: []
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ai-writer-agent/WriterAgentNotificationsSlackConfig.yaml
  responses:
    '200':
      description: Configuration created or updated successfully.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ai-writer-agent/WriterAgentNotificationsSlackConfig.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
get:
  tags:
    - AI Writer Agent
  summary: List all writer agent notifications Slack configs
  description: Lists the writer agent Slack notifications configurations of a project.
