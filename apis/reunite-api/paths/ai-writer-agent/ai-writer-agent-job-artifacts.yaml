parameters:
  - $ref: ../../components/parameters/path/OrgId.yaml
  - $ref: ../../components/parameters/path/ProjectId.yaml
  - $ref: ../../components/parameters/path/AiJobId.yaml

get:
  tags:
    - AI Writer Agent
  summary: Get writer agent job artifacts
  description: Lists the reasoning artifacts along with short-lived signed download links persisted by a writer agent job.
  operationId: getWriterAgentJobArtifacts
  x-internal: true
  x-catalogRelations: []
  security:
    - InternalAuth: []
    - UserCookie: []
  responses:
    '200':
      description: Writer agent job artifacts.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ai-writer-agent/AiWriterAgentJobArtifacts.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
