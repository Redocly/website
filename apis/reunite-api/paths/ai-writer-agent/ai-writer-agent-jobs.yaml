post:
  tags:
    - AI Writer Agent
  summary: Create a writer agent job
  description: >-
    Dispatches a writer agent job for a specific project. Supports both
    manual dispatches initiated by a user (session auth) and automated scheduled
    triggers initiated by the Temporal scheduler worker (internal auth).
  operationId: createWriterAgentJob
  x-internal: true
  x-catalogRelations: []
  security:
    - InternalAuth: []
    - UserCookie: []
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            options:
              oneOf:
                - $ref: ../../components/schemas/ai-job/AiWriterAgentManualJobOptions.yaml
                - $ref: ../../components/schemas/ai-job/AiWriterAgentScheduledJobOptions.yaml
          required:
            - options
  responses:
    '201':
      description: Created AI Job.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ai-job/AiJob.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '409':
      $ref: ../../common/responses/ConflictError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
