parameters:
  - $ref: ../../components/parameters/path/OrgId.yaml
  - $ref: ../../components/parameters/path/ProjectId.yaml
  - $ref: ../../components/parameters/path/AiJobId.yaml

post:
  tags:
    - AI Writer Agent
  summary: Add the pull request comments without a job to this job
  description: >-
    Finds the pull request comments that no AI job processes. Assigns them to this job.
    Returns all comments of this job. The AI worker calls this endpoint when a PR comment job starts.
    The worker calls it again until one call adds no new comment. The worker then processes these comments.
  operationId: addWriterJobComments
  x-internal: true
  x-catalogRelations: []
  security:
    - InternalAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            pullRequestId:
              description: Pull request ID. Unique identifier prefixed with `pr_`.
              type: string
              pattern: ^pr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
              example: pr_01h1s5z6vf2mm1mz3hevnn9va7
          required:
            - pullRequestId
  responses:
    '200':
      description: All comments of this job.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ai-job/AiJobComments.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml

patch:
  tags:
    - AI Writer Agent
  summary: Update the status of the pull request comments of this job
  description: >-
    Sets the status and the reason of each listed comment of this job. The AI worker calls this
    endpoint after the run. PROCESSED means the job made a change for the comment. SKIPPED means
    the job made no change for it. Returns all comments of this job.
  operationId: updateWriterJobComments
  x-internal: true
  x-catalogRelations: []
  security:
    - InternalAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ai-job/AiJobCommentsUpdate.yaml
  responses:
    '200':
      description: All comments of this job with their new status.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ai-job/AiJobComments.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
