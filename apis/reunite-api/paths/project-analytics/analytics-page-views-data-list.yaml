get:
  operationId: listAnalyticsPageViewsData
  tags:
    - Project analytics
  summary: List all page views logs data
  security:
    - UserCookie: []
    - InternalAuth: []
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: hot-dogs
  description: Returns a list of page views data entries for a specified project.
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../components/parameters/query/AnalyticsSort.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
  responses:
    '200':
      description: Page views data list response.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/project-analytics/AnalyticsPageViewsDataList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
