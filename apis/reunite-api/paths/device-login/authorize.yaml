post:
  x-internal: true
  tags:
    - Device Login
  security: []
  summary: Create new device authentication flow
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: authorizeDeviceLogin
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/device-login/Authorize.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/device-login/DeviceLogin.yaml
    '401':
      $ref: ../../common/responses/OAuthError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
