get:
  tags:
    - Audit log exports
  security:
    - ApiKey: []
    - UserCookie: []
    - OAuth2:
        - org.auditLogs.read
  operationId: getAuditLogExportJob
  summary: Retrieve an audit log export job
  description: |-
    {% configOptionRequirements plans=["Enterprise+"] /%}

    Retrieve the status of an audit log export job.
    Poll this endpoint until `status` is `COMPLETED`, then download the file from the export results endpoint.
  x-internal: false
  x-rateLimit:
    events: 1000
    window: 1m
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ExportJobId.yaml
  responses:
    '200':
      description: Export job.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/audit-log-exports/AuditLogExportJob.yaml
          example:
            id: exp_01hh1t9sa6gwfv5naz04gr7ehm
            status: COMPLETED
            createdAt: '2024-01-15T12:00:00.000Z'
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
