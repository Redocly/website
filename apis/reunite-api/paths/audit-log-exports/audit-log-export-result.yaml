get:
  tags:
    - Audit log exports
  security:
    - ApiKey: []
    - UserCookie: []
    - OAuth2:
        - org.auditLogs.read
  operationId: getAuditLogExportResult
  summary: Retrieve an audit log export file
  description: |-
    {% configOptionRequirements plans=["Enterprise+"] /%}

    Download the file generated by an audit log export job.
    The file is available only after the export job completes; while the job status is `IN_PROGRESS` or `FAILED`, this endpoint returns `404`.
  x-internal: false
  x-rateLimit:
    events: 1000
    window: 1m
  x-catalogRelations:
    - type: ownedBy
      key: hot-dogs
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ExportJobId.yaml
  responses:
    '200':
      description: |-
        Export file. Media type matches the `format` from the create-job request.
      headers:
        Content-Disposition:
          description: |-
            Attachment hint for browsers and HTTP clients. Suggested filename: `{exportJobId}.json` or `{exportJobId}.csv`.
          schema:
            type: string
          example: attachment; filename="exp_01hh1t9sa6gwfv5naz04gr7ehm.json"
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/audit-log-exports/AuditLogExportEvent.yaml
          example:
            - id: 'evt_2fxb8r4kq7m3ndp9z6ja501'
              object: 'event'
              type: 'com.redocly.pullRequest.created'
              time: '2026-03-31T15:27:30.815Z'
              subject: 'pr_7wnk3jm9xp2d4rv8qh5a01'
              actor:
                id: 'usr_01h2r5f6qy8kr42p8yfw52spq6'
                object: 'user'
                uri: 'https://app.cloud.redocly.com/api/users/usr_01h2r5f6qy8kr42p8yfw52spq6'
              clientIp: '198.51.100.42'
              projectId: 'prj_01hh1t9sa6gwfv5naz04gr7ehm'
              projectSlug: 'my-project'
        text/csv:
          schema:
            type: string
            format: binary
          example: |
            id,object,type,time,subject,actor,clientIp,projectId,projectSlug
            evt_2fxb8r4kq7m3ndp9z6ja501,event,com.redocly.pullRequest.created,2026-03-31T15:27:30.815Z,pr_7wnk3jm9xp2d4rv8qh5a01,"{""id"":""usr_01h2r5f6qy8kr42p8yfw52spq6"",""object"":""user"",""uri"":""https://app.cloud.redocly.com/api/users/usr_01h2r5f6qy8kr42p8yfw52spq6""}",198.51.100.42,prj_01hh1t9sa6gwfv5naz04gr7ehm,my-project

    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
