post:
  tags:
    - Audit log exports
  security:
    - ApiKey: []
    - UserCookie: []
    - OAuth2:
        - org.auditLogs.read
  operationId: createAuditLogExportJob
  summary: Start an audit log export job
  description: |-
    {% configOptionRequirements plans=["Enterprise+"] /%}

    Creates an asynchronous audit log export job. Poll the job status endpoint until `status` is `COMPLETED`, then download from the export results endpoint.
  x-internal: false
  x-rateLimit:
    events: 1000
    window: 1m
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - name: filter
      in: query
      required: false
      description: |-
        Standard list `filter` query. Supported fields for audit exports:
        - `type` — Event type. When omitted, exports include events of all types.
          Values must be valid audit log event types; unsupported values return `400`.

        Filter fields other than `type` are ignored.
      schema:
        type: string
      example: type:com.redocly.user.created
    - name: start
      in: query
      description: Start of the time range in YYYY-MM-DD format. When `end` is omitted, exports include events from `start` through `start + 31 days`.
      required: false
      example: '2026-01-01'
      schema:
        type: string
        format: date
    - name: end
      in: query
      description: End of the time range in YYYY-MM-DD format. When `start` is omitted, exports include events from `end - 31 days` through `end`. The time window between `start` and `end` must not exceed 31 days.
      required: false
      example: '2026-01-31'
      schema:
        type: string
        format: date
    - name: format
      in: query
      required: false
      schema:
        type: string
        enum:
          - json
          - csv
        default: json
      description: Output file format for the generated download.
      example: json
  responses:
    '201':
      description: Export job created.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/audit-log-exports/AuditLogExportJobCreated.yaml
          example:
            id: exp_01hh1t9sa6gwfv5naz04gr7ehm
            createdAt: '2024-01-15T12:00:00.000Z'
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml