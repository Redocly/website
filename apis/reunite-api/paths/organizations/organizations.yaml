post:
  tags:
    - Organizations
  security:
    - UserCookie: []
  summary: Create organization
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: createOrganization
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/organization/Organization.yaml
  responses:
    '201':
      description: New organization created.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/organization/Organization.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
get:
  tags:
    - Organizations
  security:
    - UserCookie: []
  summary: List all organizations
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: listOrganizations
  parameters:
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Before.yaml
    - $ref: ../../common/components/parameters/query/Sort.yaml
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/organization/OrganizationList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
