post:
  tags:
    - Organizations
  security:
    - UserCookie: []
  summary: Create artifact download URL
  description: >-
    Returns a presigned S3 GET URL for downloading an uploaded artifact by its
    object key. The URL forces an attachment download and is valid for 15
    minutes. Only artifacts belonging to the organization can be downloaded.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: createArtifactDownloadUrl
  parameters:
    - $ref: '../../components/parameters/path/OrgId.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/artifact/ArtifactDownloadUrlRequest.yaml'
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/artifact/ArtifactDownloadUrlResponse.yaml'
    '400':
      $ref: '../../common/responses/BadRequestError.yaml'
    '401':
      $ref: '../../common/responses/UnauthorizedError.yaml'
    '403':
      $ref: '../../common/responses/ForbiddenError.yaml'
    '500':
      $ref: '../../common/responses/InternalServerError.yaml'
