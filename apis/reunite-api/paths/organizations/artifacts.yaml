post:
  tags:
    - Organizations
  security:
    - UserCookie: []
  summary: Create artifact upload URL
  description: |-
    Returns a presigned S3 PUT URL and the resulting object key for uploading an
    artifact file. The `artifactType` field controls which validation rules
    (allowed MIME types, maximum size) apply.

    Upload the file directly to S3 using the returned `url` within 5 minutes,
    then pass the `key` in `fileUrls[]` when calling the create-project endpoint.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: createArtifactUploadUrl
  parameters:
    - $ref: '../../components/parameters/path/OrgId.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/artifact/ArtifactUploadUrlRequest.yaml'
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/artifact/ArtifactUploadUrlResponse.yaml'
    '400':
      $ref: '../../common/responses/BadRequestError.yaml'
    '401':
      $ref: '../../common/responses/UnauthorizedError.yaml'
    '403':
      $ref: '../../common/responses/ForbiddenError.yaml'
    '500':
      $ref: '../../common/responses/InternalServerError.yaml'

delete:
  tags:
    - Organizations
  security:
    - UserCookie: []
  summary: Delete artifact
  description: >-
    Deletes an uploaded artifact from storage by its S3 object key. The key must
    have been returned from the artifact upload URL endpoint. Only artifacts
    belonging to the organization can be deleted.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: deleteArtifactUploadUrl
  parameters:
    - $ref: '../../components/parameters/path/OrgId.yaml'
    - name: key
      in: query
      required: true
      example: ai-scaffold/org_123/session-uuid/openapi.yaml
      schema:
        type: string
        minLength: 1
      description: S3 object key of the artifact to delete (returned from createArtifactUploadUrl).
  responses:
    '204':
      description: No content. Artifact deleted.
    '400':
      $ref: '../../common/responses/BadRequestError.yaml'
    '401':
      $ref: '../../common/responses/UnauthorizedError.yaml'
    '403':
      $ref: '../../common/responses/ForbiddenError.yaml'
    '500':
      $ref: '../../common/responses/InternalServerError.yaml'
