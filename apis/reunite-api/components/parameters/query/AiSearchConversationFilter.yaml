name: filter
description: |-
  AI search conversation session to load messages for, as a single
  `conversationId:<id>` clause. Required; no other filter fields are supported.
in: query
required: true
schema:
  type: string
  minLength: 1
  maxLength: 270
example: 'conversationId:3c6db4fd-8492-4af5-b4de-b4ff0ecf89ea'
