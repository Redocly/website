type: object
properties:
  id:
    description: Identity domain ID. Unique identifier prefixed with `idd_`.
    type: string
    pattern: ^idd_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: idd_01h1s5z6vf2mm1mz3hevnn9va7
  object:
    description: Entity name.
    type: string
    enum: [identityDomain]
    readOnly: true
  domain:
    type: string
  status:
    type: string
    enum: [PENDING, REJECTED, VERIFIED]
  rejectReason:
    type:
      - 'null'
      - string
  uri:
    description: Canonical URI for the identity domain resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/identity-domains/idd_01h1s5z6vf2mm1mz3hevnn9va7
required:
  - id
  - domain
  - status
  - object
  - uri
