description: JSON object containing additional user metadata.
type: object
additionalProperties: false
example:
  leadSource:
    path: redocly.com/
  inviteId: inv_01hh1t9sa6gwfv5naz04gr7ehm
properties:
  leadSource:
    type: object
    properties:
      path:
        type: string
        example: 'redocly.com/'
      source:
        type: string
        example: 'redocly'
      medium:
        type: string
        example: 'organic'
      campaign:
        type: string
        example: 'redocly-campaign'
      referrer:
        type: string
        example: 'redocly-referrer'
      content:
        type: string
        example: 'redocly-content'
      term:
        type: string
        example: 'redocly-term'
      clickId:
        type: string
        description: |-
          Visitor ID that the lead source tracker writes once per browser.
          The tracker generates a UUIDv7, but the field accepts any string, because a `clickId` query parameter can also set it.
        example: '019935a0-7c3e-7d2a-9b1e-2f4c6a8d0e13'
  inviteId:
    type: string
    example: 'inv_01hh1t9sa6gwfv5naz04gr7ehm'
