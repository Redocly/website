type: object
title: PatchUserRequest
properties:
  name:
    description: User display name.
    type: string
    maxLength: 100
    pattern: ^[^:/.]+$
    example: john-smith
  firstName:
    description: User first name.
    type: [string, 'null']
    maxLength: 100
    pattern: ^[^:/.]+$
    example: John
  lastName:
    description: User last name.
    type: [string, 'null']
    maxLength: 100
    pattern: ^[^:/.]+$
    example: Smith
  imageUrl:
    description: >-
      User avatar. Accepts either a `data:` image URI (its encoded length is
      capped at 1 MB, roughly 750 KB of image data, and it is offloaded to a
      served avatar URL on store) or any absolute URL — for example an external
      avatar URL (such as an identity provider's) or the served
      `/user-avatars/{avatarId}` endpoint URL. Inline `data:` images are never
      persisted on the user record.
    type: [string, 'null']
    maxLength: 1048576
    example: data:image/png;base64,...
  notificationSettings:
    $ref: ../notifications/UpdateNotificationSettings.yaml
