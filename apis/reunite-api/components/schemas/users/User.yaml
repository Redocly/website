type: object
properties:
  id:
    description: User ID. Unique identifier prefixed with `usr_`.
    type: string
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: usr_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  name:
    description: User display name.
    type: string
    example: john.smith
  type:
    description: User type.
    type: string
    enum: [USER, API_KEY, SYSTEM]
    example: USER
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [user]
    readOnly: true
  uri:
    description: Canonical URI for the user resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/users/usr_01hh1t9sa6gwfv5naz04gr7ehm
  email:
    description: User email address.
    type: string
    format: email
    example: john.smith@example.com
    readOnly: true
  firstName:
    description: User first name.
    type: [string, 'null']
    example: John
  lastName:
    description: User last name.
    type: [string, 'null']
    example: Smith
  teams:
    $ref: ./UserTeams.yaml
    readOnly: true
  imageUrl:
    description: Image url.
    type: [string, 'null']
    format: uri
    example: https://example.com/image.png
  external:
    description: External user flag.
    type: boolean
    example: true
    default: false
    readOnly: true
  lastLoginAt:
    description: Datetime of last log in operation.
    type: [string, 'null']
    format: date-time
    example: '2023-05-30T08:30:17.592Z'
    readOnly: true
  notificationSettings:
    $ref: ../notifications/NotificationSettings.yaml
  metadata:
    $ref: ./UserMetadata.yaml
    readOnly: true
required:
  - id
  - name
  - type
  - uri
  - email
  - firstName
  - lastName
  - object
