type: object
properties:
  id:
    description: User ID. Unique identifier prefixed with `usr_`.
    type: string
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: usr_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [user]
    readOnly: true
  uri:
    description: Canonical URI for the organization user resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/users/usr_01hh1t9sa6gwfv5naz04gr7ehm
  name:
    description: User display name.
    type: string
    example: john.smith
    readOnly: true
  firstName:
    description: User first name.
    type: [string, 'null']
    example: John
    readOnly: true
  lastName:
    description: User last name.
    type: [string, 'null']
    example: Smith
    readOnly: true
  imageUrl:
    description: Image url.
    type: [string, 'null']
    format: uri
    example: https://example.com/image.png
    readOnly: true
  createdAt:
    description: Datetime of user creation.
    type: string
    format: date-time
    example: '2023-05-30T08:30:17.592Z'
    readOnly: true
required:
  - id
  - object
  - uri
  - name
  - firstName
  - lastName
