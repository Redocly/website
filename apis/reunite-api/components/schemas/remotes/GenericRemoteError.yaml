oneOf: 
  - type: 'null'
  - type: object
    properties:
      autoMerge: 
        type: object
        properties:
          message:
            type: string
            description: Error message describing the auto merge failure.
          timestamp:
            type: string
            format: date-time
            description: Timestamp of the error.
          buildId:
            type: string
            description: ID of the build that triggered the auto merge.
        required:
          - message
          - timestamp
    required:
      - autoMerge
readOnly: true