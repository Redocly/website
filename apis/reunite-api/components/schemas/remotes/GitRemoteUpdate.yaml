type: object
description: GIT remote update.
properties:
  id: 
    type: string
    description: GIT remote content update ID. Unique identifier prefixed with `grupd_`.
    pattern: ^grupd_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: grupd_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  remoteId:
    $ref: ./RemoteIdSchema.yaml
  status:
    $ref: ./RemoteUpdateStatus.yaml
    readOnly: true
  type:
    $ref: ./GitRemoteUpdateType.yaml
  createdById:
    type: string
    description: User ID update is triggered by. 
  headCommitId:
    type: string
    description: Head commit ID of GIT remote update. When remote gets update containing several commits introducing changes to connected folder, this field points to the latest commit.
  branchName:
    type: string
    description: Branch name update received from. 
  pullRequestNumber:
    type: string
    description: Pull request number associated with git remote update. 
  createdAt:
    type: string
    readOnly: true
    examples:
      - '2023-06-07T00:00:00Z'
    format: date-time
  updatedAt:
    type: string
    readOnly: true
    examples:
      - '2023-06-07T00:00:00Z'
    format: date-time
  startedAt:
    type: string
    readOnly: true
    examples:
      - '2023-06-07T00:00:00Z'
    format: date-time
  finishedAt:
    type: string
    readOnly: true
    examples:
      - '2023-06-07T00:00:00Z'
    format: date-time
  object:
    description: Entity name.
    type: string
    enum: [gitRemoteUpdate]
    readOnly: true
  uri:
    description: Canonical URI for the Git remote update resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/git-remote-updates/grupd_01h1s5z6vf2mm1mz3hevnn9va7
  error:
    oneOf:
      - type: 'null'
      - $ref: ./GenericRemoteUpdateError.yaml
required:
  - id
  - uri
  - remoteId
  - status
  - type
  - headCommitId
  - branchName
  - createdAt
  - updatedAt
  - object