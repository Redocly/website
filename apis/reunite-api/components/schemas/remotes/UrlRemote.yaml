type: object
required:
  - id
  - type
  - mountPath
  - mountBranchName
  - createdAt
  - updatedAt
  - editedAt
  - createdById
  - editedById
  - contentType
  - url
  - fileName
  - object
  - uri
properties:
  id:
    description: Remote ID. Unique identifier prefixed with `rem_`.
    type: string
    pattern: ^rem_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: rem_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  type:
    type: string
    const: URL
  mountPath:
    $ref: ./MountPath.yaml
  autoSync:
    $ref: ./AutoSync.yaml
  autoMerge:
    $ref: ./AutoMerge.yaml
  createdAt:
    type: string
    readOnly: true
    examples:
      - '2023-06-07T00:00:00Z'
    format: date-time
  updatedAt:
    type: string
    readOnly: true
    examples:
      - '2023-06-07T00:00:00Z'
    format: date-time
  editedAt:
    description: Date and time of upserting Remote by user.
    type:
      - string
      - 'null'
    readOnly: true
    examples:
      - '2023-06-07T00:00:00Z'
    format: date-time
  createdById:
    description: User ID who created Remote.
    type:
      - string
      - 'null'
    example: usr_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  editedById:
    description: User who recently upserted Remote.
    type:
      - string
      - 'null'
    example: usr_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  lastSyncedAt:
    $ref: ./LastSyncedAt.yaml
  attempts:
    $ref: ./SyncAttempts.yaml
  providerType:
    type: 'null'
    readOnly: true
  namespaceId:
    type: 'null'
    readOnly: true
  repositoryId:
    type: 'null'
    readOnly: true
  mountBranchName:
    $ref: ./MountBranchName.yaml
  contentPath:
    type: 'null'
    readOnly: true
  credentialId:
    type: 'null'
    readOnly: true
  branchName:
    type: 'null'
    readOnly: true
  contentType:
    type: string
    enum:
      - FOLDER
      - FILE
  url:
    description: URL to the remote content.
    type: string
    example: https://raw.githubusercontent.com/Redocly/museum-openapi-example/main/openapi.yaml
  interval:
    type: number
    description: Interval in seconds to sync URL remote content.
    minimum: 900
    default: 1800
    example: 900
  fileName:
    type: string
    description: File name of the remote content.
    example: openapi.yaml
  object:
    description: Entity name.
    type: string
    enum: [remote]
    readOnly: true
  lastFinishedUrlUpdateId:
    type:
      - string
      - 'null'
    description: ID of the last finished URL update.
    example: grupd_01jw8fczg4n4fcwkkg0nac3ddh
    readOnly: true
  errors:
    $ref: ./GenericRemoteError.yaml
  uri:
    type: string
    format: uri
    description: Canonical URI for the URL remote resource.
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/remotes/rem_01h1s5z6vf2mm1mz3hevnn9va7