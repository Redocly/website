type: object
required:
  - id
  - type
  - mountPath
  - mountBranchName
  - createdAt
  - updatedAt
  - editedAt
  - createdById
  - editedById
  - repositoryId
  - branchName
  - contentPath
  - contentType
  - providerType
  - credentialId
  - uri
  - object
properties:
  id:
    description: Remote ID. Unique identifier prefixed with `rem_`.
    type: string
    pattern: ^rem_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: rem_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  type:
    type: string
    const: GIT
  mountPath:
    $ref: ./MountPath.yaml
  autoSync:
    $ref: ./AutoSync.yaml
  autoMerge:
    $ref: ./AutoMerge.yaml
  createdAt:
    type: string
    readOnly: true
    examples:
      - '2023-06-07T00:00:00Z'
    format: date-time
  updatedAt:
    type: string
    readOnly: true
    examples:
      - '2023-06-07T00:00:00Z'
    format: date-time
  editedAt:
    description: Date and time of upserting Remote by user.
    type:
      - string
      - 'null'
    readOnly: true
    examples:
      - '2023-06-07T00:00:00Z'
    format: date-time
  createdById:
    description: User ID who created Remote.
    type:
      - string
      - 'null'
    example: usr_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  editedById:
    description: User who recently upserted Remote.
    type:
      - string
      - 'null'
    example: usr_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  lastSyncedAt:
    $ref: ./LastSyncedAt.yaml
  attempts:
    $ref: ./SyncAttempts.yaml
  providerType:
    $ref: ../git/GitProviderType.yaml
  namespaceId:
    description: Git repo namespace id (organization for GitHub).
    type:
      - string
      - 'null'
  repositoryId:
    description: Git repo id.
    type: string
  mountBranchName:
    $ref: ./MountBranchName.yaml
  contentPath:
    description: Path to the connected folder in the remote repository.
    type: string
  credentialId:
    type: string
    example: crd_01hc2rvwxf7jyj1er504khx8e7
    description: Credential ID.
  branchName:
    description: Branch name in the remote repository.
    type: string
    example: dev
  contentType:
    type: string
    enum:
      - FOLDER
      - FILE
    example: FILE
  url:
    type: 'null'
    readOnly: true
  interval:
    type: 'null'
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [remote]
    readOnly: true
  uri:
    description: Canonical URI for the remote resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/remotes/rem_01h1s5z6vf2mm1mz3hevnn9va7
  lastFinishedGitUpdateId:
    type:
      - string
      - 'null'
    description: ID of the last finished Git update.
    readOnly: true
    example: grupd_01jw8fczg4n4fcwkkg0nac3ddh
  errors:
    $ref: ./GenericRemoteError.yaml