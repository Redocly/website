type: object
description: URL remote update.
properties:
  id: 
    type: string
    description: URL remote content update ID. Unique identifier prefixed with `rupd_`.
    pattern: ^rupd_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: rupd_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  remoteId:
    $ref: ./RemoteIdSchema.yaml
  type:
    $ref: ./UrlRemoteUpdateType.yaml
  status:
    $ref: ./RemoteUpdateStatus.yaml
    readOnly: true
  createdById:
    type: string
    description: User ID update is triggered by. 
  branchName:
    type: string
    description: Branch name for downloaded remote content files. 
    readOnly: true
  url:
    type: string
    description: Resource URL to download.
  fileName:
    type: string
    description: File name of the remote content.
    example: openapi.yaml
  createdAt:
    type: string
    readOnly: true
    examples:
      - '2023-06-07T00:00:00Z'
    format: date-time
  updatedAt:
    type: string
    readOnly: true
    examples:
      - '2023-06-07T00:00:00Z'
    format: date-time
  finishedAt:
    type: string
    readOnly: true
    examples:
      - '2023-06-07T00:00:00Z'
    format: date-time
  object:
    description: Entity name.
    type: string
    enum: [urlRemoteUpdate]
    readOnly: true
  uri:
    description: Canonical URI for the URL remote update resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/url-remote-updates/rupd_01h1s5z6vf2mm1mz3hevnn9va7
  error:
    oneOf:
      - type: 'null'
      - $ref: ./GenericRemoteUpdateError.yaml
required:
  - id
  - uri
  - remoteId
  - status
  - branchName
  - type
  - url
  - fileName
  - createdAt
  - updatedAt
  - object