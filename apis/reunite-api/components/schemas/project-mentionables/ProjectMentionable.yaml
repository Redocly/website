title: Mentionable
type: object
description: User or team that can be mentioned in a project.
properties:
  object:
    type: string
    enum: [mentionable]
  type:
    type: string
    enum: [user, team]
  id:
    type: string
    example: usr_01hcyy7gpx91whabhb6q4zxpaa
  name:
    type: string
    example: John Doe
  slug:
    type: string
    example: john.doe@mail.com
required:
  - id
  - type
  - name
  - slug
