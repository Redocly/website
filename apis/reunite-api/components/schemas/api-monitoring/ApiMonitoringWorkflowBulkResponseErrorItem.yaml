type: object
properties:
  status: 
    description: Status of single operation.
    type: string
    const: 'error'
    example: 'error'
    readOnly: true
  action:
    description: Human readable description of action performed.
    example: create
    type: string
    enum:
      - create
      - update
      - delete
    readOnly: true
  error:
    description: Error message.
    type: string
    example: Internal server error
    readOnly: true
required:
  - status
  - action
  - error
    