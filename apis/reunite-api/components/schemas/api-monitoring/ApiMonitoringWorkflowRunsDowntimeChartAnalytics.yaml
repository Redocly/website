type: object
properties:
  object:
    description: Entity name.
    type: string
    enum: [respectMonitoringWorkflowRunDowntime]
    example: respectMonitoringWorkflowRunDowntime
    readOnly: true
  from:
    description: Start date of the time period.
    type: string
    format: date-time
    example: '2023-06-15T15:00:00.000Z'
    readOnly: true
  to:
    description: End date of the time period.
    type: string
    format: date-time
    example: '2023-06-15T16:00:00.000Z'
    readOnly: true
  status:
    description: Status of the time period.
    type: string
    enum:
      - uptime
      - downtime
    example: uptime
    readOnly: true
required:
  - object
  - from
  - to
  - status

