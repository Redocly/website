type: object
properties:
  id:
    description: Respect Monitoring workflow run ID. Unique identifier prefixed with `amwr_`.
    type: string
    pattern: ^amwr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: amwr_01h2zvgfdqex5na189kdg39d6s
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [respectMonitoringWorkflowRun]
    example: respectMonitoringWorkflowRun
    readOnly: true
  results:
    description: Results of Respect workflow run.
    type: [object, 'null']
    example: #todo add example value
  status:
    description: Status of Respect Monitoring workflow run.
    type: string
    enum:
      - PENDING
      - IN_PROGRESS
      - SUCCESS
      - FAILED
      - WARNING
      - SLO_WARNING
      - SLO_ERROR
    example: SUCCESS
  duration:
    description: Summarized duration of each workflow run step in ms.
    type: number
    example: 620
  workflowId:
    description: Respect Monitoring workflow ID.
    type: string
    example: amw_01h2zvgfdqex5na189kdg39d6s
  createdAt:
    description: Created date.
    type: string
    format: date-time
    example: '2023-06-15T15:41:42.696Z'
    readOnly: true
  error:
    description: Error message if the workflow run failed.
    type: string
    example: 'An unexpected error occurred.'
  clearedAt:
    description: Date of clearing logs.
    type: string
    format: date-time
    example: '2023-06-15T15:41:42.696Z'
  clearedById:
    description: ID of the user that cleared logs. Unique identifier prefixed with `usr_`.
    type: string
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: 'usr_01hh1t9sa6gwfv5naz04gr7ehm'
  expiresAt:
    description: >
      Date when detailed run results expire under the retention policy. Retention periods vary by plan:
      Pro — 7 days, Enterprise — 30 days, Enterprise+ — 90 days.
      Once expired, step-by-step request and response logs are no longer available, though run metadata remains accessible.
      Always present in API responses; runs that predate retention tracking receive a fixed expiration date for consistency.
    type: string
    format: date-time
    example: '2023-06-22T15:41:42.696Z'
    readOnly: true
  requestCount:
    description: Number of requests made during the workflow run.
    type: number
    example: 10
  buildId:
    description: Build ID. Unique identifier prefixed with `pb_`.
    type: [string, 'null']
    pattern: ^pb_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: pb_01hq3hgers0gp1vd1w498dhdc4
  uri:
    type: string
    format: uri
    description: Canonical URI for the workflow run resource.
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/respect-monitoring-workflow-runs/amwr_01h2zvgfdqex5na189kdg39d6s
required:
  - id
  - object
  - status
  - results
  - workflowId
  - createdAt
  - uri
  - expiresAt
