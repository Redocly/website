type: object
properties:
  id:
    type: string
    description: Respect Monitoring workflow usage ID. Unique identifier prefixed with `amu_`.
    pattern: ^amu_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: amu_01h2zvgfdqex5na189kdg39d6s
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [respectMonitoringWorkflowUsage]
    example: respectMonitoringWorkflowUsage
    readOnly: true
  uri:
    description: URI reference to the Respect Monitoring workflow usage.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/respect-monitoring-workflow-usage
  billingYear:
    type: number
    description: Year used for usage tracking.
    example: 2025
  billingMonth:
    type: number
    example: 2
    description: Month used for usage tracking.
  totalRequestCount:
    type: [number, 'null']
    description: Request count for current billing month per organization.
    example: 10
  isLimitExceeded:
    type: boolean
    description: Whether the limit has been exceeded.
    example: false
  requestsLimit:
    type: number
    description: Total limit of requests.
    example: 1000
required:
  - id
  - object
  - uri
  - billingYear
  - billingMonth
  - totalRequestCount
  - isLimitExceeded
  - requestsLimit
