type: object
properties:
  id:
    description: Respect Monitoring job ID. Unique identifier prefixed with `amt_`.
    type: string
    pattern: ^amt_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: amt_01h2zvgfdqex5na189kdg39d6s
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [respectMonitoringJob]
    example: respectMonitoringJob
    readOnly: true
  filePath:
    description: File path to Arazzo specification.
    type: string
    example: arazzo/my-api.yaml
  branchName:
    description: Name of the project branch on which job is defined.
    type: string
    example: main
  interval:
    description: Interval of running job.
    type: string
    example: 15m
  createdAt:
    description: Created date.
    type: string
    format: date-time
    example: "2023-06-15T15:41:42.696Z"
    readOnly: true
  uri:
    description: URI reference to the Respect Monitoring jobs collection.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/respect-monitoring-jobs
  sloWarn:
    description: Service Level Objective warning threshold for the job.
    type: number
    example: 200
  sloError:
    description: Service Level Objective error threshold for the job.
    type: number
    example: 500
required:
  - id
  - object
  - uri
  - filePath
  - branchName
  - createdAt
