type: object
properties:
  targetSlaPercentage:
    type: number
    minimum: 0
    maximum: 100
  targetPeriodDays:
    type: number
    minimum: 1
    maximum: 30
  sendToSlack:
    type: boolean
  sendByEmail:
    type: boolean
  notifyAboutRecovery:
    type: boolean
  slackAppInstallationId:
    type: [string, 'null']
  slackChannelId:
    type: [string, 'null']
  emailRecipients:
    type: array
    items:
      type: string
      format: email

