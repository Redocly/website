type: object
properties:
  id:
    description: Respect Monitoring workflow ID. Unique identifier prefixed with `amw_`.
    type: string
    pattern: ^amw_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: amw_01h2zvgfdqex5na189kdg39d6s
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [respectMonitoringWorkflow]
    example: respectMonitoringWorkflow
    readOnly: true
  filePath:
    description: File path to Arazzo specification.
    type: string
    example: arazzo/my-api.yaml
  workflowId:
    description: Workflow ID in Arazzo specification.
    type: string
    example: healthWorkflow
  name:
    description: Custom name for workflow.
    type: string
    example: My test workflow
  description:
    description: Workflow description.
    type: string
    example: test workflow description
  createdAt:
    description: Created date.
    type: string
    format: date-time
    example: '2023-06-15T15:41:42.696Z'
    readOnly: true
  status:
    description: Workflow status.
    type: string
    example: 'ACTIVE'
    enum:
      - ACTIVE
      - PAUSED
      - ARCHIVED
  archivedAt:
    description: Date of archiving workflow.
    type: [string, 'null']
    format: date-time
    example: '2023-06-15T15:41:42.696Z'
  buildId:
    description: Build ID. Unique identifier prefixed with `pb_`.
    type: string
    pattern: ^pb_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: pb_01hq3hgers0gp1vd1w498dhdc4
  slaNotificationStatus:
    description: SLA notification status for tracking breach/recovery state.
    type: string
    example: 'NONE'
    enum:
      - NONE
      - BREACHED
      - RECOVERED
    readOnly: true
  uri:
    type: string
    format: uri
    description: Canonical URI for the workflow resource.
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/respect-monitoring-workflows/amw_01h2zvgfdqex5na189kdg39d6s
required:
  - id
  - object
  - filePath
  - workflowId
  - status
  - createdAt
  - uri