type: object
title: PatchRespectMonitoringWorkflowsLimitRequest
properties:
  respectMonitoringWorkflowsLimit:
    description: |-
      Maximum number of Respect Monitoring workflows allowed for the organization.
      The limit applies to trial subscriptions only — paid subscriptions are not limited.
      Set to `null` to remove the organization-specific override and fall back to the
      platform default limit (`null` does not mean unlimited).
    type: [integer, 'null']
    format: int32
    minimum: 1
    example: 20
required:
  - respectMonitoringWorkflowsLimit
