type: object
properties:
  id:
    description: Respect Monitoring notifications sla config ID. Unique identifier prefixed with `amnsco_`.
    type: string
    pattern: ^amnsco_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: amnsco_01h2zvgfdqex5na189kdg39d6s
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [respectMonitoringNotificationsSlaConfig]
    example: respectMonitoringNotificationsSlaConfig
    readOnly: true
  uri:
    description: URI reference to this Respect Monitoring notifications SLA config.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/respect-monitoring-notifications-sla-configs/amnsco_01h2zvgfdqex5na189kdg39d6s
  workflowId:
    description: Respect Monitoring workflow ID.
    type: string
    example: amw_01h2zvgfdqex5na189kdg39d6s
  targetSlaPercentage:
    description: Target SLA percentage (0-100).
    type: number
    minimum: 0
    maximum: 100
    default: 99.9
    example: 99.9
  targetPeriodDays:
    description: Target period in days for SLA calculation.
    type: number
    minimum: 1
    maximum: 30
    default: 7
    example: 7
  sendToSlack:
    description: Send SLA notifications to Slack.
    type: boolean
    default: false
    example: false
  sendByEmail:
    description: Send SLA notifications by email.
    type: boolean
    default: false
    example: false
  notifyAboutRecovery:
    description: Notify when SLA is restored after breach.
    type: boolean
    default: false
    example: false
  slackAppInstallationId:
    description: Slack app installation ID for SLA notifications.
    type: [string, 'null']
    pattern: ^amnai_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: amnai_01h2zvgfdqex5na189kdg39d6s
  slackChannelId:
    description: Slack channel ID for SLA notifications.
    type: [string, 'null']
    example: C1234567890
  emailRecipients:
    description: List of email addresses to receive SLA notifications.
    type: array
    items:
      type: string
      format: email
    default: []
    example:
      - 'admin@example.com'
      - 'team@example.com'
  createdAt:
    description: Created date.
    type: string
    format: date-time
    example: '2023-06-15T15:41:42.696Z'
    readOnly: true
  updatedAt:
    description: Updated date.
    type: string
    format: date-time
    example: '2023-06-15T15:41:42.696Z'
    readOnly: true
required:
  - id
  - object
  - uri
  - workflowId
  - targetSlaPercentage
  - targetPeriodDays
  - sendToSlack
  - sendByEmail
  - notifyAboutRecovery
  - slackAppInstallationId
  - slackChannelId
  - emailRecipients
  - createdAt
  - updatedAt
