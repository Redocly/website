type: object
properties:
  id:
    description: AI review issue ID. Unique identifier prefixed with `ari_`.
    type: string
    pattern: ^ari_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [aiReviewIssue]
    readOnly: true
  uri:
    description: Resource URI.
    type: string
    readOnly: true
  pullRequestId:
    description: Pull request ID. Unique identifier prefixed with `pr_`.
    type: string
    pattern: ^pr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    readOnly: true
  reviewCommentId:
    description: Review comment ID. Unique identifier prefixed with `com_`.
    type: string
    pattern: ^com_[0-9abcdefghjkmnpqrstvwxyz]{26}$
  aiReviewId:
    description: AI review run ID. Unique identifier prefixed with `arv_`.
    type: string
    pattern: ^arv_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    readOnly: true
  isFixed:
    description: Whether verification judged the underlying issue fixed.
    type: boolean
  severity:
    description: Severity level of the AI review comment.
    type: string
    enum: [LOW, MEDIUM, HIGH]
  category:
    description: Problem category of the AI review comment.
    type: string
    enum:
      [
        SECURITY,
        BREAKING_CHANGE,
        CORRECTNESS,
        CONSISTENCY,
        CONFIGURATION,
        DOCUMENTATION,
        BEST_PRACTICES,
        STYLE,
        OTHER,
      ]
    x-enumDescriptions:
      SECURITY: Vulnerability, exposure, or authentication weakness.
      BREAKING_CHANGE: Backward-incompatible API change.
      CORRECTNESS: Factually or semantically wrong content in an API spec or documentation.
      CONSISTENCY: Contradicts related docs or schemas.
      CONFIGURATION: Invalid or misconfigured `redocly.yaml` or project config, such as an unknown property, wrong type or value, or broken reference.
      DOCUMENTATION: Missing or misleading documentation.
      BEST_PRACTICES: Deviates from API design or Redocly conventions.
      STYLE: Typos, naming, or formatting.
      OTHER: None of the other categories fit.
  agent:
    description: >-
      Review sub-agent that produced the comment. Uses the same agent keys as
      the AI gateway request logs (for example `apiDescription`, `docs`,
      `config`, `owasp`, `consistency`), so cost and outcome reports join on
      one key. `null` only appears in responses for issues recorded before
      agent tracking; omit the field in requests instead of sending null.
    type: [string, 'null']
    minLength: 1
  confidence:
    description: Model confidence in the verdict (0–1).
    type: number
    minimum: 0
    maximum: 1
  reasoning:
    description: Short rationale for the verdict.
    type: [string, 'null']
  isPartiallyFixed:
    description: >-
      Whether verification judged the issue partially fixed — some but not all
      instances addressed. Mutually exclusive with `isFixed: true`. Not persisted.
    type: boolean
    writeOnly: true
  replyToAuthor:
    description: >-
      Reply posted to the PR author in the comment thread when the issue is
      partially fixed, listing the remaining instances. Requires
      `isPartiallyFixed: true`. Not persisted.
    type: string
    writeOnly: true
  lastVerifiedAt:
    type: string
    format: date-time
    readOnly: true
  lastVerifiedFileBlobHash:
    description: Git blob hash of the file content at verification time.
    type: string
  lastVerifiedAtCommitHash:
    description: Git commit hash (HEAD) at verification time.
    type: string
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
required:
  - id
  - object
  - uri
  - pullRequestId
  - reviewCommentId
  - aiReviewId
  - isFixed
  - confidence
  - lastVerifiedAt
  - lastVerifiedFileBlobHash
  - lastVerifiedAtCommitHash
  - createdAt
  - updatedAt
