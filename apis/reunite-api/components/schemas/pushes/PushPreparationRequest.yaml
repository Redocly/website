type: object
required:
  - push
  - files
  - context
properties:
  push:
    type: object
    description: Push payload fields, exactly as the client sent them in the multipart body.
    additionalProperties: true
  files:
    type: array
    description: Files the client uploaded, without their content.
    items:
      type: object
      required:
        - fieldname
        - size
      properties:
        fieldname:
          type: string
          description: Multipart field name of the uploaded file, for example `files[docs/openapi.yaml]`.
        size:
          type: number
          description: Size of the uploaded file in bytes.
  context:
    type: object
    description: Authentication context of the original client request.
    required:
      - userId
    properties:
      userId:
        type: string
        description: Resolved user ID of the pushing client.
      apiKeyPermissionsSource:
        type: string
        enum: [RBAC, SCOPED, FULL]
        description: Permissions source of that API key. Absent for requests without an API key.
