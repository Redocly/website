type: object
description: Additional information about job.
properties:
  scoutVersion:
    type: string
    description: Scout version.
    example: 1.0.0
    readOnly: true
  errorMessage:
    type: string
    description: Error message, if any.
  errorStack:
    type: string
    description: Error stack trace, if any.
  providerType:
    type: string
    description: Provider type.
    example: GITHUB_CLOUD
