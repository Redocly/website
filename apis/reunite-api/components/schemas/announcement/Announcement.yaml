type: object
title: Announcement
additionalProperties: false
properties:
  id:
    description: Announcement ID. Unique identifier prefixed with `ann_`.
    type: string
    pattern: ^ann_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: ann_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  title:
    type: string
    description: Title of the announcement.
    example: "What's New: Enhanced Respect Monitoring"
  content:
    type: string
    description: Markdown content of the announcement.
    example: "We've added new features to Respect Monitoring. Check out our [blog post](https://redocly.com/blog) for more details."
  mediaUrl:
    type:
      - string
      - 'null'
    format: uri
    description: URL to the media file (image or GIF) stored in object storage.
    example: "https://s3.us-east-1.amazonaws.com/stage-bh-announcements-cdn/announcements/01h1s5z6vf2mm1mz3hevnn9va7.gif"
  buttons:
    type:
      - object
      - 'null'
    description: Button configuration for the announcement.
    properties:
      primary:
        type: object
        properties:
          text:
            type: string
            description: Text displayed on the primary button.
            example: "Explore Respect Monitoring"
          url:
            type: string
            format: uri
            description: URL to navigate to when the primary button is clicked.
            example: "https://redocly.com/docs/monitoring"
          action:
            type: string
            description: Optional action identifier for button click tracking.
            example: "explore_monitoring"
      secondary:
        type: object
        properties:
          text:
            type: string
            description: Text displayed on the secondary button.
            example: "View documentation"
          url:
            type: string
            format: uri
            description: URL to navigate to when the secondary button is clicked.
            example: "https://redocly.com/docs"
          action:
            type: string
            description: Optional action identifier for button click tracking.
            example: "view_docs"
  products:
    type: array
    description: Optional list of product badges displayed with the announcement.
    items:
      type: string
      enum:
        - reunite
        - realm
        - redoc
        - reef
        - revel
  targetPlans:
    type: array
    description: Optional list of plan tiers that should receive this announcement. Empty means all plans.
    items:
      type: string
      enum:
        - trial
        - pro
        - enterprise
        - enterprise-plus
  targetOrganizationIds:
    type: array
    description: Optional list of specific organization IDs that receive this announcement. When non-empty, only listed organizations receive it.
    items:
      type: string
      pattern: ^org_[0-9abcdefghjkmnpqrstvwxyz]{26}$
      example: org_01h1s5z6vf2mm1mz3hevnn9va7
  scheduledStartAt:
    type:
      - string
      - 'null'
    format: date-time
    description: Date and time when the announcement should start being displayed. If null, announcement is active immediately.
  scheduledEndAt:
    type:
      - string
      - 'null'
    format: date-time
    description: Date and time when the announcement should stop being displayed. If null, announcement has no end date.
  createdAt:
    type: string
    format: date-time
    description: Date and time of announcement creation.
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    description: Date and time of last update.
    readOnly: true
required:
  - id
  - title
  - content
  - createdAt
  - updatedAt

