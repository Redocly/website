type: object
properties:
  id:
    description: Project runtime log ID. Based on timestamp for uniqueness.
    type: string
    example: "prl_6d0329cf-6405-4c94-aaa7-9d5a791ff872"
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [projectRuntimeLog]
    example: projectRuntimeLog
    readOnly: true
  timestamp:
    description: Unix timestamp in milliseconds when log entry is created.
    type: number
    example: 1703012345000
    readOnly: true
  message:
    description: Log message content.
    type: string
    example: "Application started successfully on port 3000"
    readOnly: true
  buildId:
    description: Build ID associated with this log entry.
    type: string
    example: "pb_01k2c3bs4abnp5ynk8c5m85jqv"
    readOnly: true
  createdAt:
    description: Created date in ISO 8601 format.
    type: string
    format: date-time
    example: '2023-12-19T15:45:45.000Z'
    readOnly: true
  uri:
    description: Resource URI for this log entry.
    type: string
    example: "/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/logs/1703012345000"
    readOnly: true
  level:
    description: Log level.
    type: string
    enum: [info, warn, error, http]
    example: info
    readOnly: true
required:
  - id
  - object
  - timestamp
  - message
  - buildId
  - createdAt
  - uri
  - level
