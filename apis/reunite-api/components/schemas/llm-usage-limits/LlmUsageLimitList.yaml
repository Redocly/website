type: object
description: |-
  Evaluated limits applicable to the requesting tenant. An empty `data` array
  means no limits are enforced for this caller.
required:
  - object
  - page
  - items
  - data
properties:
  object:
    type: string
    enum:
      - list
    example: list
    readOnly: true
  page:
    $ref: ../Page.yaml
  data:
    type: array
    items:
      $ref: ./LlmUsageLimit.yaml
    description: One entry per applicable limit.
  items:
    type: array
    items:
      $ref: ./LlmUsageLimit.yaml
    description: One entry per applicable limit.
    deprecated: true
  currentOperationSpendUsd:
    type: number
    minimum: 0
    example: 1.234
    description: |-
      Sum of `cost_usd` across every SUCCESS request log for the supplied
      `(organizationId, operationId)`. Only present when the request includes
      `operationId`. Lets the gateway's `LimitsPlugin` enforce its in-process
      job-budget cap without keeping local spend state.
