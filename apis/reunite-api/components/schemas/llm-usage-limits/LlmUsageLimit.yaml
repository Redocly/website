type: object
description: |-
  One evaluated usage limit applicable to the calling tenant, including the
  amount already consumed within the row's active window.
required:
  - limitId
  - scope
  - type
  - amount
  - used
  - periodInHours
  - currentCycleStartedAt
  - nextResetAt
  - enabled
  - currentOperationCounted
  - dimensions
properties:
  limitId:
    type: string
    example: lu_01kr1ej7knafaez5sec8d1e58k
    description: Identifier of the underlying limit row.
  scope:
    $ref: ./LlmUsageLimitScope.yaml
  type:
    $ref: ./LlmUsageLimitType.yaml
  amount:
    type: number
    minimum: 0
    example: 10
    description: |-
      Configured cap for this limit, in units of `type`. `0` blocks all
      gateway calls in this scope (every pre-flight check rejects with
      `LimitExceededError`).
  used:
    type: number
    example: 3.5
    description: |-
      Amount already consumed in the active rolling window, in units of `type`.
      Only successful gateway requests contribute.
  periodInHours:
    type: integer
    minimum: 1
    maximum: 8760
    example: 24
    description: |-
      Cycle cadence in hours. Display code maps common values to friendly
      labels (24 = daily, 168 = weekly, 720 ≈ monthly).
  currentCycleStartedAt:
    type:
      - string
      - 'null'
    format: date-time
    example: '2026-05-12T00:00:00.000Z'
    description: |-
      Start of the active cycle. `used` aggregates from this instant onward.
      Null when the limit has never been consumed or its previous cycle
      expired without a follow-up; in that case the next successful call
      anchors the next cycle to its `started_at`.
  nextResetAt:
    type:
      - string
      - 'null'
    format: date-time
    example: '2026-05-13T00:00:00.000Z'
    description: |-
      Instant at which `used` rolls back to zero and the next cycle begins.
      Null while the limit is dormant; populated as `currentCycleStartedAt`
      + `periodInHours` once active.
  enabled:
    type: boolean
    example: true
    description: When false, the gateway ignores this row. Surfaced for admin UIs.
  currentOperationCounted:
    type: boolean
    example: false
    description: |-
      Only meaningful for `type=credits` rows when the caller supplies
      `operationId` (the gateway does — admin dashboards don't). `true`
      means the operation is already represented by a SUCCESS log in the
      cycle, so an additional call from the same operation adds 0 to
      `used`. Always `false` for non-credit rows.
  dimensions:
    type: object
    required:
      - organizationId
      - projectId
      - feature
    properties:
      organizationId:
        type: string
        example: org_01kr1ec1vqkrgpepw1k5h0jpep
        description: Organization the limit belongs to.
      projectId:
        type:
          - string
          - 'null'
        example: prj_01kr1ege4dgvp1jyh8f63gvgma
        description: Pinned project the limit applies to, or null when org-wide.
      feature:
        oneOf:
          - $ref: ../ai-gateway/AiGatewayFeature.yaml
          - type: 'null'
        description: Pinned feature the limit applies to, or null when feature-wide.
