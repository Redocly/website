allOf:
  - $ref: ./Membership.yaml
  - type: object
    properties:
      user:
        type: object
        description: User data.
        properties:
          id:
            description: User ID. Unique identifier prefixed with `usr_`.
            type: string
            pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
            example: usr_01hh1t9sa6gwfv5naz04gr7ehm
            readOnly: true
          email:
            description: User email address.
            type: string
            format: email
            example: john.smith@example.com
            readOnly: true
        required:
          - id
          - email
    required:
      - user
