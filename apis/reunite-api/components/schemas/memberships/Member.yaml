type: object
properties:
  id:
    description: Membership ID. Unique identifier prefixed with `mbr_`.
    type: string
    pattern: ^mbr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: mbr_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  userId:
    description: User ID. Unique identifier prefixed with `usr_`.
    type: string
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: usr_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  role:
    $ref: ../rbac/OrganizationRole.yaml
    description: Organization role.
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [member]
    readOnly: true
  email:
    description: User email address.
    type: string
    format: email
    example: john.smith@example.com
    readOnly: true
  firstName:
    description: User first name.
    type: [string, 'null']
    example: John
    readOnly: true
  lastName:
    description: User last name.
    type: [string, 'null']
    example: Smith
    readOnly: true
  name:
    description: User name.
    type: string
    example: john.smith
    readOnly: true
  imageUrl:
    description: Image url.
    type: [string, 'null']
    format: uri
    example: https://example.com/image.png
    readOnly: true
  lastLoginAt:
    description: Last login date.
    type: [string, 'null']
    format: date-time
    example: 2021-01-01T00:00:00Z
    readOnly: true
  lastActiveAt:
    description: |
      Last git commit/push activity date (organization-specific).
      For COMMITTERs: Updated on each commit. For other roles: defaults to membership creation time.
    type: [string, 'null']
    format: date-time
    example: 2021-01-01T00:00:00Z
    readOnly: true
  activityDate:
    description: |
      Computed unified activity date based on role:
      - COMMITTER role: uses `lastActiveAt` (git commit activity)
      - Other roles: uses `lastLoginAt`
    type: [string, 'null']
    format: date-time
    example: 2021-01-01T00:00:00Z
    readOnly: true
  teamsCount:
    description: Number of teams a user is in.
    type: integer
    example: 3
    readOnly: true
  teamsAsManagerCount:
    description: Number of teams a user is a manager of.
    type: integer
    example: 3
    readOnly: true
  teams:
    description: List of teams a user is in.
    type: array
    items:
      type: object
      properties:
        id:
          description: Team ID.
          type: string
          example: team_01hh1t9sa6gwfv5naz04gr7ehm
          readOnly: true
        name:
          description: Team name.
          type: string
          example: Team 1
          readOnly: true
        isManager:
          description: Whether the user is a manager of the team.
  parentMemberId:
    description: Id of a linked parent member.
    type: string
    example: 336f8b66-a3ea-444f-8675-d9c13fc00675
    readOnly: true
  childMembersCount:
    description: Number of child members.
    type: integer
    example: 3
    readOnly: true
  isGuest:
    description: Guest flag.
    type: boolean
    example: false
    readOnly: true
  uri:
    type: string
    format: uri
    description: Canonical URI for the member resource.
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/members/mbr_01hh1t9sa6gwfv5naz04gr7ehm
required:
  - id
  - userId
  - role
  - object
  - email
  - firstName
  - lastName
  - name
  - imageUrl
  - lastLoginAt
  - activityDate
  - teamsCount
  - childMembersCount
  - isGuest
  - uri