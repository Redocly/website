type: object
properties:
  id:
    description: Membership ID. Unique identifier prefixed with `mbr_`.
    type: string
    pattern: ^mbr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: mbr_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  uri:
    description: Canonical URI for the membership resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/memberships/mbr_01hh1t9sa6gwfv5naz04gr7ehm
  userId:
    description: User ID. Unique identifier prefixed with `usr_`.
    type: string
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: usr_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  role:
    $ref: ../rbac/OrganizationRole.yaml
  isGuest:
    description: Guest flag.
    type: boolean
    example: false
    readOnly: true
  isSupport:
    description: Support flag.
    type: boolean
    example: false
    readOnly: true
  createdAt:
    description: Created date.
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    description: Updated date.
    type: string
    format: date-time
    readOnly: true
  lastActiveAt:
    description: Last active date.
    type: [string, 'null']
    format: date-time
    example: 2021-01-01T00:00:00Z
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [membership]
    readOnly: true
  parentMemberId:
    description: Id of a linked parent member.
    type: [string, 'null']
    pattern: ^mbr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: mbr_01hh1t9sa6gwfv5naz04gr7ehm
required:
  - id
  - uri
  - userId
  - isGuest
  - isSupport
  - createdAt
  - updatedAt
  - object
