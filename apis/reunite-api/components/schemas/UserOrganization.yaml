type: object
required: [id, name, permissions, projects, slug]
properties:
  id:
    type: string
    description: Organization id.
    example: org_0f78ef25-c931-47c7-b8ae-a3ed2043
  slug:
    type: string
    description: Organization slug.
    example: acme-inc
  name:
    type: string
    description: Organization name.
    example: Acme Inc
  isSupportMode:
    type: boolean
    description: Determines if the current user acts as a support user in organization.
    example: false
  permissions:
    description: List of permissions.
    type: array
    items:
      $ref: ./rbac/OrganizationPermissions.yaml
  organizationRole:
    $ref: ./rbac/OrganizationRole.yaml
  organizationTeams:
    description: List of user organization teams.
    type: array
    items:
      type: string
  projects:
    type: object
    description: Projects from the organization that the currently logged in user has access to.
    additionalProperties:
      type: object
      required: [id, name, permissions, projectRole]
      properties:
        id:
          type: string
          description: Project ID.
          example: acme-inc
        name:
          type: string
          description: Project name.
          example: Acme Inc
        projectRole:
          description: The highest project role of the currently logged in user.
          $ref: ./rbac/ProjectRoleName.yaml
          example: READ
        permissions:
          description: List of permissions.
          type: array
          items:
            $ref: ./rbac/ProjectPermissions.yaml
