type: object
properties:
  object:
    description: Entity name.
    type: string
    enum: [projectAnalyticsAiAssistantStats]
    readOnly: true
  totals:
    description: Aggregated totals for the selected filters.
    type: object
    properties:
      conversations:
        description: Number of conversation sessions.
        type: integer
        example: 128
      messages:
        description: Number of messages asked to the assistant.
        type: integer
        example: 402
      likes:
        description: Number of liked answers.
        type: integer
        example: 74
      dislikes:
        description: Number of disliked answers.
        type: integer
        example: 12
      escalations:
        description: Number of conversations that ended in a created support ticket.
        type: integer
        example: 6
      ticketPreventionRate:
        description: |-
          Percentage of embedded assistant conversations that end without a support
          ticket. Null when the selected window has no embedded conversations.
        type:
          - number
          - 'null'
        example: 95.3
    required:
      - conversations
      - messages
      - likes
      - dislikes
      - escalations
      - ticketPreventionRate
  origins:
    description: |-
      Distinct origins of the pages that embedded the AI assistant, observed in the
      selected time window. Computed without the `sourceOrigin` filter applied, so
      the full list stays available while one origin is selected.
    type: array
    items:
      type: string
    example: ['https://docs.example.com']
required:
  - object
  - totals
  - origins
