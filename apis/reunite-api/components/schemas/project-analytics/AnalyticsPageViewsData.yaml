type: object
required:
  - time
  - uri
  - path
  - domain
  - userEmail
  - object
properties:
  object:
    description: Entity name.
    type: string
    enum: [projectAnalyticsPageViewsData]
    readOnly: true
  time:
    type: string
    format: date-time
    description: Timestamp of the page view.
    example: '2026-06-18T09:23:58.971Z'
  uri:
    type: string
    description: Complete URI of the viewed page.
  path:
    type: string
    description: Path of the page without query strings and fragments.
  domain:
    type: string
    description: Domain of the page.
  userEmail:
    type: string
    description: Masked or complete user email associated with the page view.
