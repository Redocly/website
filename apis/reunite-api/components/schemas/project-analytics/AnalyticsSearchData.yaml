type: object
required:
  - time
  - query
  - resultsCount
  - userEmail
  - object
properties:
  object:
    description: Entity name.
    type: string
    enum: [projectAnalyticsSearchData]
    readOnly: true
  time:
    type: string
    format: date-time
    description: Timestamp of the search.
    example: '2026-06-18T09:23:58.971Z'
  query:
    type: string
    description: Search string executed.
  resultsCount:
    type: integer
    description: Number of results found for this search.
  userEmail:
    type: string
    description: Masked or complete user email associated with the search.
  product:
    type:
      - string
      - 'null'
    description: Product targeted by the search.
  clicks:
    type: array
    items:
      type: string
    description: Links clicked from the search results.
