type: object
properties:
  object:
    type: string
    enum: [list]
  page:
    $ref: ../Page.yaml
  data:
    type: array
    minItems: 0
    items:
      $ref: ./AnalyticsAiSearchData.yaml
  items:
    type: array
    minItems: 0
    items:
      $ref: ./AnalyticsAiSearchData.yaml
    deprecated: true
  totalLikes:
    description: Total number of likes across all AI search results.
    type: integer
    example: 234
  totalDislikes:
    description: Total number of dislikes across all AI search results.
    type: integer
    example: 47
required:
  - object
  - page
  - items
  - totalLikes
  - totalDislikes
  - data