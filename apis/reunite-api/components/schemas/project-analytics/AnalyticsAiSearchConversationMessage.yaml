type: object
properties:
  object:
    description: Entity name.
    type: string
    enum: [projectAnalyticsAiSearchConversationMessage]
    readOnly: true
  id:
    description: |-
      Stable identifier of the message within the conversation. Matches the source
      event's message ID when one exists; an opaque derived identifier otherwise.
    type: string
    example: 'msg_01abc123'
  time:
    description: Time of the search.
    type: string
    format: date-time
    example: '2026-06-18T09:23:58.971Z'
  question:
    description: Question asked by the user.
    type: string
    example: 'How to use Ai search?'
  answer:
    description: Answer provided by the AI. Absent for failed searches.
    type: string
    example: 'You can use Ai search by...'
  status:
    description: Whether the AI search completed successfully or failed.
    type: string
    enum: [completed, failed]
    example: 'completed'
  error:
    description: Error message for failed searches.
    type: string
    example: 'Model request timed out'
  resources:
    description: List of resources related to the answer.
    type: array
    items:
      type: object
      properties:
        id:
          type: string
          example: 'resource-1'
        url:
          type: string
          example: 'https://example.com/resource-1'
        title:
          type: string
          example: 'Resource Title'
  conversationId:
    description: |-
      ID of the conversation session this message belongs to, a client-generated UUID.
    type: string
    example: '3c6db4fd-8492-4af5-b4de-b4ff0ecf89ea'
  product:
    description: Product name filter used for the AI search.
    type: string
    example: 'Realm'
  model:
    description: AI model used to generate the answer.
    type: string
    example: 'anthropic.claude-3-5-sonnet-20241022-v2:0'
  isAnswerFound:
    description: |-
      Whether the AI found an answer in the documentation for this message.
      Absent when the source events predate this field.
    type: boolean
    example: true
  feedback:
    description: Feedback on the AI search answer.
    type: string
    enum: [like, dislike]
    example: 'like'
  dislikeReason:
    description: Reason for disliking the AI search answer.
    type: string
    example: 'The answer was not accurate'
  sourceOrigin:
    description: |-
      Origin of the page that embeds the AI assistant. Absent for messages of the
      built-in search.
    type: string
    example: 'https://docs.example.com'
  escalated:
    description: Whether the conversation of this message ended in a created support ticket.
    type: boolean
    example: false
required:
  - object
  - id
  - time
  - question
  - status
  - conversationId
