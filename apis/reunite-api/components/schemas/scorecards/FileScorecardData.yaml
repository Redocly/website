
description: File scorecard data.
type: object
properties:
  levels:
    type: object
    additionalProperties:
      type: object
      properties:
        errors:
          type: integer
          example: 2
        ignored:
          type: integer
          example: 0
        warnings:
          type: integer
          example: 0  
        uniqueErrors:
          type: integer
          example: 2
        uniqueWarnings:
          type: integer
          example: 0
        problems:
          type: array
          items:
            type: object
            properties:
              ruleId:
                type: string
              message:
                type: string
              suggest:
                type: array
                items:
                  type: string
              location:
                type: object
                properties:
                  source:
                    type: object
                    properties:
                      absoluteRef:
                        type: string
                      pointer:
                        type: string
                      reportOnKey:
                        type: boolean
              severity:
                type: string
              codeframe:
                type: string
      required:
        - errors
        - ignored
        - warnings
        - uniqueErrors
        - uniqueWarnings
  status:
    type: string
    enum:
      - BELOW_MINIMUM
      - MINIMUM
      - HIGHEST
    example: MINIMUM
  targetLevel:
    type: string
    example: Baseline
  title:
    type: string
    example: Search API
  scorecardLevel:
    type: string
    example: Gold
  scorecardLevelIdx:
    type: integer
    example: 3
  relativePath:
    type: string
    example: apis/search.oas.yaml
  version:
    type: string
    example: '1.0.0'
required:
  - levels
  - status
  - targetLevel
  - title
  - scorecardLevel
  - scorecardLevelIdx
  - relativePath