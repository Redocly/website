
description: Scorecard.
type: object
properties:
  id:
    description: Scorecard ID. Unique identifier prefixed with `pbs_`.
    type: string
    pattern: ^pbs_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: pbs_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [scorecard]
    readOnly: true
  uri:
    description: URI reference to this scorecard.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/scorecards/pbs_01hh1t9sa6gwfv5naz04gr7ehm
  buildId:
    description: Build ID. Unique identifier prefixed with `pb_`.
    type: string
    pattern: ^pb_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: pb_01hq3hgers0gp1vd1w498dhdc4
    readOnly: true
  createdAt:
    description: Created date.
    type: string
    format: date-time
    example: 2023-06-15T15:41:42.696Z
    readOnly: true
  updatedAt:
    description: Updated date.
    type: string
    format: date-time
    example: 2023-06-15T15:41:42.696Z
    readOnly: true
  scorecardData:
    type: object
    additionalProperties:
      $ref: './FileScorecardData.yaml'
  levelNames:
    type: array
    items:
      type: string
      example: Baseline
  rules:
    type: array
    items:
      type: string
      example: operation-2xx-response
  rulesPerLevel:
    type: object
    additionalProperties:
      type: array
      items:
        type: string
        example: operation-2xx-response
required:
  - id
  - object
  - uri
  - buildId
  - createdAt
  - updatedAt
  - scorecardData
  - levelNames
  - rules
  - rulesPerLevel