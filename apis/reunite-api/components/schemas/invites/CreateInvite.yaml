type: object
properties:
  email:
    description: Email of invited user.
    type: string
    format: email
    maxLength: 254
    example: john.smith@example.com
  role:
    description: Organization role.
    $ref: ../rbac/OrganizationRole.yaml
  teamIds:
    description: Team IDs that user is invited to.
    type: array
    maxItems: 100
    items:
      description: Team ID that user is invited to. Unique identifier prefixed with `team_`.
      type: string
      pattern: ^team_[0-9abcdefghjkmnpqrstvwxyz]{26}$
      example: team_01h1s5z6vf2mm1mz3hevnn9va7
  customMessage:
    description: Custom message to user.
    type: string
    maxLength: 300
    example: "Hello, please join our organization."
  projectId:
    description: Project ID. Unique identifier prefixed with `prj_`.
    type: string
    pattern: ^prj_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: prj_01h1s5z6vf2mm1mz3hevnn9va7
required:
  - email
  - role
  - teamIds
