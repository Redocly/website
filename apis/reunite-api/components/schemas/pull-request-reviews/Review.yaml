type: object
properties:
  id:
    description: Review ID. Unique identifier prefixed with `rev_`.
    type: string
    pattern: ^rev_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: rev_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [review]
    readOnly: true
  uri:
    description: Canonical URI for the pull request review resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/pull-request-reviews/rev_01h1s5z6vf2mm1mz3hevnn9va7
  pullRequestId:
    description: Pull request ID. Unique identifier prefixed with `pr_`.
    type: string
    pattern: ^pr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: pr_01h1s5z6vf2mm1mz3hevnn9va7
  userId:
    description: User ID. Unique identifier prefixed with `usr_`.
    type: string
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: usr_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  status:
    description: Review status.
    type: string
    enum: [APPROVED, REQUESTED_CHANGES, COMMENTED, DRAFT]
  type:
    description: Review type.
    type: string
    enum: [MANUAL, AUTOMATIC, SUMMARY]
    default: MANUAL
  comment:
    description: Comment to review.
    type: string
  commentSlots:
    $ref: ./CommentSlots.yaml
  pinned:
    description: Flag to pin the review comment so it appears first in the list.
    type: boolean
  dismissed:
    description: Flag set to `true` when the review has been dismissed by a re-request. Dismissed reviews are preserved in the database for audit purposes but no longer contribute to the reviewer's current status or comment counts in the UI.
    type: boolean
    default: false
    readOnly: true
  externalId:
    description: External review ID from the Git provider (GitHub, GitLab, Azure DevOps, etc.).
    type: string
    readOnly: true
  pinnedAt:
    description: Review comment pinning date.
    type: string
    readOnly: true
    format: date-time
  createdAt:
    description: Created date.
    type: string
    readOnly: true
    format: date-time
  updatedAt:
    description: Updated date.
    type: string
    readOnly: true
    format: date-time
required:
  - id
  - object
  - pullRequestId
  - userId
  - createdAt
  - updatedAt
  - status
  - uri
  - type
