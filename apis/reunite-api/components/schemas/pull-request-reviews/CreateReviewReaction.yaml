type: object
description: Adds a reaction to one comment. Give `reviewId` for a review summary or a top-level PR comment. Give `reviewCommentId` for a line comment, a file comment, or a reply. Give exactly one of them.
oneOf:
  - required:
      - reviewId
      - content
    properties:
      reviewId:
        $ref: '#/$defs/reviewId'
      content:
        $ref: '#/$defs/content'
  - required:
      - reviewCommentId
      - content
    properties:
      reviewCommentId:
        $ref: '#/$defs/reviewCommentId'
      content:
        $ref: '#/$defs/content'
$defs:
  reviewId:
    description: Review ID. Unique identifier prefixed with `rev_`.
    type: string
    pattern: ^rev_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: rev_01h1s5z6vf2mm1mz3hevnn9va7
  reviewCommentId:
    description: Review comment ID. Unique identifier prefixed with `com_`.
    type: string
    pattern: ^com_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: com_01h1s5z6vf2mm1mz3hevnn9va7
  content:
    description: Emoji reaction to add to the comment in the git provider. The API does not store the reaction.
    type: string
    enum: [EYES]
