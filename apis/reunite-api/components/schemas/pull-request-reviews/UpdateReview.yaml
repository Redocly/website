type: object
properties:
  status:
    description: Review status.
    type: string
    enum: [APPROVED, REQUESTED_CHANGES, COMMENTED, DRAFT]
  type:
    description: Review type.
    type: string
    enum: [MANUAL, AUTOMATIC, SUMMARY]
    default: MANUAL
  comment:
    description: Comment to review.
    type: string
  commentSlots:
    $ref: ./CommentSlots.yaml
  pinned:
    description: Flag to pin the review comment so it appears first in the list.
    type: boolean
  userId:
    $ref: ../ActorUserId.yaml
