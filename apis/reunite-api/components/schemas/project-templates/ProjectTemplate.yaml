type: object
properties:
  id:
    description: Project template ID. Unique identifier prefixed with `prt_`.
    type: string
    pattern: ^prt_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: prt_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  name:
    description: Project template name.
    type: string
    example: Project starter
  description:
    description: Project template description.
    type: ['null', string]
    example: Really cool project template.
  isPrivate:
    description: Is project template in private repository.
    type: boolean
    example: true
  sourceName:
    description: Repository name for private project template.
    type: ['null', string]
    example: redocly
  sourceNamespace:
    description: Repository namespace for private project template.
    type: ['null', string]
    example: redocly
  sourceUrl:
    description: Project template repository URL for public project template.
    type: ['null', string]
    example: https://github.com/Redocly/museum-openapi-example
  previewUrl:
    description: URL to running project built from template.
    type: ['null', string]
    example: https://project-starter.redocly.com/
  previewImage:
    description: Preview image.
    type: ['null', string]
    example: data:image/png;base64,...
  isDefault:
    description: Is project template default for creating a new project source.
    type: boolean
    example: true
  object:
    description: Entity name.
    type: string
    enum: [projectTemplate]
    readOnly: true
required:
  - id
  - name
  - description
  - isPrivate
  - sourceName
  - sourceNamespace
  - sourceUrl
  - previewUrl
  - previewImage
  - object