type: object
properties:
  id:
    description: Project custom domain ID. Unique identifier prefixed with `prd_`.
    type: string
    pattern: ^prd_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: prd_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  domain:
    description: Custom domain.
    type: string
    example: example.com
  keepDefault:
    description: Keep default domain.
    type: boolean
    example: false
  verificationCode:
    description: Verification code.
    type: string
    example: ab1251
    readOnly: true
  isVerified:
    description: Is domain verified.
    type: boolean
    example: true
    readOnly: true
  isCnameVerified:
    description: Is CNAME record verified.
    type: boolean
    example: true
    readOnly: true
  isTxtVerified:
    description: Is TXT record verified.
    type: boolean
    example: true
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [projectCustomDomain]
    readOnly: true
  uri:
    description: Canonical URI for the project custom domain resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/custom-domains/prd_01h1s5z6vf2mm1mz3hevnn9va7
  createdAt:
    description: Created date.
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    description: Updated date.
    type: string
    format: date-time
    readOnly: true
required:
  - id
  - domain
  - keepDefault
  - verificationCode
  - isVerified
  - isCnameVerified
  - isTxtVerified
  - object
  - uri
  - createdAt
  - updatedAt