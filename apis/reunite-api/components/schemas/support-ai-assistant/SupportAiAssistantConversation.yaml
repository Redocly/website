type: object
properties:
  object:
    description: Entity name.
    type: string
    enum: [supportAiAssistantConversation]
    readOnly: true
  id:
    description: Identifier of the conversation (search session).
    type: string
    pattern: ^[0-9a-zA-Z_-]{1,64}$
    readOnly: true
    example: '01HV5XK1T2J9R8Z3Q4W5E6R7T8'
  createdAt:
    description: Time of the first message in the conversation.
    type: string
    format: date-time
    readOnly: true
    example: '2026-06-01T12:00:00Z'
  messages:
    description: All messages of the conversation ordered by time.
    type: array
    minItems: 0
    items:
      $ref: ./SupportAiAssistantMessage.yaml
required:
  - object
  - id
  - createdAt
  - messages
