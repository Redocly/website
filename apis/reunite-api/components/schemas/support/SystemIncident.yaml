type: object
properties:
  id:
    type: string
  content:
    type: string
  severity:
    type: string
    enum:
      - info
      - warning
      - error
  status:
    type: string
    enum:
      - draft
      - active
      - resolved
  dismissible:
    type: boolean
  startsAt:
    oneOf:
      - type: string
        format: date-time
      - type: 'null'
  endsAt:
    oneOf:
      - type: string
        format: date-time
      - type: 'null'
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
required:
  - id
  - content
  - severity
  - status
  - dismissible
  - startsAt
  - endsAt
  - createdAt
  - updatedAt
