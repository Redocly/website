type: object
properties:
  id:
    description: Membership ID. Unique identifier prefixed with `mbr_`.
    type: string
    pattern: ^mbr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: mbr_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  userId:
    description: User ID. Unique identifier prefixed with `usr_`.
    type: string
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: usr_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [pullRequestsReviewer]
    readOnly: true
  email:
    description: User email address.
    type: string
    format: email
    example: john.smith@example.com
    readOnly: true
  firstName:
    description: User first name.
    type: [string, 'null']
    example: John
    readOnly: true
  lastName:
    description: User last name.
    type: [string, 'null']
    example: Smith
    readOnly: true
  name:
    description: User name.
    type: string
    example: john.smith
    readOnly: true
  imageUrl:
    description: Image url.
    type: [string, 'null']
    format: uri
    example: https://example.com/image.png
    readOnly: true
  uri:
    type: string
    format: uri
    description: Canonical URI for the reviewer resource.
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/pull-request-reviewers/mbr_01hh1t9sa6gwfv5naz04gr7ehm
required:
  - id
  - userId
  - object
  - email
  - firstName
  - lastName
  - name
  - imageUrl
  - uri