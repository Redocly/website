type: object
description: PR checks trigger options for the AI writer agent job. Created when a check fails on the head commit of a pull request the writer agent opened. The run reads the failed checks and their details itself.
required:
  - trigger
  - pullRequestId
  - headCommitHash
  - metadata
properties:
  trigger:
    type: string
    enum:
      - PR_CHECKS
  pullRequestId:
    description: Pull request ID whose head commit failed the checks. Unique identifier prefixed with `pr_`.
    type: string
    pattern: ^pr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: pr_01h1s5z6vf2mm1mz3hevnn9va7
  headCommitHash:
    type: string
    minLength: 1
    description: Head commit of the pull request when the checks failed.
    example: abc123def4567890abcdef1234567890abcdef12
  metadata:
    $ref: ./AiWriterAgentJobMetadata.yaml
