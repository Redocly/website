type: object
required:
  - object
  - id
  - status
  - createdAt
  - updatedAt
  - uri
properties:
  object:
    type: string
    enum:
      - aiJob
    example: aiJob
    readOnly: true
  id:
    type: string
    format: ulid
    pattern: ^aij_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: aij_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
    description: Unique identifier for the AI job.
  status:
    type: string
    enum:
      - QUEUED
      - RUNNING
      - COMPLETED
      - FAILED
      - CANCELLING
      - CANCELLED
    example: RUNNING
    description: |-
      Current status of the AI job. `CANCELLING` is a transient state entered when
      a user stops a run: the underlying worker allocation is being torn down before
      the job settles into its final stopped state.
  createdById:
    type: string
    format: ulid
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: usr_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
    description: Unique identifier of the user who created the AI job.
  error:
    type:
      - string
      - 'null'
    example: Timeout while waiting for plan files
    description: >-
      Error message when the job has failed. The worker sanitizes it before
      reporting: URL query strings and fragments are stripped, internal hosts and
      paths are reduced, and secret-shaped values are redacted.
  createdAt:
    type: string
    format: date-time
    example: '2026-04-17T10:15:00.000Z'
    readOnly: true
    description: Date the AI job is created.
  updatedAt:
    type: string
    format: date-time
    example: '2026-04-17T10:25:30.000Z'
    readOnly: true
    description: Date the AI job is last updated.
  metadata:
    oneOf:
      - $ref: ./AiJobMetadata.yaml
      - type: 'null'
    readOnly: true
    description: Additional metadata recorded on the AI job. `null` when no metadata is set.
  uri:
    description: Canonical URI for the AI worker job resource.
    type: string
    format: uri
    readOnly: true
    example: urn:redocly:reunite:aiWorkerJob:aij_01h1s5z6vf2mm1mz3hevnn9va7
  parentJobId:
    type:
      - string
      - 'null'
    format: ulid
    pattern: ^aij_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    readOnly: true
    description: Id of the AI job whose artifacts seeded this run (set for PR_COMMENT and PR_CHECKS fix runs).
