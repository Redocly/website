type: object
required:
  - id
  - aiJobId
  - type
  - status
properties:
  id:
    type: string
    pattern: ^ait_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: ait_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
    description: Unique identifier for the task.
  aiJobId:
    type: string
    pattern: ^aij_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: aij_01h1s5z6vf2mm1mz3hevnn9va7
    description: Identifier of the parent AI job that owns this task.
  type:
    $ref: ./AiJobTaskType.yaml
    description: Type of AI task.
  status:
    type: string
    enum:
      - QUEUED
      - RUNNING
      - COMPLETED
      - FAILED
      - SKIPPED
      - CANCELLED
    example: RUNNING
    description: Current status of the task.
  startedAt:
    type:
      - string
      - 'null'
    format: date-time
    example: '2026-04-17T10:16:00.000Z'
    description: Date the task starts executing.
  completedAt:
    type:
      - string
      - 'null'
    format: date-time
    example: '2026-04-17T10:18:42.000Z'
    description: Date the task finishes executing.
  error:
    type:
      - string
      - 'null'
    maxLength: 1000
    example: 'planner failed: model returned an error'
    description: >-
      Error message when the task has failed. The worker sanitizes it before
      reporting: URL query strings and fragments are stripped, internal hosts and paths are reduced, and
      secret-shaped values are redacted.
  result:
    description: Free-form data produced by the task.
    type:
      - object
      - 'null'
  activities:
    $ref: ./AiJobTaskActivities.yaml
