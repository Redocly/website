type: object
description: Git range context for an AI writer agent code-change run.
required:
  - baseSha
  - sourceCodePaths
properties:
  baseSha:
    type: string
    minLength: 1
    example: abc123def4567890
  headSha:
    type: string
    minLength: 1
    example: fedcba0987654321
  externalId:
    type: string
    minLength: 1
    maxLength: 120
    example: weekly-2026-W19
  sourceCodePaths:
    type: array
    items:
      type: string
      minLength: 1
    example:
      - apps/api/src
      - packages/shared/src
