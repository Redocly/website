type: object
title: Organization for Message Queue
description: Organization resource for message queue events. This schema excludes the `logo` field to prevent large base64-encoded binary data from being sent through RabbitMQ, which can cause message publishing failures.
properties:
  id:
    description: Organization ID. Unique identifier prefixed with `org_`.
    type: string
    pattern: ^org_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: org_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  name:
    description: Organization name.
    type: string
    example: Test Org
  slug:
    description: Organization slug.
    type: string
    example: org_acme-inc
  createdAt:
    description: Created date.
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    description: Updated date.
    type: string
    format: date-time
    readOnly: true
  defaultProjectRole:
    description: Default role for organization projects.
    $ref: ../rbac/ProjectRoleName.yaml
  entitlements:
    description: Entitlements for organization.
    $ref: ../Entitlements.yaml
    readOnly: true
  subscriptionStatus:
    description: Subscription status of the organization. The value is `trial` while the subscription is in trial, the status of the subscription such as `active` or `churned` in other cases, and `none` when the organization has no subscription.
    type: string
    example: trial
    readOnly: true
  isDisabled:
    description: Is organization disabled.
    type: boolean
    example: true
    readOnly: true
  requireSSO:
    description: Require SSO authentication for all members of the organization.
    type: boolean
    example: false
  object:
    description: Entity name.
    type: string
    enum: [organization]
    readOnly: true
  metadata:
    description: Organization metadata.
    oneOf:
      - type: 'null'
      - type: object
        properties:
          role:
            description: Role of the user in the organization.
            type: string
            example: Frontend developer
          intent:
            description: User's intent for the organization.
            type: string
            maxLength: 128
          intentAdditionalInfo:
            description: Additional information about the intent.
            type: string
            maxLength: 1000
  brandEnabled:
    description: Indicates whether organization branding is enabled.
    type: boolean
    example: true
  hideRedoclyBranding:
    description: Indicates whether logo should be hidden.
    type: boolean
    example: true
  customTerms:
    description: Organization legal consent.
    type: [string, 'null']
    example: Agree to the Terms of Service and Privacy Policy.
  respectMonitoringWorkflowsLimit:
    description: Maximum number of Respect Monitoring workflows allowed for organization.
    type: [integer, 'null']
    format: int32
    example: 20
  uri:
    description: Resource URI.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm
required:
  - id
  - name
  - slug
  - uri
  - createdAt
  - updatedAt
  - entitlements
  - subscriptionStatus
  - isDisabled
  - object
  - brandEnabled
  - hideRedoclyBranding
  - customTerms
  - respectMonitoringWorkflowsLimit

