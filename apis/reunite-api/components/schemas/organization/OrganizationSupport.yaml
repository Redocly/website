title: OrganizationSupport
allOf:
  - $ref: ./Organization.yaml
  - type: object
    properties:
      skipOAuthConsent:
        description: Whether this organization is trusted to skip the OAuth consent screen for all its OAuth2 clients. Managed by support only.
        type: boolean
        default: false
        example: false
        readOnly: true
      createdById:
        description: |-
          ID of the user who created the organization. `null` when that user no longer exists.
          Support resolves the user through the support users list.
        type: [string, 'null']
        example: usr_01hh1t9sa6gwfv5naz04gr7ehm
        readOnly: true
    required:
      - skipOAuthConsent
      - createdById
