type: object
properties:
  email:
    type: string
    maxLength: 320
    pattern: '^(\*|[^\s@*]+)@[^\s@*.]+(\.[^\s@*.]+)+$'
    description: |-
      Full email address, or a `*@domain` pattern to block the domain and all
      of its subdomains.
    example: '*@example.com'
  reason:
    type: string
    maxLength: 500
    description: Why the email is blocked.
required:
  - email
