type: object
required:
  - url
  - kind
properties:
  url:
    description: Portal login URL or MCP OAuth authorize URL for an SSO-required project.
    type: string
    format: uri
    maxLength: 2048
    example: https://dev.varonis.com/
  kind:
    description: Which flow the URL belongs to.
    type: string
    enum: [portal, mcp]
    example: portal
