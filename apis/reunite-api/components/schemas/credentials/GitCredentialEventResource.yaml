title: GitCredentialEventResource
description: Credential affected by a create/update action, with the Git provider account data when available.
type: object
properties:
  id:
    type: string
    pattern: ^cred_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    description: Credential id.
    example: cred_01h1s5z6vf2mm1mz3hevnn9va7
  object:
    type: string
    enum: [credential]
    description: Resource type.
    example: credential
  uri:
    type: string
    format: uri
    readOnly: true
  userId:
    type: string
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    description: Reunite user who owns the credential.
  provider:
    $ref: ../git/GitProviderType.yaml
  host:
    type: string
    format: hostname
    description: Git provider host (e.g. `github.com`). Absent for provider app credentials.
  externalActorId:
    type: string
    description: Provider-native actor id of the connected user. Absent for non-OAuth credentials.
required:
  - id
  - object
  - uri
