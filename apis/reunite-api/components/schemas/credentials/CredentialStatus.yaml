title: CredentialStatus
type: object
properties:
  id:
    description: Credential status ID. Matches the checked credential ID.
    type: string
    pattern: ^cred_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: cred_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [credentialStatus]
    readOnly: true
  isValid:
    type: boolean
  errorMessage:
    type: string
required:
  - id
  - object
  - isValid
