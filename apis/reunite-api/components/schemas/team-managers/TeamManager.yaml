type: object
properties:
  id:
    description: Team manager ID. Unique identifier prefixed with `tmg_`.
    type: string
    pattern: ^tmg_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: tmg_01jrgf18kp4e65d2eemewrbvq9
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [teamManager]
    readOnly: true
  uri:
    description: Canonical URI for the team manager resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/team-managers/tmg_01jrgf18kp4e65d2eemewrbvq9
  teamId:
    description: Team ID. Unique identifier prefixed with `team_`.
    type: string
    pattern: ^team_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: team_01hh1t9sa6gwfv5naz04gr7ehm
  userId:
    description: User ID. Unique identifier prefixed with `usr_`.
    type: string
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: usr_01jrgf18kp4e65d2eemewrbvq9
  createdAt:
    description: Created at.
    type: string
    format: date-time
    readOnly: true
    example: 2020-01-01T00:00:00.000Z
  updatedAt:
    description: Updated at.
    type: string
    format: date-time
    readOnly: true
    example: 2020-01-01T00:00:00.000Z
required:
  - id
  - object
  - uri
  - teamId
  - userId
  - createdAt
  - updatedAt
