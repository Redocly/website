type: object
properties:
  limit:
    type: number
    description: Limit for seats.
    example: 50
  used:
    type: number
    description: Number of used seats.
    example: 25
  newSeatAvailable:
    type: boolean
    description: Indicates if a new seat is available.
    example: true
  quotaStatus:
    description: Seats quota notification status computed at the last quota check.
    type: string
    enum:
      - OK
      - WARNING
      - EXCEEDED
    example: OK
    readOnly: true
  quotaStatusUpdatedAt:
    description: Timestamp of the last seats quota notification status transition.
    type:
      - string
      - 'null'
    format: date-time
    example: '2026-07-16T10:00:00Z'
    readOnly: true
required:
  - limit
  - used
  - newSeatAvailable
  - quotaStatus
  - quotaStatusUpdatedAt
