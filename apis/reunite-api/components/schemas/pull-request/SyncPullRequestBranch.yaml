type: object
properties:
  pullRequestId:
    type: string
    description: Pull request ID.
    example: pr_01h1s5z6vf2mm1mz3hevnn9va7
  branchName:
    type: string
    description: Branch name.  
    example: main
  branchId:
    type: ['string', 'null']
    description: Branch ID.  
    example: br_01h1s5z6vf2mm1mz3hevnn9va7
required:
  - pullRequestId
  - branchName
  - branchId