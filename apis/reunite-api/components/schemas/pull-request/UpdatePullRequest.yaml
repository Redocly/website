type: object
properties:
  branchName:
    description: Branch name.
    type: string
    example: main
    maxLength: 512
  branchId:
    description: Branch ID. Unique identifier prefixed with `br_`.
    type: string
    pattern: ^br_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: br_01h1s5z6vf2mm1mz3hevnn9va7
  targetBranchName:
    description: Target branch name.
    type: string
    example: develop
    maxLength: 512
  title:
    description: PR title.
    type: string
    maxLength: 255
  description:
    description: PR description.
    type: string
  status:
    description: PR status.
    type: string
    enum: [OPEN, CLOSED, MERGED]
  isDraft:
    description: Indicates whether or not pull request is a draft.
    type: boolean
  reviewers:
    description: List of reviewer IDs.
    type: array
    items:
      description: User ID. Unique identifier prefixed with `usr_`.
      type: string
      pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
      example: usr_01h1s5z6vf2mm1mz3hevnn9va7
    default: []
  userId:
    $ref: ../ActorUserId.yaml
