type: object
properties:
  status:
    description: Merger readiness status.
    type: string
    enum:
      [
        APPROVED,
        REQUESTED_CHANGES,
        REVIEW_REQUIRED,
        MERGE_CONFLICT,
        MERGED,
        CLOSED,
        DRAFT,
        FAILED_REQUIREMENTS,
        DEFAULT,
      ]
    example: APPROVED
  canMerge:
    description: Allows for a successful merge.
    type: boolean
    example: true
required:
  - canMerge
  - status
