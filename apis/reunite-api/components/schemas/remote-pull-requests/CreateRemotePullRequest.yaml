type: object
description: Pull request to create in the remote content's upstream provider repository.
properties:
  title:
    type: string
    minLength: 1
    description: Pull request title.
    example: 'docs: improve description fields'
    maxLength: 255
  description:
    type:
      - string
      - 'null'
    description: Pull request description.
  branchName:
    type: string
    minLength: 1
    description: Source branch of the pull request in the provider repository. Must already exist.
    example: writer-agent/aij_01h1s5z6vf2mm1mz3hevnn9va7-001-improve-descriptions
    maxLength: 512
  targetBranchName:
    type: string
    minLength: 1
    description: Target branch of the pull request in the provider repository. Defaults to the branch the remote syncs from.
    example: main
    maxLength: 512
  isDraft:
    type: boolean
    description: Whether the pull request is a draft.
required:
  - title
  - branchName
