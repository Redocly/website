type: object
description: Pull request in the remote content's upstream provider repository.
properties:
  object:
    type: string
    const: remotePullRequest
    description: Entity name.
    readOnly: true
  uri:
    description: URI reference to the remote pull requests collection.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/remotes/rem_01h1s5z6vf2mm1mz3hevnn9va7/pull-requests
  remoteId:
    $ref: ../remotes/RemoteIdSchema.yaml
    readOnly: true
  number:
    type: integer
    minimum: 1
    description: Pull request number in the provider repository.
    example: 42
    readOnly: true
  title:
    type: string
    minLength: 1
    description: Pull request title.
    example: 'docs: improve description fields'
    maxLength: 512
  description:
    type:
      - string
      - 'null'
    description: Pull request description.
  branchName:
    type: string
    minLength: 1
    description: Source branch of the pull request in the provider repository.
    example: writer-agent/aij_01h1s5z6vf2mm1mz3hevnn9va7-001-improve-descriptions
    maxLength: 512
  targetBranchName:
    type: string
    minLength: 1
    description: Target branch of the pull request in the provider repository. Defaults to the branch the remote syncs from.
    example: main
    maxLength: 512
  status:
    type: string
    enum:
      - OPEN
      - CLOSED
      - MERGED
    description: Pull request status.
    readOnly: true
  isDraft:
    type: boolean
    description: Whether the pull request is a draft.
  url:
    type: string
    format: uri
    description: Web URL of the pull request on the provider.
    example: https://github.com/some-gh-org/repo/pull/42
    readOnly: true
  createdAt:
    type: string
    format: date-time
    description: Pull request creation date.
    readOnly: true
required:
  - object
  - uri
  - remoteId
  - number
  - title
  - branchName
  - status
  - createdAt
