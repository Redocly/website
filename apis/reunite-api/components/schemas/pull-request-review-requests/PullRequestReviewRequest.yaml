type: object
properties:
  object:
    description: Entity name.
    type: string
    enum: [pullRequestReviewRequest]
    readOnly: true
  uri:
    description: URI reference to the pull request review requests collection.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/pull-request-review-requests
  pullRequestId:
    description: Pull request ID. Unique identifier prefixed with `pr_`.
    type: string
    pattern: ^pr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
  userId:
    description: User ID of the re-requested reviewer. Unique identifier prefixed with `usr_`.
    type: string
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
  requestedAt:
    description: Timestamp for the review re-request.
    type: string
    format: date-time
    readOnly: true
required:
  - object
  - uri
  - pullRequestId
  - userId
  - requestedAt
