allOf:
  - $ref: ./CreateFeedbackRequestBase.yaml
  - $ref: ./CreateScoredFeedbackRequestBase.yaml
  - type: object
    required:
      - feedbackComponent
      - score
      - maxScore
    properties:
      feedbackComponent:
        type: string
        enum:
          - RATING
        description: Name that identifies UI component.
      score:
        type: integer
        minimum: 1
        maximum: 5
        description: Star rating from 1 to 5.
      maxScore:
        type: integer
        const: 5
        description: Maximum score for the feedback component.
