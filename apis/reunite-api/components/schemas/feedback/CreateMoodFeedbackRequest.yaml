allOf:
  - $ref: ./CreateFeedbackRequestBase.yaml
  - $ref: ./CreateScoredFeedbackRequestBase.yaml
  - type: object
    required:
      - feedbackComponent
      - score
    properties:
      feedbackComponent:
        type: string
        enum:
          - MOOD
        description: Name that identifies UI component.
      score:
        type: integer
        minimum: -1
        maximum: 1
        description: Dissatisfied (-1), neutral (0), or satisfied (1).
      maxScore:
        type: integer
        minimum: 0
        maximum: 10
        description: Maximum score for the feedback component.
