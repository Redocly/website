allOf:
  - $ref: ./CreateFeedbackRequestBase.yaml
  - $ref: ./CreateScoredFeedbackRequestBase.yaml
  - type: object
    required:
      - feedbackComponent
      - score
      - maxScore
    properties:
      feedbackComponent:
        type: string
        enum:
          - SCALE
        description: Name that identifies UI component.
      score:
        type: integer
        minimum: 1
        maximum: 10
        description: Numeric scale value from 1 to 10.
      maxScore:
        type: integer
        const: 10
        description: Maximum score for the feedback component.
