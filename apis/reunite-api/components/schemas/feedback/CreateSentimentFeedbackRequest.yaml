allOf:
  - $ref: ./CreateFeedbackRequestBase.yaml
  - $ref: ./CreateScoredFeedbackRequestBase.yaml
  - type: object
    required:
      - feedbackComponent
      - score
    properties:
      feedbackComponent:
        type: string
        enum:
          - SENTIMENT
        description: Name that identifies UI component.
      score:
        type: integer
        enum:
          - -1
          - 1
        description: Thumbs down (-1) or thumbs up (1).
      maxScore:
        type: integer
        minimum: 0
        maximum: 10
        description: Maximum score for the feedback component.
