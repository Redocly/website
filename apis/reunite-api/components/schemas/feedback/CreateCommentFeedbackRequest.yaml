allOf:
  - $ref: ./CreateFeedbackRequestBase.yaml
  - type: object
    required:
      - feedbackComponent
      - comment
    properties:
      feedbackComponent:
        type: string
        enum:
          - COMMENT
        description: Name that identifies UI component.
      comment:
        type: string
        minLength: 1
        maxLength: 5000
        pattern: '\S'
        description: Free-form text feedback. Trimmed, so a whitespace-only value is rejected.
