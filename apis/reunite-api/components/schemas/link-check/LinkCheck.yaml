description: Link check.
type: object
properties:
  id:
    description: Link check id.
    type: string
    example: lch_01hryws57wp06d7n7v2nwkd9bg
    readOnly: true
  buildId:
    description: Build ID. Unique identifier prefixed with `pb_`.
    type: string
    pattern: ^pb_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: pb_01hq3hgers0gp1vd1w498dhdc4
  result:
    description: Describes up to 100 broken link results.
    type: array
    items:
      type: object
      maxItems: 100
      properties:
        type:
          type: string
          enum:
            - BROKEN_LINK
        brokenLinkType:
          type: string
          enum:
            - LINK
            - IMAGE
        title:
          type: string
        link:
          type: string
        rawLink:
          type: string
        message:
          type: string
        codeframe:
          type: string
        brokenLinkIsExternal:
          type: boolean
          enum: [false]
        sourceFileRelativePath:
          type: string
        sourceFileLocation:
          type: object
          properties:
            line:
              type: number
            character:
              type: number
          required:
            - line
      required:
        - type
        - brokenLinkType
        - title
        - link
        - rawLink
        - message
        - sourceFileRelativePath
        - sourceFileLocation
  brokenLinksCount:
    description: Broken links count.
    type: integer
    example: 1
  createdAt:
    description: Created date.
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    description: Updated date.
    type: string
    format: date-time
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [linkCheck]
    readOnly: true
  uri:
    description: URI reference to this link check.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/link-checks/lch_01hryws57wp06d7n7v2nwkd9bg
required:
  - id
  - uri
  - buildId
  - result
  - brokenLinksCount
  - createdAt
  - updatedAt
