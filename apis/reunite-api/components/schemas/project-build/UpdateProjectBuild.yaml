type: object
minProperties: 1
properties:
  status:
    description: Build status.
    type: string
    enum: [NOT_STARTED, QUEUED, IN_PROGRESS, FAILED, SUCCESS]
    example: SUCCESS
  previewDeploymentStatus:
    description: Deployment status.
    type: string
    enum: [NOT_STARTED, IN_PROGRESS, FAILED, SUCCESS]
    example: SUCCESS
  metadata:
    description: Build metadata.
    type: object
  artifact:
    description: Build artifact.
    type: string
  reuniteConfig:
    description: Reunite config.
    type: object
  isDeploymentSkipped:
    description: Whether the deployment is skipped.
    type: boolean
    example: false
