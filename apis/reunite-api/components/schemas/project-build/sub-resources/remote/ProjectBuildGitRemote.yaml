# Copy of GitRemote from remotes/GitRemote.yaml with updated properties.
# The differing projectId types that previously blocked allOf composition are gone;
# collapsing this into allOf over remotes/GitRemote.yaml is tracked separately.
type: object
properties:
  id:
    description: Remote ID. Unique identifier prefixed with `rem_`.
    type: string
    pattern: ^rem_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: rem_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  type:
    type: string
    const: GIT
  mountPath:
    $ref: ../../../remotes/MountPath.yaml
  autoSync:
    $ref: ../../../remotes/AutoSync.yaml
  autoMerge:
    $ref: ../../../remotes/AutoMerge.yaml
  createdAt:
    type: string
    readOnly: true
    examples:
      - '2023-06-07T00:00:00Z'
    format: date-time
  updatedAt:
    type: string
    readOnly: true
    examples:
      - '2023-06-07T00:00:00Z'
    format: date-time
  editedAt:
    description: Date and time of upserting Remote by user.
    type:
      - string
      - 'null'
    readOnly: true
    examples:
      - '2023-06-07T00:00:00Z'
    format: date-time
  createdById:
    description: User ID who created Remote.
    type:
      - string
      - 'null'
    example: usr_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  editedById:
    description: User who recently upserted Remote.
    type:
      - string
      - 'null'
    example: usr_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  lastSyncedAt:
    type:
      - string
      - 'null'
    format: date-time
    description: |-
      Last time remote processed the default branch update. `null` when the remote has never been synced.
    example: 2021-08-25T10:00:00.000Z
  attempts:
    type: integer
    description: Number of attempts to sync the remote.
    example: 1
  # These fields are nullable in the data model (prisma `Remote`): a project
  # *source* git remote leaves the content-mounting/repo fields null, and the
  # response is the raw remote row. Mirror that nullability here.
  providerType:
    anyOf:
      - $ref: ../../../git/GitProviderType.yaml
      - type: 'null'
  namespaceId:
    description: Git repo namespace id (organization for GitHub).
    type:
      - string
      - 'null'
  repositoryId:
    description: Git repo id.
    type:
      - string
      - 'null'
  mountBranchName:
    anyOf:
      - $ref: ../../../remotes/MountBranchName.yaml
      - type: 'null'
  contentPath:
    description: Path to the connected folder in the remote repository.
    type:
      - string
      - 'null'
  credentialId:
    type:
      - string
      - 'null'
    example: crd_01hc2rvwxf7jyj1er504khx8e7
    description: Credential ID.
  branchName:
    description: Branch name in the remote repository.
    type:
      - string
      - 'null'
    example: dev
  contentType:
    type:
      - string
      - 'null'
    enum:
      - FOLDER
      - FILE
      - null
    example: FILE
  url:
    type: 'null'
    readOnly: true
  interval:
    type: 'null'
    readOnly: true
  userId:
    description: User ID. Unique identifier prefixed with `usr_`.
    type: string
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: usr_01hh1t9sa6gwfv5naz04gr7ehm
    writeOnly: true
  object:
    description: Entity name.
    type: string
    enum: [remote]
    readOnly: true
  previewBranchesConfig:
    type:
      - object
      - 'null'
    description: Configuration for preview branches.
  status:
    type: string
    enum:
      - PENDING
      - IN_PROGRESS
    description: Current status of the remote.
  lastFinishedUrlUpdateId:
    type:
      - string
      - 'null'
    description: ID of the last finished URL update.
  lastFinishedGitUpdateId:
    type:
      - string
      - 'null'
    description: ID of the last finished Git update.
  branchDeployStrategy:
    type: string
    enum:
      - NONE
      - SELECTED
      - ALL
    default: NONE
    description: Strategy for deploying branches.
  selectedDeployBranches:
    type: array
    items:
      type: string
    description: List of branches selected for deployment when using SELECTED strategy.
    default: []
  prDeploysEnabled:
    type: boolean
    description: Whether pull request deploys are enabled.
    default: true
  forksPrDeploysEnabled:
    type: boolean
    description: Whether pull request deploys from forks are enabled.
    default: false
  visualReviewCheckDisabled:
    type: boolean
    description: Whether the Visual review check is disabled. A disabled check is reported as skipped instead of pending.
    default: false
  fileName:
    type:
      - string
      - 'null'
    description: File name of the remote content.
  contentRevisionDate:
    type:
      - string
      - 'null'
    format: date-time
    description: Date and time of the content revision.
  errors:
    $ref: ../../../remotes/GenericRemoteError.yaml
  uri:
    type: string
    format: uri
    description: Canonical URI for the remote resource.
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/remotes/rem_01h1s5z6vf2mm1mz3hevnn9va7
required:
  - id
  - type
  - mountPath
  - mountBranchName
  - createdAt
  - updatedAt
  - editedAt
  - createdById
  - editedById
  - repositoryId
  - branchName
  - contentPath
  - contentType
  - providerType
  - credentialId
  - object
  - uri
