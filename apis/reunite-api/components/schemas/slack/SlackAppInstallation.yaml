type: object
properties:
  id:
    description: Slack app installation ID. Unique identifier prefixed with `amnai_`.
    type: string
    pattern: ^amnai_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: amnai_01h2zvgfdqex5na189kdg39d6s
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [slackAppInstallation]
    example: slackAppInstallation
    readOnly: true
  uri:
    description: URI reference to this Slack app installation.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/slack-app-installations/amnai_01h2zvgfdqex5na189kdg39d6s
  workspaceId:
    description: Id of the notifications app workspace.
    type: string
    example: G57JH6L4GJ6K
  workspaceName:
    description: Name of the notifications app workspace.
    type: string
    example: namespace name
  createdAt:
    description: Created date.
    type: string
    format: date-time
    example: '2023-06-15T15:41:42.696Z'
    readOnly: true
required:
  - id
  - object
  - uri
  - createdAt
  - workspaceId
  - workspaceName
