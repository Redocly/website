type: object
properties:
  id:
    description: Slack channel ID.
    type: string
    example: C061EG9T2
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [slackChannel]
    example: slackChannel
    readOnly: true
  uri:
    description: URI reference to this Slack channel.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/slack-app-installations/amnai_01h2zvgfdqex5na189kdg39d6s/channels/C061EG9T2
  name:
    description: Name of the Slack channel.
    type: string
    example: example name
  slackAppInstallationId:
    description: Slack app installation ID. Unique identifier prefixed with `amnai_`.
    type: string
    pattern: ^amnai_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: amnai_01h2zvgfdqex5na189kdg39d6s
    readOnly: true
required:
  - id
  - object
  - uri
  - name
  - slackAppInstallationId
