type: object
properties:
  id:
    description: Organization ID. Unique identifier prefixed with `org_`.
    type: string
    pattern: ^org_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: org_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  status:
    type: string
    description: Usage report status.
    enum: [UPDATED, LIMIT_EXCEEDED, UPDATE_FAILED, SKIPPED]
    readOnly: true
  quantity:
    type: number
    description: Number of pages.
  object:
    description: Entity name.
    type: string
    enum: [pagesUsage]
    readOnly: true
  uri:
    description: URI of the pages usage resource.
    type: string
    format: uri
    readOnly: true
required:
  - id
  - status
  - object
  - quantity
  - uri
