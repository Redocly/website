type: object
required:
  - artifactType
  - filename
  - contentType
  - uploadSessionId
  - contentLength
properties:
  artifactType:
    type: string
    enum:
      - ai-scaffold
    description: >-
      Type of artifact being uploaded. Controls validation rules
      (allowed MIME types, max file size) and the S3 key prefix.
  filename:
    type: string
    minLength: 1
    maxLength: 255
    description: Original filename of the file to be uploaded.
  contentType:
    type: string
    enum:
      - application/json
      - application/x-yaml
      - text/yaml
      - text/markdown
      - text/plain
      - image/png
      - image/jpeg
      - image/webp
      - image/svg+xml
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/csv
      - text/xml
      - text/html
      - text/css
      - application/zip
    description: MIME type of the file to be uploaded.
  uploadSessionId:
    type: string
    format: uuid
    description: >-
      Client-generated UUID that groups all files uploaded together in
      one session. Used as part of the S3 key prefix.
  contentLength:
    type: integer
    minimum: 1
    maximum: 5242880
    description: Size of the file in bytes. Maximum 5 MB.
