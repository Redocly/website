type: object
required:
  - type
properties:
  type:
    description: Identity provider type.
    type: string
    const: OPENID
allOf:
  - $ref: ./BaseIdentityProvider.yaml
  - type: object
    properties:
      id:
        type: string
        description: Identity provider ID. Unique identifier prefixed with `idp_`.
        pattern: ^idp_[0-9abcdefghjkmnpqrstvwxyz]{26}$
        example: idp_01arz3ndektsv4rrffq69g5fav
      oidcConfigUrl:
        type: string
        description: OpenId configuration url.
      oidcConfig:
        type: object
        description: OpenId configuration.
      clientId:
        type: string
        description: OAuth2 client ID.
      clientSecret:
        type: string
        description: OAuth2 client secret.
        writeOnly: true
      scopes:
        type: array
        items:
          type: string
      additionalParams:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            value:
              type: string
          required:
            - name
    required:
      - oidcConfig
      - clientId
