type: object
required:
  - type
properties:
  type:
    description: Identity provider type.
    type: string
    const: SAML2
allOf:
  - $ref: ./BaseIdentityProvider.yaml
  - type: object
    properties:
      id:
        type: string
        description: Identity provider ID. Unique identifier prefixed with `idp_`.
        pattern: ^idp_[0-9abcdefghjkmnpqrstvwxyz]{26}$
        example: idp_01arz3ndektsv4rrffq69g5fav
      issuerId:
        type: string
      singleSignOnUrl:
        type: string
      x509Certificate:
        type: string
      defaultProjectId:
        description: |
          Project that viewers are redirected to after an IdP-initiated login.
          When not set, viewers are redirected to the organization's first created project.
        type: [string, 'null']
        pattern: ^prj_[0-9abcdefghjkmnpqrstvwxyz]{26}$
        example: prj_01arz3ndektsv4rrffq69g5fav
