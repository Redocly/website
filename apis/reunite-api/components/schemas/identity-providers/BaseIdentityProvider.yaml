type: object
properties:
  organizationId:
    description: Organization that owns the identity provider.
    type: string
    readOnly: true
  name:
    description: Identity provider name.
    type: string
    example: Identity Provider
  slug:
    description: |
      Unique ID for the identity provider within the organization. Used in `access.idps` in project configuration to target this provider. Generated from `name` if not provided.
      `redocly`, `corporate`, and `guest` are reserved and rejected with a 400 error.
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    maxLength: 63
    example: identity-provider
  type:
    description: Identity provider type. Discriminator — narrowed to a concrete value by each subtype (`OPENID`, `SAML2`).
    type: string
  loginType:
    description: Login category — controls which `access.sso` configuration list (`GUEST`, `CORPORATE`) matches this identity provider.
    type: string
    enum: [GUEST, CORPORATE]
  defaultTeamId:
    description: Default team.
    type: string
    example: team_
  role:
    description: Organization role.
    $ref: ../rbac/OrganizationRole.yaml
  rbacClaimName:
    type: string
    description: Claim name inspected for team names. User is added to these teams automatically. Teams are for role based access controls.
    example: https://redocly.com/sso/teams
  scimEnabled:
    description: Whether SCIM provisioning is enabled for the identity provider.
    type: boolean
    readOnly: true
  connectionUrl:
    description: URL used to initiate the SSO login flow for this provider.
    type: string
    readOnly: true
  teamClaimMapping:
    type: array
    items:
      type: object
      properties:
        value:
          type: string
          description: Teams claim attribute value to replace.
          example: a4e6c815-11f0-4e11-a709-d0abd19ebf15
        teamName:
          type: string
          description: Target team name.
          example: Administrators
      required:
        - value
        - teamName

required:
  - name
  - type
  - role
  - loginType
