type: object
properties:
  id:
    type: string
    example: rem_01hc2rvwxf7jyj1er504khx8e7
    description: Remote source id.
    readOnly: true
  uri:
    description: Canonical URI for the project source resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/sources
  branchName:
    description: Project main branch name.
    type: string
    example: main
  contentPath:
    description: Project content path.
    type: string
    example: /
  repoName:
    description: Project Source repository name.
    type: string
    example: Repo Name
  repoUrl:
    description: Project Source repository url.
    type: string
    example: https://github.com/example/example
  isInternal:
    description: Is project source internal.
    type: boolean
    example: true
  isMonorepo:
    description: Is project source monorepo.
    type: boolean
    example: true
  providerType:
    $ref: ../git/GitProviderType.yaml
  providerConfig:
    $ref: ../git/GitProvider.yaml
  canAccessRepo:
    type: boolean
    example: true
    description: Is has access to the repo.
  credentialId:
    type: string
    example: cred_01hc2rvwxf7jyj1er504khx8e7
    description: Credential ID.
  transferMode:
    type: string
    enum:
      - CLONE
      - PUSH
    description: Remote source transfer mode.
    writeOnly: true
  sourceId:
    type: string
    example: rem_01hc2rvwxf7jyj1er504khx8e7
    description: Remote source id.
    deprecated: true
  namespaceId:
    type: string
    description: Namespace identifier.
    example: azure-test-org
    writeOnly: true
  repositoryId:
    type: string
    description: Repository identifier.
    example: redocly-testing
    writeOnly: true
  branchDeployStrategy:
    type: string
    enum:
      - NONE
      - SELECTED
      - ALL
  selectedDeployBranches:
    type: array
    description: List of branches that start builds when get update or open PR into.
    items:
      type: string
  prDeploysEnabled:
    type: boolean
    description: Whether build starts only when PR open into either default branch or selected list of branches.
  forksPrDeploysEnabled:
    type: boolean
    description: Whether build starts for PRs from forks.
  visualReviewCheckDisabled:
    type: boolean
    default: false
    description: Whether the Visual review check is disabled. A disabled check is reported as skipped instead of pending.
  object:
    description: Entity name.
    type: string
    enum: [projectSource]
    readOnly: true

required:
  - id
  - uri
  - branchName
  - contentPath
  - isInternal
  - isMonorepo
  - branchDeployStrategy
  - selectedDeployBranches
  - prDeploysEnabled
  - forksPrDeploysEnabled
  - visualReviewCheckDisabled
  - object
