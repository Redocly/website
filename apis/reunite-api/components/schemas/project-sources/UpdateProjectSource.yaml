type: object
title: UpdateProjectSource
description: Fields a project source update accepts. Every field is optional.
properties:
  prDeploysEnabled:
    type: boolean
    description: Whether build starts only when PR open into either default branch or selected list of branches.
  forksPrDeploysEnabled:
    type: boolean
    description: Whether build starts for PRs from forks.
  visualReviewCheckDisabled:
    type: boolean
    description: Whether the Visual review check is disabled. A disabled check is reported as skipped instead of pending.
  selectedDeployBranches:
    type: array
    description: List of branches that start builds when get update or open PR into.
    items:
      type: string
  branchDeployStrategy:
    type: string
    enum:
      - NONE
      - SELECTED
      - ALL
  credentialId:
    type: string
    example: cred_01hc2rvwxf7jyj1er504khx8e7
    description: Credential ID.
