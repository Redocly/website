type: object
title: Project
properties:
  id:
    description: Project ID. Unique identifier prefixed with `prj_`.
    type: string
    pattern: ^prj_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: prj_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  name:
    description: Project name.
    type: string
    example: Test Project
  slug:
    description: Project slug.
    type: string
    example: project_red-owl-352
  uri:
    description: Canonical URI for the project resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm
  createdAt:
    description: Created date.
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    description: Updated date.
    type: string
    format: date-time
    readOnly: true
  sourceId:
    description: Project source ID (Remote ID).
    type: string
    example: rem_01h3yam4gvc3p9d2nzcwaya8y5
    readOnly: true
  productType:
    $ref: ../ProductType.yaml
    readOnly: true
  useLegacyEmbedding:
    description: Whether to use legacy embedding for AI search.
    type: boolean
    example: false
    readOnly: true
  isDraft:
    description: Whether the project is in draft state.
    type: boolean
    example: false
    readOnly: true
  publishingStrategy:
    readOnly: true
    type: string
    enum:
      - MANUAL
      - SKIP_IF_NEWER_BUILD_STARTED
      - SKIP_IF_NEWER_BUILD_FINISHED
    description: Project builds publishing strategy.
  config:
    description: Universal config.
    type:
      - object
      - 'null'
    readOnly: true
  aiAssistant:
    $ref: ./ProjectAiAssistantSettings.yaml
    readOnly: true
  projectTemplateId:
    description: Project template ID. Unique identifier prefixed with `prt_`.
    type: string
    pattern: ^prt_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: prt_01h1s5z6vf2mm1mz3hevnn9va7
  source:
    $ref: ../project-sources/ProjectSourceInput.yaml
    description: |
      Connect the project to your own Git repository at creation time. Only the create-project
      operation accepts this property; update requests reject it. Cannot be combined with
      `projectTemplateId` or with AI scaffolding options, because both write into a
      Redocly-hosted repository.
    writeOnly: true
  object:
    description: Entity name.
    type: string
    enum: [project]
    readOnly: true
required:
  - id
  - name
  - slug
  - uri
  - createdAt
  - updatedAt
  - sourceId
  - productType
  - config
  - object
  - useLegacyEmbedding
  - isDraft
  - aiAssistant
