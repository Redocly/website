type: object
additionalProperties: false
required:
  - buildId
properties:
  buildId:
    type: string
    pattern: ^pb_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    description: >-
      Identifier of the build that deployed the Lambda. Must belong to this organization and
      project. The build's branch decides which entry to publish: the project's production
      route for a default-branch build, that branch's preview route otherwise.
    example: pb_01kzt50775capjeapfhsmbc9d6
  access:
    type: object
    additionalProperties: false
    required:
      - requiresLogin
      - rbacConfigured
    description: >-
      Access posture of the deployed build, read from the realm-plus build's
      `build-metadata.json` (`sections.access`). Persisted on the project by a default-branch
      build and stamped onto the DynamoDB edge-routing record so the edge router can gate
      asset requests. Absent when the build's realm-plus version predates the metadata
      envelope.
    properties:
      requiresLogin:
        type: boolean
        description: Whether every page and byte of the site requires an authenticated session.
      rbacConfigured:
        type: boolean
        description: Whether the project configures `access.rbac` (granular content access).
  contentAssetAudiences:
    type: object
    additionalProperties: false
    required:
      - schemaVersion
      - tags
    description: >-
      Audience table (`{tag -> descriptor}`) for `.a-<tag>` content-asset filenames, read
      from the build's `build-metadata.json` (`sections.contentAssetAudiences`) and stamped
      verbatim onto the edge-routing record. Present only when rbac is configured.
    properties:
      schemaVersion:
        type: integer
        description: Version of the descriptor shape; unknown versions must deny closed.
      tags:
        type: object
        description: One entry per authorization unit with a non-public audience.
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            teams:
              type: array
              items:
                type: string
              description: Team names whose members may read assets under this tag.
            teamPatterns:
              type: array
              items:
                type: string
              description: >-
                Reserved: build-generated anchored team-name regexes (teamFolders parity).
