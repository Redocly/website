type: object
title: CreateProject
description: Fields a project create accepts. Every field is optional.
properties:
  name:
    type: string
    minLength: 1
    description: Project name.
    example: My Project
  slug:
    type: string
    minLength: 1
    description: Project slug.
    example: my-project
  projectTemplateId:
    type: string
    description: Template the project is scaffolded from.
  description:
    type: string
    maxLength: 2000
    description: Prompt for the AI project scaffold.
  fileUrls:
    type: array
    maxItems: 10
    description: Uploaded resource files for the AI project scaffold.
    items:
      type: string
      minLength: 1
      maxLength: 512
  linkUrls:
    type: array
    maxItems: 10
    description: Resource links for the AI project scaffold.
    items:
      type: string
      minLength: 1
      maxLength: 2048
  logoUrl:
    type:
      - string
      - 'null'
    minLength: 1
    maxLength: 512
    description: Logo for the AI project scaffold.
  metadata:
    type: object
    description: Arbitrary metadata for the AI project scaffold.
    additionalProperties: true
