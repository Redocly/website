type: object
properties:
  client_id:
    type: string
    description: Client ID that initializes device login.
    example: client123
  client_name:
    type: string
    description: Client name for well known device login clients.
    example: redocly-cli
  device_code:
    description: Device code used for device login status polling.
    type: string

required:
  - device_code

oneOf:
  - required: [client_id]
  - required: [client_name]

