type: object
properties:
  user_code:
    description: User code to be used in device login UI.
    type: string
    example: '123456'
    readOnly: true
  device_code:
    description: Device code used for device login status polling.
    type: string
    readOnly: true
  verification_uri:
    description: Device login UI url where user can enter user code and start authentication.
    type: string
    example: https://app.cloud.redocly.com/device-login
    readOnly: true
  verification_uri_complete:
    description: Device login UI url with user code specified so user don't need to manually type it.
    type: string
    example: https://app.cloud.redocly.com/device-login?userCode=123456
    readOnly: true
  interval:
    description: Interval (in seconds) how often client has to query for access token endpoint.
    type: number
    example: 5 
    readOnly: true
  expires_in:
    description: Number of seconds after which device login flow expires.
    type: number
    example: 900
    readOnly: true
required:
  - user_code
  - device_code
  - verification_uri
  - verification_uri_complete
  - interval
  - expires_in
