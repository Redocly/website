type: object
properties:
  id:
    description: Team Project ID.
    type: string
    example: bce8dac8-4b87-4f26-bfe2-0001af4b2783
  projectRole:
    $ref: ../rbac/ProjectRoleName.yaml
  project:
    description: Project.
    type: object
