type: object
properties:
  name:
    description: Team name.
    type: string
    example: Test Team
  userIds:
    description: List of users IDs.
    type: array
    uniqueItems: true
    items:
      description: User ID.
      type: string
      example: usr_01jrgf18kp4e65d2eemewrbvq9
  managerIds:
    description: List of managers IDs.
    type: array
    uniqueItems: true
    items:
      description: Manager ID.
      type: string
      example: usr_01jrgf18kp4e65d2eemewrbvq9
required:
  - name
