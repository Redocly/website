type: object
description: Single AI gateway request log entry submitted for persistence.
required:
  - requestId
  - tenant
  - callerService
  - model
  - status
  - usage
  - costUsd
  - startedAt
  - finishedAt
properties:
  requestId:
    type: string
    example: req_01h1s5z6vf2mm1mz3hevnn9va7
    description: Globally unique request identifier. Duplicate submissions are idempotent.
  tenant:
    $ref: AiGatewayRequestTenant.yaml
  callerService:
    type: string
    example: ai-worker
    description: Identifier of the service issuing the call.
  feature:
    $ref: ./AiGatewayFeature.yaml
  agent:
    type: string
    example: planner
    description: Optional agent identifier within the caller service.
  provider:
    type: string
    enum:
      - google
      - bedrock
      - bedrock-mantle
      - vertex
      - typesafe
      - unknown
    example: bedrock
    description: |-
      Resolved upstream provider id, or `unknown` when no provider is
      resolved for the call.
  model:
    type: string
    example: anthropic.claude-3-7-sonnet-20250219
    description: Resolved upstream model id.
  status:
    type: string
    enum:
      - SUCCESS
      - FAILED
      - PLUGIN_REJECTED
    example: SUCCESS
    description: Outcome classification for the call.
  errorKind:
    type: string
    enum:
      - rate_limit
      - timeout
      - server
      - validation
      - auth
      - budget_exceeded
      - compliance_rejected
      - plugin_error
      - unknown
    example: rate_limit
    description: Normalized error category when the status is not SUCCESS.
  traceId:
    type: string
    example: 4bf92f3577b34da6a3ce929d0e0e4736
    description: OTel trace id for cross-system correlation.
  spanId:
    type: string
    example: 00f067aa0ba902b7
    description: OTel span id for the gateway-emitted span.
  usage:
    $ref: AiGatewayRequestLogUsage.yaml
  costUsd:
    type: number
    example: 0.0123
    description: Cost of the call in USD.
  metadata:
    type: object
    additionalProperties: true
    description: Free-form per-call metadata supplied by the caller.
  rejection:
    type: object
    description: |-
      Diagnostic snapshot describing why a call is rejected. Present when
      `status` is `PLUGIN_REJECTED`.
    required:
      - amount
      - used
      - requested
    properties:
      limitId:
        type: string
        example: lu_01kr1ej7knafaez5sec8d1e58k
        description: |-
          Identifier of the breached usage-limit row. Absent for
          job-scope rejections that have no persisted limit.
      scope:
        type: string
        enum: [job]
        example: job
        description: Scope of the rejection when no persisted limit applies.
      amount:
        type: number
        example: 0.05
        description: Cap value in effect at the time of rejection.
      used:
        type: number
        example: 0.0333
        description: Amount already consumed in the active cycle at the time of rejection.
      requested:
        type: number
        example: 0.0324
        description: Pre-flight estimate that triggers the rejection.
  startedAt:
    type: string
    format: date-time
    example: '2026-05-08T10:15:00.000Z'
    description: Timestamp at which the gateway begins processing the call.
  finishedAt:
    type: string
    format: date-time
    example: '2026-05-08T10:15:02.345Z'
    description: Timestamp at which the gateway finalizes the call.
