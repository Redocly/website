type: object
description: Token usage breakdown for an AI gateway call.
properties:
  inputTokens:
    type: integer
    minimum: 0
    example: 1234
    description: Prompt tokens charged by the provider.
  outputTokens:
    type: integer
    minimum: 0
    example: 567
    description: Completion tokens charged by the provider.
  totalTokens:
    type: integer
    minimum: 0
    example: 1801
    description: Total billable tokens. Defaults to input + output when omitted.
  cacheReadTokens:
    type: integer
    minimum: 0
    example: 0
    description: Tokens read from a provider-side prompt cache.
  cacheCreationTokens:
    type: integer
    minimum: 0
    example: 0
    description: Tokens written into a provider-side prompt cache.
