type: object
description: |-
  Tenant context for an AI gateway call. The owning organization is taken
  from the request path; this object carries the optional sub-scopes.
properties:
  projectId:
    type: string
    example: prj_01h1s5z6vf2mm1mz3hevnn9va7
    description: Project owning the call when applicable.
  userId:
    type: string
    example: usr_01h1s5z6vf2mm1mz3hevnn9va7
    description: User on whose behalf the call originates.
  operationId:
    type: string
    example: aij_01h1s5z6vf2mm1mz3hevnn9va7
    description: |-
      Stable identifier for the high-level operation this call is part of.
      Persisted to `ai_gateway_request_logs.operation_id` so many calls
      sharing one id count as a single credit.