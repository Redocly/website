allOf:
  - $ref: ./CreateReviewComment.yaml
  - type: object
    properties:
      id:
        description: Review Comment ID. Unique identifier prefixed with `com_`.
        type: string
        pattern: ^com_[0-9abcdefghjkmnpqrstvwxyz]{26}$
        example: com_01h1s5z6vf2mm1mz3hevnn9va7
        readOnly: true
      object:
        description: Entity name.
        type: string
        enum: [reviewComment]
        readOnly: true
      uri:
        description: Canonical URI for the review comment resource.
        type: string
        format: uri
        readOnly: true
        example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/review-comments/com_01h1s5z6vf2mm1mz3hevnn9va7
      externalId:
        description: Comment id in external provider.
        type: string
      createdAt:
        description: Created date.
        type: string
        readOnly: true
        format: date-time
      updatedAt:
        description: Updated date.
        type: string
        readOnly: true
        format: date-time
      isOutdated:
        description: the comment is not relevant.
        type: boolean
        default: false
        readOnly: true
      resolvedAt:
        description: Resolved date.
        type: [string, 'null']
        readOnly: true
        format: date-time
      resolvedById:
        description: ID of user who resolved Review Comment. Unique identifier prefixed with `usr_`.
        type: [string, 'null']
      type:
        description: Type of comment.
        type: string
        enum: [FILE, VISUAL]
    required:
      - id
      - object
      - uri
      - createdAt
      - updatedAt
      - isOutdated
      - type
