type: object
properties: 
  id:
    description: Branch ID. Unique identifier prefixed with `br_`.
    type: string
    pattern: ^br_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: br_01h1s5s6vf1mm0mz3hevnn3va7
    readOnly: true
  name:
    type: string
    description: Branch name.
    example: 'dev'
  commitSha:
    type: string
    description: Branch commit sha.
    example: 45f2835fc0367190245e882db79b3199f74e96ce
  userId:
    description: ID of the user performing the action. Unique identifier prefixed with `usr_`.
    type: string
    example: usr_01h1s5z6vf2mm1mz3hevnn9va7
    writeOnly: true
  isAutoGenerated:
    type: boolean
    description: Indicates if the branch is auto-generated.
    default: false
    example: false
    readOnly: true
  uri:
    description: Canonical URI for the branch resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/branches/br_01h1s5s6vf1mm0mz3hevnn3va7
  createdAt:
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    readOnly: true
  object:
    type: string
    const: branch
    readOnly: true
  remoteBranchName:
    type: [string, 'null']
    readOnly: true
    description: Remote content branch name.
    example: dev
  remoteNamespaceId:
    type: [string, 'null']
    readOnly: true
    description: Remote content namespace ID.
    example: namespace
  remoteRepositoryId:
    type: [string, 'null']
    readOnly: true
    description: Remote content repository ID.
    example: repo
  remoteOriginUrl:
    type: [string, 'null']
    readOnly: true
    format: uri
    description: Remote content origin URL.
    example: https://github.com
required: 
  - id
  - name
  - commitSha
  - uri
  - isAutoGenerated 
  - createdAt
  - updatedAt
  - object
  - remoteBranchName
  - remoteNamespaceId
  - remoteRepositoryId
  - remoteOriginUrl
  