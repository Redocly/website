type: object
description: Result of a Git webhook refresh operation.
properties:
  organizationId:
    description: Organization ID.
    type: string
    pattern: ^org_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: org_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  credentialId:
    description: Credential ID used to refresh the webhook.
    type: string
    example: cred_01hc2rvwxf7jyj1er504khx8e7
  repositoryId:
    description: Git repository ID.
    type: string
    example: '18796638'
  namespaceId:
    description: Git repository namespace ID.
    type:
      - string
      - 'null'
    example: group-id
required:
  - credentialId
  - repositoryId
  - namespaceId
