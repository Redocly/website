type: object
properties:
  id:
    type: string
    example: blue-harvest-git-repos
  name:
    type: string
    example: blue-harvest-git-repos
  installationId:
    oneOf:
      - type: string
        example: '37070315'
        description: GitHub App installation ID. Required to be passed for GitHub provider.
      - type: 'null'
        description: Null value for other providers.
required:
  - name
  - id
