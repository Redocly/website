type: object
properties:
  username: 
    type: string
    description: Commit author username.
    example: user
  email:
    type: 
      - string
      - 'null'
    description: Commit author email.
    format: email
    example: user@mail.com
  avatarUrl:
    type: 
      - string
      - 'null'
    format: uri
    description: Commit author avatar URL.
    example: "https://gitlab.example.com/uploads/-/system/user/avatar/1/avatar.png"
required:
  - username