type: object
properties:
  commitSha:
    type: string
    example: ceca734d8b919e80298012e5b967af8d40dc1d20
    description: Commit hash that status belongs to.
  description:
    type: string
    example: Required
    description: Commit status details.
  context:
    type: string
    example: Visual review
    description: Commit status context.
  state:
    $ref: ./CommitCheckState.yaml
  targetUrl:
    description: Commit staus details URL.
    type: string
    format: url
  updatedAt:
    description: Provider timestamp of the latest state change, when the provider reports it.
    type: string
    format: date-time
    example: "2025-11-12T10:05:00.000Z"
required:
  - commitSha
  - context
  - state
