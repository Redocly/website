type: object
properties:
  isValid:
    type: boolean
  organizationId:
    type: string
    readOnly: true
  productType:
    $ref: ../ProductType.yaml
    description: >-
      Present only when the request includes a subscription filter, in which case it
      echoes the requested product type. Omitted when the status is requested without a
      filter (for example, for organizations without a subscription).
required:
  - isValid