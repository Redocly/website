type: object
required:
  - id
  - object
  - uri
  - createdAt
properties:
  id:
    type: string
    readOnly: true
    description: Unique identifier of the escalation.
    example: aiesc_01kae541a8tcfvt7skj4e6y6sk
  object:
    type: string
    readOnly: true
    const: aiAssistantEscalation
  uri:
    type: string
    format: uri
    readOnly: true
    description: Resource URI. Escalations are write-only, so this addresses the collection.
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/ai-assistant-escalations
  createdAt:
    type: string
    readOnly: true
    description: Date and time of escalation creation.
    format: date-time
