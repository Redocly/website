type: object
properties:
  id:
    description: Environment variable ID. Unique identifier prefixed with `ev_`.
    type: string
    pattern: ^ev_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: ev_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [environmentVariable]
    readOnly: true
  uri:
    description: URI reference to this environment variable.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/env-variables/ev_01h1s5z6vf2mm1mz3hevnn9va7
  key:
    description: Environment variable key.
    type: string
    example: API_KEY
  value:
    description: Environment variable value.
    type: string
    example: secret_value
  isSecret:
    description: Environment variable is secret.
    type: boolean
    example: false
  createdAt:
    description: Created date.
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    description: Updated date.
    type: string
    format: date-time
    readOnly: true
  updatedById:
    description:  user who recently updated env variable.
    type: [string, 'null']
    example: usr_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
required:
  - id
  - uri
  - key
  - value
  - isSecret
  - object
  - createdAt
  - updatedAt
  - updatedById
