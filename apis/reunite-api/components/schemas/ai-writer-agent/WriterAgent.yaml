type: object
required:
  - id
  - object
  - uri
  - enabled
  - triggers
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    readOnly: true
    description: Unique identifier of the writer agent configuration.
    example: aua_01HVKD9WYZ2N9F7XWZB1N2Z9W8
  object:
    type: string
    readOnly: true
    const: writerAgentConfig
  uri:
    type: string
    format: uri
    readOnly: true
    description: Resource URI.
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/ai-writer-agent
  enabled:
    type: boolean
    description: Whether the AI writer agent features are enabled for the project.
    example: true
  triggers:
    type: array
    description: List of conditions that trigger the writer agent.
    items:
      type: string
      enum:
        - MANUAL
        - FEEDBACK
        - SCHEDULED
        - CODE_CHANGE
        - PR_COMMENT
  defaultReviewerIds:
    type: array
    description: |-
      IDs of users added as reviewers to every pull request opened by the writer agent.
      Omit the field on upsert to keep the current list unchanged; pass an empty array to clear it.
    uniqueItems: true
    maxItems: 50
    items:
      type: string
      pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
      example: usr_01hh1t9sa6gwfv5naz04gr7ehm
  createdAt:
    type: string
    readOnly: true
    description: Date and time of configuration creation.
    format: date-time
  updatedAt:
    type: string
    readOnly: true
    description: Date and time of the last configuration update.
    format: date-time
