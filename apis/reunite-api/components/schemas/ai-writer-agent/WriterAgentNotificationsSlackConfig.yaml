type: object
properties:
  id:
    description: Writer agent notifications Slack config ID. Unique identifier prefixed with `aansc_`.
    type: string
    pattern: ^aansc_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: aansc_01h2zvgfdqex5na189kdg39d6s
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [writerAgentNotificationsSlackConfig]
    example: writerAgentNotificationsSlackConfig
    readOnly: true
  uri:
    type: string
    format: uri
    readOnly: true
    description: Resource URI.
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/ai-writer-agent-notifications-slack-configs
  writerAgentId:
    description: Writer agent this configuration belongs to (one config per agent).
    type: string
    pattern: ^aua_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: aua_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  slackAppInstallationId:
    description: Slack app installation ID used for agent run notifications.
    type: [string, 'null']
    pattern: ^amnai_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: amnai_01hh1t9sa6gwfv5naz04gr7ehm
  slackChannelId:
    description: ID of the Slack channel that receives agent run notifications.
    type: [string, 'null']
    example: C012AB3CD
  notifyOn:
    description: Agent run events that trigger a Slack notification.
    type: array
    items:
      type: string
      enum: [PR_OPENED]
    uniqueItems: true
    example:
      - PR_OPENED
  createdAt:
    description: Created date.
    type: string
    format: date-time
    example: '2026-07-04T15:41:42.696Z'
    readOnly: true
  updatedAt:
    description: Last update date.
    type: string
    format: date-time
    example: '2026-07-04T15:41:42.696Z'
    readOnly: true
required:
  - id
  - object
  - uri
  - writerAgentId
  - notifyOn
  - createdAt
  - updatedAt
