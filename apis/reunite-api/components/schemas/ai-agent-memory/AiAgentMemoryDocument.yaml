type: object
description: Semantic memory document for the AI writer agent.
properties:
  object:
    type: string
    const: aiAgentMemoryDocument
    description: Entity name.
    readOnly: true
  id:
    description: Document ID. Unique identifier prefixed with `aamd_`.
    type: string
    format: ulid
    pattern: ^aamd_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: aamd_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  uri:
    description: URI reference to the AI agent memory documents collection.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/ai-agent-memory
  agent:
    type: string
    enum:
      - WRITER
    description: Agent that wrote the document. Document identity is scoped to the writing agent; reads are shared across agents.
  kind:
    $ref: ./AiAgentMemoryKind.yaml
  refId:
    type: string
    minLength: 1
    maxLength: 512
    description: Stable identifier of the source entity within the kind (for example, a pull request ID).
    example: pr_01hh1t9sa6gwfv5naz04gr7ehm
  title:
    type: string
    minLength: 1
    maxLength: 512
    description: Short document title.
  content:
    type: string
    minLength: 1
    maxLength: 30000
    description: Document content that gets embedded for semantic retrieval.
  score:
    type: number
    description: Relevance score. Present only in search results.
    readOnly: true
required:
  - object
  - id
  - uri
  - agent
  - kind
  - refId
  - title
  - content
