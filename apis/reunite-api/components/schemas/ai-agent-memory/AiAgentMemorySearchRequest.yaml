type: object
description: Semantic search request over the AI writer agent memory.
properties:
  query:
    type: string
    minLength: 1
    maxLength: 10000
    description: Search query matched against memory documents. When omitted, the most recently updated documents of the requested kinds are returned without semantic ranking.
    example: Document rate-limit headers on the API reference page
  kinds:
    type: array
    minItems: 1
    items:
      $ref: ./AiAgentMemoryKind.yaml
    description: Memory document kinds to search. Defaults to all kinds.
  limit:
    type: integer
    minimum: 1
    maximum: 40
    default: 10
    description: Maximum number of documents to return.
