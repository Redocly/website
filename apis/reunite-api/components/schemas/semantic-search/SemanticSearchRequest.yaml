type: object
properties:
  query:
    description: Search query for semantic search across documentation.
    type: string
    example: How do I authenticate with the API?
  product:
    description: Project pages product to filter search results.
    type: string
    example: Scout
  locale:
    description: Locale code to filter search results by documentation language.
    type: string
    example: ja
required:
  - query
