type: object
required:
  - object
  - id
  - status
properties:
  object:
    type: string
    enum:
      - aiUsageRun
    readOnly: true
  id:
    type:
      - string
      - 'null'
    pattern: ^aiur_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: aiur_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
    description: AI usage run ID.
  feature:
    type:
      - string
      - 'null'
    description: Feature key used to scope usage accounting.
  metadata:
    type: object
    additionalProperties: true
    description: Additional metadata for the usage run.
  status:
    type:
      - string
      - 'null'
    enum:
      - RUNNING
      - COMPLETED
      - FAILED
      - CANCELLED
      - null
    description: Current status of the usage run.
  entries:
    type: array
    items:
      $ref: ./AiUsageEntry.yaml
    description: Aggregated usage entries for this run.
