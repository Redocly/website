title: OAuthClientSupport
allOf:
  - $ref: ./OAuthClient.yaml
  - type: object
    properties:
      organizationId:
        description: Organization ID. Unique identifier prefixed with `org_`.
        type: string
        pattern: ^org_[0-9abcdefghjkmnpqrstvwxyz]{26}$
        example: org_01hh1t9sa6gwfv5naz04gr7ehm
        readOnly: true
      skipConsent:
        description: Whether this OAuth2 client skips the OAuth consent screen. Managed by support only.
        type: boolean
        default: false
        example: false
        readOnly: true
    required:
      - organizationId
      - skipConsent
