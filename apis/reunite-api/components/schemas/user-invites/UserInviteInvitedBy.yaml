type: object
description: Display information about the user who created and sent the invite.
properties:
  name:
    description: Display name of the user who sent the invite.
    type: string
    example: john.smith
  firstName:
    description: First name of the user who sent the invite.
    type: [string, 'null']
    example: John
  lastName:
    description: Last name of the user who sent the invite.
    type: [string, 'null']
    example: Smith
required:
  - name
  - firstName
  - lastName
