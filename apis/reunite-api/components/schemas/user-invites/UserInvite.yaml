type: object
properties:
  id:
    description: Invite ID. Unique identifier prefixed with `inv_`.
    type: string
    pattern: ^inv_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: inv_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  organizationId:
    description: Organization ID. Unique identifier prefixed with `org_`.
    type: string
    pattern: ^org_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: org_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  organizationName:
    description: Organization name.
    type: string
    example: Sample Organization
    readOnly: true
  organizationLogo:
    description: Organization logo.
    type: string
    example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA
    readOnly: true
  email:
    description: Email of invited user.
    type: string
    format: email
    example: john.smith@example.com
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [userInvite]
    readOnly: true
  uri:
    description: Canonical URI for the user invite resource.
    type: string
    format: uri
    readOnly: true
    example: urn:redocly:reunite:userInvite:inv_01h1s5z6vf2mm1mz3hevnn9va7
  expiredAt:
    description: Expiration date.
    type: string
    format: date-time
    readOnly: true
  invitedById:
    description: User ID who created and sent invite. Unique identifier prefixed with `usr_`.
    type: string
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: usr_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  invitedBy:
    $ref: ./UserInviteInvitedBy.yaml
    readOnly: true
  acceptedAt:
    description: Accepted date.
    type: [string, 'null']
    format: date-time
  createdAt:
    description: Created date.
    type: string
    format: date-time
    readOnly: true
required:
  - id
  - uri
  - invitedById
  - invitedBy
  - organizationId
  - organizationName
  - email
  - createdAt
  - object
  - expiredAt
  - acceptedAt
