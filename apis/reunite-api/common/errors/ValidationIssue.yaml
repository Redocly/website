type: object
title: ValidationIssue
description: Request schema validation issue when input does not match the documented schema.
required:
  - code
  - path
  - message
properties:
  code:
    type: string
    description: Machine-readable validation issue code.
  path:
    type: array
    description: Array of path segments to the invalid value.
    items:
      oneOf:
        - type: string
        - type: integer
  message:
    type: string
    description: Human-readable validation message.
additionalProperties: true
