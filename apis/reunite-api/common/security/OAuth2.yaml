type: oauth2
description: |-
  OAuth 2.0 authorization code flow. After authorization, call Reunite API with `Authorization: Bearer <access_token>`.

  Create an OAuth2 client in [Reunite](https://app.cloud.redocly.com/) under OAuth2 clients, then exchange authorization codes and refresh tokens at the token endpoint on your auth host.

  **Auth hosts:** US `https://auth.cloud.redocly.com`, EU `https://auth.cloud.eu.redocly.com` (same path suffix `/oidc/oauth2/...`).
flows:
  authorizationCode:
    authorizationUrl: https://auth.cloud.redocly.com/oidc/oauth2/auth
    tokenUrl: https://auth.cloud.redocly.com/oidc/oauth2/token
    scopes:
      org.auditLogs.read: Start audit log export jobs and download organization audit log events.
      project.feedback.read: List and read feedback and feedback reports for the project.
      project.feedback.update: Update feedback items (for example, status and internal comments).
      project.feedback.delete: Delete feedback items.
      project.remotes.read: List and read pushes for the project.
      project.remotes.update: Push files to the project.
