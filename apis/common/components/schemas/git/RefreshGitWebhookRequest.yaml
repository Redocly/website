type: object
description: Request payload for refreshing a Git webhook.
properties:
  repositoryId:
    description: Git repository ID.
    type: string
    example: '18796638'
  namespaceId:
    description: Git repository namespace ID.
    type:
      - string
      - 'null'
    example: group-id
required:
  - repositoryId
  - namespaceId
