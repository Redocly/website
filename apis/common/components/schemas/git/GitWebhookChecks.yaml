allOf:
  - $ref: ./GitWebhookBase.yaml
  - type: object
    properties:
      type:
        type: string
        const: COMMIT_CHECK
        example: COMMIT_CHECK
      object:
        description: Entity name.
        type: string
        const: gitWebhookChecks
        readOnly: true
      externalName:
        type:
          - string
          - "null"
        example: "github-actions[bot]"
      externalLogin:
        type:
          - string
          - "null"
        description: Provider login (username) of the sender (if available).
        example: github-actions[bot]
      externalEmail:
        type:
          - string
          - "null"
        example: "41898282+github-actions[bot]@users.noreply.github.com"
      externalActorId:
        type: string
        description: External id of the sender.
        example: "41898282"
      repositoryDetails:
        $ref: ../git/RepositoryDetails.yaml
      host:
        type: string
        description: Git provider host.
        example: github.com
      receivedAt:
        type: string
        format: date-time
        description: Timestamp when the webhook payload was received.
        example: "2025-11-12T10:00:00Z"
      commitSha:
        type: string
        description: Commit the check ran against.
        example: abc123def4567890abcdef1234567890abcdef12
      context:
        type: string
        description: Commit status context, or the check run name. The same value the checks list returns for the check.
        example: lint
      state:
        $ref: ./CommitCheckState.yaml
      updatedAt:
        type: string
        format: date-time
        description: Provider timestamp of the state change.
        example: "2025-11-12T10:05:00.000Z"
    required:
      - type
      - object
      - repositoryDetails
      - host
      - receivedAt
      - commitSha
      - context
      - state
      - updatedAt
