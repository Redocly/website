type: object
properties:
  id:
    description: Pull request ID. Unique identifier prefixed with `pr_`.
    type: string
    pattern: ^pr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: pr_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  object:
    description: Entity name.
    type: string
    const: pullRequest
    readOnly: true
  branchName:
    description: Branch name.
    type: string
    example: main
    maxLength: 512
  targetBranchName:
    description: Target branch name for merging. Defaults to project default branch when omitted.
    type: string
    example: main
    maxLength: 512
  headCommitHash:
    description: Commit the branch points at when the pull request opens.
    type: string
    example: '6ec6eb39d972b73a5827792e9e292060c826a267'
    maxLength: 512
  baseCommitHash:
    description: Commit the target branch points at when the pull request opens.
    type: string
    example: '6ec6eb39d972b73a5827792e9e292060c826a267'
    maxLength: 512
  title:
    description: PR title.
    type: string
    maxLength: 255
  description:
    description: PR description.
    type: string
  type:
    description: PR type.
    type: string
    default: MANUAL
    enum: [MANUAL, AUTOMATIC]
  status:
    description: PR status.
    type: string
    default: OPEN
    enum: [OPEN, CLOSED, MERGED]
  isDraft:
    description: Indicates whether or not pull request is a draft.
    type: boolean
    default: true
  reviewers:
    description: List of reviewer IDs.
    type: array
    items:
      description: User ID. Unique identifier prefixed with `usr_`.
      type: string
      pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
      example: usr_01h1s5z6vf2mm1mz3hevnn9va7
    default: []
  userId:
    $ref: ../ActorUserId.yaml
  diff:
    description: |
      Diff containing changes made in this commit. Diff should contain
      changes introduced by this commit and is used to accurately update comments'
      positions after each commit.
    type: string
  sourceNamespaceId:
    description: Fork source namespace ID for forked repository PRs.
    type: string
    example: john-doe
    maxLength: 512
  sourceRepositoryId:
    description: Fork source repository ID for forked repository PRs.
    type: string
    example: fork-test-repo
    maxLength: 512
  sourceBranchName:
    description: Fork source branch name for forked repository PRs.
    type: string
    example: feature-branch
    maxLength: 512
  hasChanges:
    description: Indicates whether the PR has any changes.
    type: boolean
    default: true
required:
  - id
  - object
  - branchName
  - title
  - status
