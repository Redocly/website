type: object
properties:
  id:
    description: Pull request ID. Unique identifier prefixed with `pr_`.
    type: string
    pattern: ^pr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: pr_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  object:
    description: Entity name.
    type: string
    const: pullRequest
    readOnly: true
  uri:
    description: Canonical URI for the pull request resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/pull-requests/pr_01h1s5z6vf2mm1mz3hevnn9va7
  number:
    description: Pull request number.
    type: integer
    example: 1
    readOnly: true
  branchName:
    description: Branch name.
    type: string
    example: main
    maxLength: 512
  branchId:
    description: Branch ID. Unique identifier prefixed with `br_`.
    type: string
    pattern: ^br_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: br_01h1s5s6vf1mm0mz3hevnn3va7
    readOnly: true
  targetBranchName:
    description: Branch name.
    type: string
    example: main
    maxLength: 512
  title:
    description: PR title.
    type: string
    maxLength: 512
  description:
    description: PR description.
    type: string
  type:
    description: PR type.
    type: string
    default: MANUAL
    enum: [MANUAL, AUTOMATIC]
  checksStatus:
    description: PR type.
    type: string
    default: MANUAL
    enum: [FAILED, PASSED, PARTIAL_PASSED, IN_PROGRESS, NOT_STARTED, SKIPPED]
  status:
    description: PR status.
    type: string
    default: OPEN
    enum: [OPEN, CLOSED, MERGED]
  isDraft:
    description: Indicates whether or not the pull request is a draft.
    type: boolean
    default: true
  mergeCommitHash:
    description: Merge commit hash.
    type: string
    example: '6ec6eb39d972b73a5827792e9e292060c826a267'
    maxLength: 512
  headCommitHash:
    description: Head branch commit hash.
    type: string
    example: '53689bc72b73a5827792e9e29206022120987a23'
    maxLength: 512
  baseCommitHash:
    description: Base commit between pull request source and target branch.
    type: string
    example: '4211a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9'
    maxLength: 512
  visualReview:
    description: Data required to display visual review including list of affected pages.
    type: object
    readOnly: true
    additionalProperties: true
    example:
      affectedPages:
        - slug: /integration.md
          name: Platform Integration
          mode: modified
      hasVisualChanges: true
      isThemeFileChanged: false
      isRedoclyYamlChanged: false
      branchCommitHash: '6ec6eb39d972b73a5827792e9e292060c826a267'
      baseCommitHash: '73689bc72b73a5827792e9e292060'
      updatedAt: '174894097643'
  reviewers:
    description: List of reviewers.
    type: array
    readOnly: true
    items:
      $ref: ../users/DisplayedUser.yaml
    default: []
  createdById:
    description: User ID who created PR. Unique identifier prefixed with `usr_`.
    type: string
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: usr_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  closedById:
    description: User ID who close PR. Unique identifier prefixed with `usr_`.
    type: string
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: usr_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  mergedById:
    description: User id who merged PR. Unique identifier prefixed with `usr_`.
    type: string
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: usr_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  reviews:
    description: list of reviews.
    type: array
    items:
      allOf:
      - $ref: ../pull-request-reviews/Review.yaml
      - type: object
        properties:
          reviewComments:
            description: >
              Abbreviated list of review comments ids belonging to this review, embedded
              inside the pull request response.
            type: array
            readOnly: true
            items:
              type: object
              properties:
                id:
                  description: Review comment ID. Unique identifier prefixed with `com_`.
                  type: string
                  pattern: ^com_[0-9abcdefghjkmnpqrstvwxyz]{26}$
                  example: com_01h1s5z6vf2mm1mz3hevnn9va7
                  readOnly: true
              required:
                - id
  createdAt:
    description: Created date.
    type: string
    readOnly: true
    format: date-time
  updatedAt:
    description: Updated date.
    type: string
    readOnly: true
    format: date-time
  latestMainCommitHash:
    description: Latest main commit hash before merge.
    type: string
  hasChanges:
    description: Indicates whether the PR has any changes.
    type: boolean
    default: false
required:
  - id
  - uri
  - number
  - branchName
  - targetBranchName
  - title
  - status
  - reviewers
  - reviews
  - createdAt
  - updatedAt
  - createdById
  - object
