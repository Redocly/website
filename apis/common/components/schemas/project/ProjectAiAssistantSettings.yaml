type: object
title: ProjectAiAssistantSettings
description: >-
  Embedded AI assistant settings for the project. Replaced as a whole on update, so
  `supportEmail` must be set whenever `contactSupportEnabled` is `true`.
required:
  - contactSupportEnabled
  - proactiveEscalationEnabled
  - showContactSupportAfterMessages
  - supportEmail
properties:
  contactSupportEnabled:
    description: Whether end users of the embedded AI assistant can contact the project's support team.
    type: boolean
    example: true
  proactiveEscalationEnabled:
    description: >-
      Whether the AI assistant can proactively offer to contact support, for example when it
      cannot answer a question. Off until a project turns it on.
    type: boolean
    example: false
  showContactSupportAfterMessages:
    description: Number of conversation messages after which the contact support option is shown.
    type: integer
    minimum: 1
    maximum: 50
    example: 3
  supportEmail:
    description: Email address support tickets are sent to. Required when contact support is enabled.
    type: [string, 'null']
    format: email
    maxLength: 254
    example: support@example.com
  identityVerification:
    description: >-
      Identity verification for the embedded AI assistant. `null` disables verification. Omit the
      field on update to keep the current configuration; when present it replaces the
      configuration as a whole.
    oneOf:
      - $ref: ./ProjectAiAssistantIdentityVerification.yaml
      - type: 'null'
