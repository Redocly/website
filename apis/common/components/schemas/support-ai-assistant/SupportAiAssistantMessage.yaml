type: object
properties:
  object:
    description: Entity name.
    type: string
    enum: [supportAiAssistantMessage]
    readOnly: true
  messageId:
    description: Unique identifier of the AI assistant message.
    type: string
    example: 'msg_01KAE541A8TCFVT7SKJ4E6Y6SK'
  conversationId:
    description: Identifier of the conversation (search session) the message belongs to.
    type: string
    example: 'aiconv_01KAE541A8TCFVT7SKJ4E6Y6SK'
  time:
    description: Time of the message.
    type: string
    example: '2026-06-01T12:00:00Z'
  organizationId:
    description: Identifier of the organization that the question belongs to.
    type: string
    example: 'org_01j0wt03vft6qrqdcqgsc62ez8'
  organizationSlug:
    description: Slug of the organization that the question belongs to.
    type: string
    example: 'acme'
  projectId:
    description: Identifier of the project that the question belongs to.
    type: string
    example: 'prj_123'
  projectSlug:
    description: Slug of the project that the question belongs to.
    type: string
    example: 'docs'
  question:
    description: Question asked by the user.
    type: string
    example: 'How do I configure the sidebar?'
  answer:
    description: Answer provided by the AI assistant.
    type: string
    example: 'You can configure the sidebar by...'
  resources:
    description: List of documentation resources used in the answer.
    type: array
    items:
      type: object
      properties:
        id:
          type: string
          example: 'resource-1'
        url:
          type: string
          example: 'https://example.com/resource-1'
        title:
          type: string
          example: 'Resource Title'
  product:
    description: Product filter used for the AI search, when set.
    type: string
    example: 'Demand API'
  feedback:
    description: User feedback on the answer.
    type: string
    enum: [like, dislike]
    example: 'like'
  dislikeReason:
    description: Reason the user disliked the answer.
    type: string
    example: 'The answer was not accurate'
required:
  - object
  - messageId
  - conversationId
  - time
  - question
