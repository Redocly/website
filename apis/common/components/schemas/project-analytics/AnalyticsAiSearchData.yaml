type: object
properties:
  object:
    description: Entity name.
    type: string
    enum: [projectAnalyticsAiSearchData]
    readOnly: true
  id:
    description: |-
      Stable identifier of the row. The conversation session ID when the row
      represents a session; an opaque derived identifier otherwise.
    type: string
    example: '3c6db4fd-8492-4af5-b4de-b4ff0ecf89ea'
  time:
    description: Time of the search.
    type: string
    format: date-time
    example: '2026-06-18T09:23:58.971Z'
  answer:
    description: |-
      Answer provided by the AI. For conversation rows, the answer of the session's
      earliest message. Absent when that message has no answer, for example when
      the search failed.
    type: string
    example: 'You can use Ai search by...'
  question:
    description: Question asked by the user.
    type: string
    example: 'How to use Ai search?'
  resources:
    description: List of resources related to the answer.
    type: array
    items:
      type: object
      properties:
        id:
          type: string
          example: 'resource-1'
        url:
          type: string
          example: 'https://example.com/resource-1'
        title:
          type: string
          example: 'Resource Title'
  userEmail:
    description: Email of the user who made the search.
    type: string
    example: 'user@example.com'
  feedback:
    description: Feedback on the AI search result.
    type: string
    enum: [like, dislike]
    example: 'like'
  dislikeReason:
    description: Reason for disliking the AI search result.
    type: string
    example: 'The answer was not accurate'
  messageId:
    description: ID of the AI search message.
    type: string
    example: 'msg_01abc123'
  conversationId:
    description: |-
      ID of the conversation session this row belongs to, a client-generated UUID.
    type: string
    example: '3c6db4fd-8492-4af5-b4de-b4ff0ecf89ea'
  messagesCount:
    description: Number of messages in the conversation session.
    type: integer
    example: 4
  likesCount:
    description: Number of liked answers in the conversation session.
    type: integer
    example: 2
  dislikesCount:
    description: Number of disliked answers in the conversation session.
    type: integer
    example: 1
  isAnswerFound:
    description: |-
      Whether the AI found an answer in the documentation. For conversation rows,
      `false` means no message in the session found an answer. Absent when the
      source events predate this field.
    type: boolean
    example: true
  sourceOrigin:
    description: |-
      Origin of the page that embeds the AI assistant, taken from the session's
      earliest message. Absent for conversations that come from outside an
      embedded assistant.
    type: string
    example: 'https://docs.example.com'
  escalated:
    description: Whether the conversation ended in a created support ticket.
    type: boolean
    example: false
required:
  - object
  - id
  - time
  - question
  - userEmail