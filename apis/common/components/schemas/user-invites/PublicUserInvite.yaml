type: object
description: Public view of a user invite. Excludes the invited email address so it can be retrieved without authentication.
properties:
  id:
    description: Invite ID. Unique identifier prefixed with `inv_`.
    type: string
    pattern: ^inv_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: inv_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  code:
    description: Invite code.
    type: string
    format: uuid
    example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    readOnly: true
  expiredAt:
    description: Expiration date.
    type: string
    format: date-time
    readOnly: true
  organization:
    description: Organization the user is invited to.
    type: object
    properties:
      logo:
        description: Organization logo.
        type: [string, 'null']
        example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA
      name:
        description: Organization name.
        type: string
        example: Sample Organization
    required:
      - logo
      - name
    readOnly: true
  invitedBy:
    $ref: ./UserInviteInvitedBy.yaml
    readOnly: true
  createdAt:
    description: Created date.
    type: string
    format: date-time
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [publicUserInvite]
    readOnly: true
  uri:
    description: Canonical URI for the public user invite resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/public-user-invites/7c9e6679-7425-40de-944b-e07fc1f90ae7
required:
  - id
  - code
  - createdAt
  - expiredAt
  - organization
  - invitedBy
  - object
  - uri
