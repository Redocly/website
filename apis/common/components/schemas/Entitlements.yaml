type: object
readOnly: true
description: Plan gate entitlements.
properties:
  subscriptionId:
    description: Subscription ID.
    type: string
  protectedNetwork:
    description: Can protect based on IP addresses.
    type: boolean
  rbac:
    type: boolean
  ipRestrictions:
    description: Allows restricted access to browse the project by list of specified IP addresses. Separately, restrict API access to specified IP addresses.
    type: boolean
  identityProvider:
    description: OIDC or SAML identity providers.
    type: boolean
  captureDomain:
    description: |
      Require all logins with a company domain to use SSO.
      When domain capture is on, any accounts with a company domain are added to the organization using a specified default role.
      New members (people with company emails) should join the existing organization and can not create separate company accounts.
    type: boolean
  sso:
    description: Configurable single sign-on.
    type: boolean
  scim:
    description: Manage user access with an API.
    type: boolean
  auditTrail:
    description: Detailed audit logs to help you monitor, investigate incidents, and meet compliance requirements.
    type: boolean
  analytics:
    description: Configure analytics behavior in projects.
    type: boolean
  projectGuests:
    description: Allow guests to be added to projects.
    type: boolean
  themeEjecting:
    description: Allow to perform ejecting of theme components in project.
    type: boolean
  removeAttribution:
    description: Remove attribution.
    type: boolean
  projectCountLimit:
    description: Number of projects allowed.
    type: integer
    format: int32
  seatsLimit:
    description: Number of seats allowed.
    type: integer
    format: int32
  advancedSearch:
    description: Enable advanced search.
    type: boolean
  ssoDirect:
    description: Enable ssoDirect.
    type: boolean
  remoteContent:
    description: Enable remote content.
    type: boolean
  hideRedoclyBranding:
    description: Hide branding.
    type: boolean
  teamManager:
    description: Enable team manager.
    type: boolean
  mcp:
    description: Enable mcp servers.
    type: boolean
  mcpGateway:
    description: Enable the guarded gateway fetch inside the MCP code-mode sandbox.
    type: boolean
  mcpMode:
    description: Docs MCP server tool surface.
    type: string
    enum:
      - tools
      - code
  gatewayFetchRatePerMin:
    description: Maximum gateway MCP outbound fetches allowed per minute.
    type: integer
    format: int32
  gatewayFetchQuotaPerDay:
    description: Maximum gateway MCP outbound fetches allowed per day.
    type: integer
    format: int32
  gatewayFetchBudgetPerExec:
    description: Maximum gateway MCP outbound fetches allowed per code-mode execution.
    type: integer
    format: int32
  aiSearchLimit:
    description: Number of AI search requests allowed.
    type: integer
    format: int32
  kvStorageLimit:
    description: Number of KV storage allowed (in GB).
    type: number
    format: float
  projectAnalytics:
    description: Enable project analytics.
    type: boolean
  inviteLimit:
    description: Number of invites allowed at the same time.
    type: integer
    format: int32
  projectLogsExport:
    description: Enable project logs export.
    type: boolean
  projectLogsSinceLimit:
    description: Project logs time range limit for filtering.
    type: string
    enum:
      - '30-minutes'
      - '1-month'
required:
  - protectedNetwork
  - rbac
  - ipRestrictions
  - identityProvider
  - captureDomain
  - sso
  - scim
  - auditTrail
  - analytics
  - projectGuests
  - subscriptionId
  - projectCountLimit
  - seatsLimit
  - advancedSearch
  - aiSearchLimit
  - kvStorageLimit
  - teamManager
  - projectAnalytics
  - projectLogsExport
  - projectLogsSinceLimit
