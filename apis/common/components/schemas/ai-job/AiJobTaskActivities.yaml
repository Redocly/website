type: array
description: Activity messages produced during execution.
items:
  type: object
  required:
    - message
    - timestamp
    - type
  properties:
    message:
      type: string
      example: Generated navigation for 4 sections.
    timestamp:
      type: string
      format: date-time
      example: '2026-04-17T10:17:12.000Z'
    type:
      type: string
      enum:
        - status
        - file_created
        - file_updated
        - phase_summary
        - phase_plan
      example: file_created
    filePath:
      type: string
      example: openapi/payments.yaml
      description: File path for file_created activities (clickable in UI).
