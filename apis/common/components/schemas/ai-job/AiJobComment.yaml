type: object
description: One pull request comment that one AI job processes. Exactly one of `review` or `reviewComment` has a value.
properties:
  id:
    description: AI job comment ID. Unique identifier prefixed with `ajc_`.
    type: string
    pattern: ^ajc_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: ajc_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [aiJobComment]
    readOnly: true
  aiJobId:
    description: AI job ID. Unique identifier prefixed with `aij_`.
    type: string
    pattern: ^aij_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: aij_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
  review:
    description: The review whose text the job processes. This field has a value for a top-level PR comment or a review summary.
    readOnly: true
    $ref: ../pull-request-reviews/Review.yaml
  reviewComment:
    description: The review comment that the job processes. This field has a value for a file comment, a line comment, or a reply.
    readOnly: true
    $ref: ../pull-request-review-comments/ReviewComment.yaml
  status:
    readOnly: true
    $ref: ./AiJobCommentStatus.yaml
  reason:
    description: Why the job made no change for the comment. The worker writes it with the status SKIPPED.
    type:
      - string
      - 'null'
    maxLength: 1000
    readOnly: true
    example: The comment asks a question and does not request a change.
  createdAt:
    description: Created date.
    type: string
    readOnly: true
    format: date-time
required:
  - id
  - object
  - aiJobId
  - status
  - createdAt
