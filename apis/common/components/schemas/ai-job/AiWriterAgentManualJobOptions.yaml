type: object
description: Manual trigger options for the AI writer agent job.
required:
  - trigger
  - metadata
properties:
  trigger:
    type: string
    enum:
      - MANUAL
  note:
    type:
      - string
      - 'null'
    description: Optional free-form note attached when the run is initiated manually.
  metadata:
    $ref: ./AiWriterAgentJobMetadata.yaml
