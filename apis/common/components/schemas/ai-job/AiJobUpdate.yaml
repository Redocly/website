type: object
description: Writable fields accepted when partially updating an AI job.
required:
  - status
properties:
  status:
    type: string
    enum:
      - QUEUED
      - RUNNING
      - COMPLETED
      - FAILED
      - CANCELLING
      - CANCELLED
    example: COMPLETED
    description: Current status of the AI job.
  error:
    type:
      - string
      - 'null'
    example: Timeout while waiting for plan files
    description: >-
      Error message when the job has failed. The worker sanitizes it before
      reporting: URL query strings and fragments are stripped, internal hosts and
      paths are reduced, and secret-shaped values are redacted.
  pullRequestId:
    deprecated: true
    description: Pull request ID. Unique identifier prefixed with `pr_`.
    type: string
    pattern: ^pr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: pr_01h1s5z6vf2mm1mz3hevnn9va7
  pullRequestIds:
    description: Pull requests created for this job, one per group of related runner specs. Bounded by the per-run queue capacity (MAX_QUEUED_SPECS_PER_RUN).
    type: array
    maxItems: 3
    items:
      type: string
      description: Pull request ID. Unique identifier prefixed with `pr_`.
      pattern: ^pr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
      example: pr_01h1s5z6vf2mm1mz3hevnn9va7
  metadata:
    type: object
    description: >-
      Metadata to merge into the job's existing metadata. Internal-only: session-authenticated
      requests may not set this field. Other metadata fields (e.g. `dismissedAt`, which is set
      via the dedicated dismiss action) are not accepted here.
    additionalProperties: false
    properties:
      commitHash:
        type: string
        pattern: ^[0-9a-f]{40}$
        description: Full SHA of the commit produced by a scaffold job, once it completes.
        example: 3f2504e04f8964efd4a1e6c8f6f4f5cf5f6f5f6a
      errorCode:
        $ref: ./AiJobErrorCode.yaml
        description: Machine-readable failure class, recorded when the job fails.
      failedPhase:
        $ref: ./AiJobTaskType.yaml
        description: >-
          Phase the failure originated from — present only when the worker can attribute
          the failure to a specific phase.
      errorDetail:
        type: string
        maxLength: 200
        example: image/svg+xml
        description: >-
          Best-effort identifier of the input responsible for the failure — a file name,
          URL, or media type — present only when the worker can attribute the failure to
          a specific input. Sanitized before storage: URL query strings and fragments are
          removed, and internal hosts or absolute worker paths are reduced to the
          project-relative path or the bare file name.
      degradedPhases:
        type: array
        maxItems: 20
        items:
          $ref: ./AiJobTaskType.yaml
        description: >-
          Optional phases whose failure degrades the result instead of failing the run.
          Present on both completed (degraded) and failed jobs.
  remotePullRequests:
    description: Pull requests opened on the provider repositories that GIT remotes sync from, one per group of remote-content runner specs. These have no Reunite pull request id.
    type: array
    maxItems: 3
    items:
      type: object
      required:
        - remoteId
        - number
        - title
      properties:
        remoteId:
          type: string
          description: Remote ID. Unique identifier prefixed with `rem_`.
          pattern: ^rem_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          example: rem_01ky2w7ff2d43mfdz9kkgac17t
        number:
          type: integer
          minimum: 1
          description: Pull request number in the provider repository.
          example: 42
        title:
          type: string
          minLength: 1
          maxLength: 512
          description: Title of the provider pull request.
        url:
          type: string
          format: uri
          description: Web URL of the provider pull request.
