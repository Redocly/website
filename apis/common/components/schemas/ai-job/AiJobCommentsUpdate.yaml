type: object
description: New status of each pull request comment of an AI job. The worker sends it after the run.
properties:
  comments:
    type: array
    minItems: 1
    maxItems: 1000
    items:
      type: object
      properties:
        id:
          description: AI job comment ID. Unique identifier prefixed with `ajc_`.
          type: string
          pattern: ^ajc_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          example: ajc_01h1s5z6vf2mm1mz3hevnn9va7
        status:
          $ref: ./AiJobCommentStatus.yaml
        reason:
          description: Why the job made no change for the comment. Send it with the status SKIPPED.
          type: string
          maxLength: 1000
          example: The comment asks a question and does not request a change.
      required:
        - id
        - status
required:
  - comments
