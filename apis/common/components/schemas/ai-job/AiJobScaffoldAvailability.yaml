type: object
required:
  - object
  - id
  - createdAt
  - isPossible
  - reason
  - message
properties:
  object:
    type: string
    enum:
      - aiJobsAvailability
    readOnly: true
  id:
    type: string
    pattern: ^org_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: org_01h1s5z6vf2mm1mz3hevnn9va7
    readOnly: true
    description: Organization ID for which availability is calculated.
  createdAt:
    type: string
    format: date-time
    readOnly: true
    description: Date when availability snapshot is generated.
  isPossible:
    type: boolean
    readOnly: true
    description: Indicates whether AI scaffold can be used for creating a new project.
  reason:
    oneOf:
      - type: string
        enum:
          - PROJECT_LIMIT
          - USAGE_LIMIT
          - AI_DISABLED
          - UNKNOWN
      - type: 'null'
    readOnly: true
    description: High-level reason when AI scaffold is unavailable.
  message:
    type: string
    readOnly: true
    description: User-facing message with limited details.
  activeGenerationProjectSlug:
    oneOf:
      - type: 'null'
      - type: string
        pattern: ^[a-z0-9][a-z0-9_-]*[a-z0-9]$
        example: my-project
    readOnly: true
    description: >
      When scaffold creation is blocked because another project in the organization already has
      an active scaffold job, the slug of that project (for example, to open its editor). Null when
      not applicable or unknown.
