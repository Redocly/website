type: object
properties:
  id:
    description: Project ID. Unique identifier prefixed with `prj_`.
    type: string
    pattern: ^prj_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: prj_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  name:
    description: Project name.
    type: string
    example: Test Project
  slug:
    description: Project slug.
    type: string
    example: project_red-owl-352
  createdAt:
    description: Created date.
    type: string
    format: date-time
    readOnly: true
  createdById:
    description: User ID who created the project. Unique identifier prefixed with `usr_`.
    type: [string, 'null']
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: usr_01h3yam4gvc3p9d2nzcwaya8y5
    readOnly: true
  updatedAt:
    description: Updated date.
    type: string
    format: date-time
    readOnly: true
  sourceId:
    description: Project source ID (Remote ID).
    type: string
    example: rem_01h3yam4gvc3p9d2nzcwaya8y5
    readOnly: true
  productType:
    description: Product type.
    type: string
    enum:
      - REDOC
      - REEF
      - REVEL
      - REDOC_REVEL
      - REDOC_REEF
      - REVEL_REEF
      - REALM
    example: REDOC
    readOnly: true
  publishingStrategy:
    readOnly: true
    type: string
    enum:
      - MANUAL
      - SKIP_IF_NEWER_BUILD_STARTED
      - SKIP_IF_NEWER_BUILD_FINISHED
    description: Project builds publishing strategy.
  isDraft:
    description: Whether the project is in draft state.
    type: boolean
    example: false
    readOnly: true
  config:
    description: Universal config.
    type:
      - object
      - 'null'
    readOnly: true
  projectTemplateId:
    description: Project template ID. Unique identifier prefixed with `prt_`.
    type: [string, 'null']
    pattern: ^prt_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: prt_01h1s5z6vf2mm1mz3hevnn9va7
  object:
    description: Entity name.
    type: string
    enum: [project]
    readOnly: true
  source:
    # Nullable: internal projects (no connected remote) return `null`.
    anyOf:
      - $ref: ../remote/ProjectBuildRemote.yaml
      - type: 'null'
    readOnly: true
  remotes:
    description: Project remotes.
    type: array
    items:
      $ref: ../remote/ProjectBuildRemote.yaml
    readOnly: true
  projectCustomDomain:
    $ref: ../project-custom-domain/ProjectBuildProjectCustomDomain.yaml
    readOnly: true
  useLegacyEmbedding:
    description: Whether the project uses legacy embeddings.
    type: boolean
    readOnly: true
required:
  - id
  - name
  - slug
  - createdAt
  - createdById
  - updatedAt
  - sourceId
  - productType
  - config
  - object
  - useLegacyEmbedding
  - isDraft