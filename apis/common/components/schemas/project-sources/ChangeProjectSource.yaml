type: object
title: ChangeProjectSource
description: Fields a project source change accepts.
required:
  - transferMode
  - credentialId
  - providerType
  - namespaceId
  - repositoryId
  - branchName
properties:
  transferMode:
    type: string
    description: How the existing project content moves to the new source.
    enum:
      - CLONE
      - PUSH
  credentialId:
    type: string
    example: cred_01hc2rvwxf7jyj1er504khx8e7
    description: Credential ID.
  providerType:
    $ref: ../git/GitProviderType.yaml
  namespaceId:
    description: Git repo namespace id. Null for GitLab with a Project Access Token.
    type:
      - string
      - 'null'
  repositoryId:
    description: Git repo id.
    type: string
  branchName:
    description: Branch name in the remote repository.
    type: string
    example: main
  contentPath:
    description: Path to the connected folder in the remote repository.
    type: string
    default: /
