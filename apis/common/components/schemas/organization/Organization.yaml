type: object
title: Organization
properties:
  id:
    description: Organization ID. Unique identifier prefixed with `org_`.
    type: string
    pattern: ^org_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: org_01hh1t9sa6gwfv5naz04gr7ehm
    readOnly: true
  name:
    description: Organization name. 
    type: string
    pattern: ^[^:/.]+$
    maxLength: 100
    example: Test Org
  slug:
    description: |-
      Organization slug.
      Must be an empty string when creating an organization — the slug is generated
      from the organization name.
    type: string
    maxLength: 50
    example: org_acme-inc
  uri:
    description: Canonical URI for the organization resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm
  logo:
    description: Organization logo (data URI). Maximum size is 1MB.
    type: [string, 'null']
    maxLength: 1048576
    example: data:image/png;base64,...
  createdAt:
    description: Created date.
    type: string
    format: date-time
    readOnly: true
  updatedAt:
    description: Updated date.
    type: string
    format: date-time
    readOnly: true
  defaultProjectRole:
    description: Default role for organization projects.
    $ref: ../rbac/ProjectRoleName.yaml
  entitlements:
    description: Entitlements for organization.
    $ref: ../Entitlements.yaml
    readOnly: true
  subscriptionStatus:
    description: Subscription status of the organization. The value is `trial` while the subscription is in trial, the status of the subscription such as `active` or `churned` in other cases, and `none` when the organization has no subscription.
    type: string
    example: trial
    readOnly: true
  isDisabled:
    description: Is organization disabled.
    type: boolean
    example: true
    readOnly: true
  requireSSO:
    description: Require SSO authentication for all members of the organization.
    type: boolean
    example: false
  object:
    description: Entity name.
    type: string
    enum: [organization]
    readOnly: true
  metadata:
    description: Organization metadata.
    oneOf:
      - type: 'null'
      - type: object
        properties:
          role:
            description: Role of the user in the organization.
            type: string
            example: Frontend developer
          intent:
            description: User's intent for the organization.
            type: string
            maxLength: 128
          intentAdditionalInfo:
            description: Additional information about the intent.
            type: string
            maxLength: 1000
  brandEnabled:
    description: Indicates whether organization branding is enabled.
    type: boolean
    example: true
    readOnly: true
  hideRedoclyBranding:
    description: Indicates whether logo should be hidden.
    type: boolean
    example: true
    readOnly: true
  customTerms:
    description: Organization legal consent.
    type: [string, 'null']
    example: Agree to the Terms of Service and Privacy Policy.
    readOnly: true
  respectMonitoringWorkflowsLimit:
    description: |-
      Maximum number of Respect Monitoring workflows allowed for the organization.
      The limit applies to trial subscriptions only — paid subscriptions are not limited.
      `null` means there is no organization-specific override and the platform default
      limit applies (`null` does not mean unlimited).
    type: [integer, 'null']
    format: int32
    minimum: 1
    example: 20
    readOnly: true

required:
  - id
  - name
  - slug
  - uri
  - createdAt
  - updatedAt
  - entitlements
  - subscriptionStatus
  - isDisabled
  - object
  - brandEnabled
  - hideRedoclyBranding
  - customTerms
  - respectMonitoringWorkflowsLimit