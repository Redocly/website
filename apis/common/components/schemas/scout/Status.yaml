type: object
properties:
  hostname:
    type: string
    description: Hostname of Scout instance.
  pid:
    type: integer
    description: Process ID.
  version:
    type: string
    description: Scout version.
  disk:
    type: object
    description: Disk usage.
    properties:
      size:
        type: integer
        description: Total disk size.
      used:
        type: integer
        description: Used disk size.
      available:
        type: integer
        description: Available disk size.
      unit:
        type: string
        description: Disk size unit.
        enum:
          - B
          - KB
          - MB
          - GB
          - TB
        example: MB
    required:
      - size
      - used
      - available
      - unit
  jobs:
    type: object
    description: Scout jobs.
    properties:
      active:
        type: integer
        description: Number of active jobs.
      max:
        type: integer
        description: Maximum number of jobs.
    required:
      - active
      - max
required:
  - hostname
  - pid
  - version
  - disk
  - jobs
