type: object
properties:
  id:
    description: Job ID. Unique identifier prefixed with `sjob_`.
    type: string
    pattern: ^sjob_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: sjob_01h2t9ksv7vmsvbhh5ty40zctw
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [scoutJob]
    readOnly: true
  uri:
    description: URI reference to this Scout job.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/scout/tasks/sjob_01h2t9ksv7vmsvbhh5ty40zctw
  status:
    readOnly: true
    type: string
    enum:
      - PENDING
      - PROCESSING
      - COMPLETED
      - FAILED
    description: Job status.
  type:
    type: string
    enum:
      - PROCESS_GIT_REPO
      - UPDATE_STATUS
    description: Type of job.
  providerId:
    description: Git provider identifier (appId for GitHub).
    type: string
  providerType:
    type: string
    enum:
      - GITHUB_CLOUD
      - GITHUB_SERVER
      - GITLAB_CLOUD
      - GITLAB_SELF_MANAGED
      - BITBUCKET_CLOUD
      - BITBUCKET_DATACENTER
      - AZURE
    description: Git provider type.
  namespaceId:
    type: string
    description: Git repo namespace id (organization login for GitHub).
  repositoryId:
    type: string
    description: Git repo id.
  originUrl:
    type: string
    description: Git repository origin URL.
  branch:
    type: string
    description: Git branch name.
  commitSha:
    type: string
    description: Git commit SHA.
  isMainBranch:
    type: boolean
    default: false
    description: True if branch is main.
  prId:
    type: string
    description: Git pull request ID.
  attempts:
    type: integer
    description: Number of attempts to process the job.
    readOnly: true
  parentJobId:
    description: Parent job ID, if any. Unique identifier prefixed with `sjob_`.
    type: string
    pattern: ^sjob_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: sjob_01h2t9ksv7vmsvbhh5ty40zctw
  checks:
    type: array
    description: Commit status checks.
    items:
      $ref: ./GitCommitCheck.yaml
  metadata:
    $ref: ./JobMetadata.yaml
  startedAt:
    type: string
    format: date-time
    description: Job start date.
    readOnly: true
  createdAt:
    type: string
    format: date-time
    description: Job creation date.
    readOnly: true
  updatedAt:
    type: string
    format: date-time
    description: Job last update date.
    readOnly: true
required:
  - id
  - uri
  - status
  - type
  - providerType
  - namespaceId
  - repositoryId
  - branch
  - commitSha
  - attempts
  - createdAt
  - updatedAt
  - object
