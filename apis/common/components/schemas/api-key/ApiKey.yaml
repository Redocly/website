type: object
description: API key resource.
properties:
  id:
    description: API key ID. Unique identifier prefixed with `key_`.
    type: string
    pattern: ^key_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: key_01h2zvgfdqex5na189kdg39d6s
    readOnly: true
  object:
    description: Entity name.
    type: string
    enum: [apiKey]
    readOnly: true
  uri:
    description: Canonical URI for the API key resource.
    type: string
    format: uri
    readOnly: true
    example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/api-keys/key_01h2zvgfdqex5na189kdg39d6s
  name:
    description: API key name.
    type: string
    example: Scout integration
  ipAddresses:
    description: Allowed IP addresses.
    type: array
    items:
      type: string
      example: 192.168.1.1
  apiKey:
    description: API key value, provided only when API key is created.
    type: string
    example: sk_FkmCB7H80ZBHX1oHmCjK8at4isAJInOqE5bS_8NHMzOqbMu2psubGAOz-BvSYscTU_s
    readOnly: true
  userId:
    description: User ID associated with this Api Key. Unique identifier prefixed with `usr_`.
    type:
      - string
      - 'null'
    pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    example: usr_01h2r5f6qy8kr42p8yfw52spq6
    readOnly: true
  lastUsedAt:
    description: Last used date.
    type:
      - string
      - 'null'
    format: date-time
    example: 2023-06-15T15:41:42.696Z
    readOnly: true
  expiredAt:
    description: |
      Optional UTC calendar date after which the key no longer authenticates requests.
      Omitted or null means the key does not expire. Date only (no time-of-day).
    type:
      - string
      - 'null'
    format: date
    example: '2026-12-31'
  createdAt:
    description: Created date.
    type: string
    format: date-time
    example: 2023-06-15T15:41:42.696Z
    readOnly: true
  updatedAt:
    description: Updated date.
    type: string
    format: date-time
    example: 2023-06-15T15:41:42.696Z
    readOnly: true
  permissionsSource:
    description: |
      How this API key resolves permissions. On create and update, use `RBAC` or `SCOPED` only.
      `RBAC` uses team membership for the key user (set `teamIds` at creation).
      `SCOPED` uses explicit `organizationPermissions` and `projectsPermissions` lists.
      `FULL` is deprecated and may appear on older keys in responses only; it cannot be set via the API.
    type: string
    enum: [RBAC, SCOPED, FULL]
    example: RBAC
  organizationPermissions:
    description: Organization-level permissions when `permissionsSource` is `SCOPED` (empty otherwise).
    type: array
    items:
      type: string
    default: []
  projectsPermissions:
    description: Project-level permissions when `permissionsSource` is `SCOPED` (empty otherwise).
    type: array
    items:
      type: string
    default: []
  teamIds:
    description: |
      Team IDs when `permissionsSource` is `RBAC` (empty otherwise).
    type: array
    items:
      type: string
      pattern: ^team_[0-9abcdefghjkmnpqrstvwxyz]{26}$
    default: []
required:
  - id
  - object
  - uri
  - name
  - userId
  - lastUsedAt
  - createdAt
  - updatedAt
  - permissionsSource