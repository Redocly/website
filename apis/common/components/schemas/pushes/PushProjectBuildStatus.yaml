type: object
required: 
  - deploy
  - scorecard
properties:
  deploy:
    type: object
    properties:
      url:
        type: 
          - string
          - 'null'
        description: Deployment URL.
      status:
        type: string
        description: Status of project deployment.
        enum:
          - pending
          - running
          - success
          - failed
          - skipped
        example: running
    required: 
      - status
      - url
  scorecard:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          description: Scorecard name.
          example: "Scorecard: Compliance API"
        status:
          type: string
          enum:
            - pending
            - running
            - success
            - failed
        description:
          type: string
          description: Scorecard status description.
        url:
          type: string
          description: Scorecard URL.
      required:
        - name
        - status
        - description
        - url
