type: object
properties:
  month:
    description: Subscription data month in YYYY-MM format.
    type: string
    pattern: ^\d{4}-\d{2}$
    example: "2024-11"
  selfService:
    type: object
    properties:
      customers:
        description: Number of self-service customers.
        type: integer
        example: 40
      totalARR:
        description: Total Annual Recurring Revenue for self-service customers.
        type: integer
        example: 28065
      averageARR:
        description: Average Annual Recurring Revenue per self-service customer.
        type: integer
        example: 702
      minARR:
        description: Minimum Annual Recurring Revenue among self-service customers.
        type: integer
        example: 120
      maxARR:
        description: Maximum Annual Recurring Revenue among self-service customers.
        type: integer
        example: 2880
  enterprisePlus:
    type: object
    properties:
      customers:
        description: Number of enterprise plus customers.
        type: integer
        example: 0
      totalARR:
        description: Total Annual Recurring Revenue for enterprise plus customers.
        type: integer
        example: 0
required:
  - month
  - selfService
  - enterprisePlus
