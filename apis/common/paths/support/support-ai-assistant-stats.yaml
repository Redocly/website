get:
  tags:
    - Support
  security:
    - Support: []
  summary: List all AI assistant usage statistics
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  operationId: listSupportAiAssistantStats
  description: |-
    Returns aggregated AI assistant statistics from telemetry: totals, a per-day series,
    and a per-organization breakdown.
    Aggregates honor the time range (`createdAt`), `search`, and organization/project scope
    filters shared with the messages list. The row-level `feedback` and `escalated` filters
    do not apply here: the totals already report the like/dislike/no-feedback split and the
    escalation count for the selected period.
  parameters:
    - $ref: ../../common/components/parameters/query/Filter.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/support-ai-assistant/SupportAiAssistantStats.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
