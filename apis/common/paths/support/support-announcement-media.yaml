post:
  tags:
    - Support
  x-internal: true
  security:
    - UserCookie: []
  operationId: uploadAnnouncementMedia
  summary: Upload media file for announcement
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            file:
              type: string
              format: binary
              description: "Media file (image or GIF) to upload. Supported formats: JPEG, PNG, GIF, WebP. Maximum size: 10MB."
          required:
            - file
  responses:
    '200':
      description: Media uploaded successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              mediaUrl:
                type: string
                format: uri
                description: URL to the uploaded media file.
                example: "https://s3.us-east-1.amazonaws.com/stage-bh-announcements-cdn/announcements/01h1s5z6vf2mm1mz3hevnn9va7.gif"
              mediaStorageKey:
                type: string
                description: Storage key of the uploaded media object.
                example: "announcements/01h1s5z6vf2mm1mz3hevnn9va7.gif"
            required:
              - mediaUrl
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml

get:
  tags:
    - Support
  security:
    - UserCookie: []
  summary: Get support announcement media preview
  description: Streams support announcement media by storage key for authenticated support users.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: to-the-moon
  operationId: getSupportAnnouncementMediaPreview
  parameters:
    - in: query
      name: key
      required: true
      example: announcements/01h1s5z6vf2mm1mz3hevnn9va7.gif
      schema:
        type: string
      description: Storage key of the announcement media file.
  responses:
    '200':
      description: Media stream.
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
