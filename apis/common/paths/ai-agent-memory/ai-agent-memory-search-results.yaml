post:
  tags:
    - AI agent memory
  security:
    - InternalAuth: []
  summary: Get AI agent memory search results
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  description: |
    Hybrid semantic search (vector similarity + fulltext) over the AI
    writer agent memory documents of a project.
  operationId: searchAiAgentMemoryDocuments
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ai-agent-memory/AiAgentMemorySearchRequest.yaml
  responses:
    '200':
      description: Most relevant memory documents first.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ai-agent-memory/AiAgentMemorySearchResult.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
