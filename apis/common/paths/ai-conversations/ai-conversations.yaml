post:
  tags:
    - AI conversations
  summary: Start conversation with AI assistant
  description: |-
    Initiate AI-powered conversations within a specific project.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: lightsabers
  operationId: startConversation
  security: []
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ai-conversation/Message.yaml
  responses:
    '201':
      description: AI conversation started.
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
