get:
  tags:
    - Pull requests
  security:
    - UserCookie: []
  operationId: getPullRequestDiff
  summary: Get pull request diff
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: blips-and-chitz
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/PullRequestId.yaml
  responses:
    '200':
      description: OK.
      content:
        text/plain:
          schema:
            type: string
          example: |-
            diff --git a/README.md b/README.md
            index ce33825..3987c36 100644
            --- a/README.md
            +++ b/README.md
            @@ -1,2 +1,4 @@
             # Demo portal
            +## Getting started
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
