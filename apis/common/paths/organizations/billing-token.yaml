get:
  tags:
    - Organizations
  security:
    - UserCookie: []
  summary: Get organization billing token
  operationId: getOrganizationBillingToken
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
  responses:
    '200':
      description: OK.
      content:
        application/json:
          schema:
            type: object
            properties:
              billingPortalToken:
                type: string
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
