post:
  tags:
    - Scout
  security:
    - ApiKey: []
  summary: Create a job todo
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  description: |-
    Git provider webhook triggers Scout to create a job todo.
    Similarly, a lint job started or completed triggers jobs todo.
    Since Scout is stateless and distributed, this is the API for storing things to do.
    It's also a way to communicate with Scout by making jobs for it to do too (such as communicating status back to Git).
    Finally, it can be used to trigger Scout to update again in the case of a GitHub webhook outage.
  operationId: createTodo
  parameters:
    - $ref: ../../components/parameters/header/X-Redocly-Scout-Version.yaml
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/scout/Job.yaml
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/scout/Job.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
