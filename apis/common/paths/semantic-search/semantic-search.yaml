post:
  tags:
    - Semantic search
  summary: Get semantic search results
  description: |-
    Perform AI-powered semantic search across project documentation using embeddings and reranking.
    Returns the top most relevant documents based on the search query.
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: lightsabers
  operationId: semanticSearch
  security: []
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/semantic-search/SemanticSearchRequest.yaml
  responses:
    '200':
      description: Semantic search completed successfully.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/semantic-search/SemanticSearchResponse.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
