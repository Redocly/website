post:
  security:
    - InternalAuth: []
  summary: Create project build logs
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: borsch
  tags:
    - Project builds
  operationId: createProjectBuildLogsBatch
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/BuildId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/project-build/CreateProjectBuildLogsBatch.yaml
  responses:
    '204':
      description: Logs created successfully.
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
