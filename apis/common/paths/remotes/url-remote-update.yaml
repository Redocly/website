patch:
  tags:
    - Remotes
  security:
    - InternalAuth: []
  summary: Partially update a URL remote content update
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  description: Update URL remote content update.
  operationId: patchUrlRemoteUpdate
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/UrlRemoteUpdateId.yaml
  requestBody:
    content:
      application/json:
        schema:
          required: 
            -  status
          type: object
          properties:
            error:
              $ref: ../../components/schemas/remotes/GenericRemoteUpdateError.yaml
            status:
              type: string
              enum: 
                - SUCCESSFUL
                - NO_CHANGES
                - FAILED
  responses:
    '200':
      description: Successfully updated.
      content:
        application/json:
          schema: 
            $ref: ../../components/schemas/remotes/UrlRemoteUpdate.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml 