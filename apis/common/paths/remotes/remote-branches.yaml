get:
  tags:
    - Remotes
  security:
    - UserCookie: []
    # TODO: Move this endpoint to git module with remoteId as query parameter
  summary: Get Git remote content branches
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: plug-and-play
  description: |-
    Get branches of the remote content with type GIT.
    Branch search matching differs by provider: GitHub matches branch-name prefixes (case-sensitive); GitLab, Bitbucket, and Azure DevOps match substrings (case-insensitive).
  operationId: getGitRemoteBranches
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
    - $ref: ../../components/parameters/path/RemoteId.yaml
    - $ref: ../../common/components/parameters/query/Search.yaml
    - $ref: ../../common/components/parameters/query/After.yaml
    - $ref: ../../common/components/parameters/query/Limit.yaml
  responses:
    '200':
      description: Git Remote Content branches.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/remotes/RemoteBranchList.yaml
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
