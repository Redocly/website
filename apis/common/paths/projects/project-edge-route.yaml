put:
  security:
    - InternalAuth: []
  summary: Publish the edge-routing entry a build owns
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: borsch
  tags:
    - Projects
  operationId: publishProjectEdgeRoute
  parameters:
    - $ref: ../../components/parameters/path/OrgId.yaml
    - $ref: ../../components/parameters/path/ProjectId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/project/PublishProjectEdgeRoute.yaml
  responses:
    '204':
      description: Edge-routing entry published.
    '400':
      $ref: ../../common/responses/BadRequestError.yaml
    '401':
      $ref: ../../common/responses/UnauthorizedError.yaml
    '403':
      $ref: ../../common/responses/ForbiddenError.yaml
    '404':
      $ref: ../../common/responses/NotFoundError.yaml
    '500':
      $ref: ../../common/responses/InternalServerError.yaml
