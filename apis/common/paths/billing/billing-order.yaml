get:
  tags:
    - Billing
  security: []
  summary: Retrieve a billing page redirect
  x-internal: true
  x-catalogRelations:
    - type: ownedBy
      key: cyberpunks
  operationId: getOrganizationBillingPageRedirect
  description: Redirects a billing order link to the matching organization billing page. If the order ID is not found, the endpoint falls back to the last visited organization from the `organizationContext` cookie.
  parameters:
    - in: path
      name: orderId
      required: true
      schema:
        type: string
      description: Order ID from the subscription record.
      example: ord_1234567890
    - in: cookie
      name: organizationContext
      required: false
      schema:
        type: string
      description: ID of the last visited organization used as a fallback when the order ID is not found.
      example: org_1234567890
  responses:
    '307':
      description: Redirects to the organization billing page, or to the application root when no organization can be resolved.
      headers:
        Location:
          schema:
            type: string
          description: URL to redirect to.
          example: https://app.cloud.redocly.com/org/testing_redocly/billing
