<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Diagram: one OpenAPI description flows through redocly generate-client into grouped artifacts: SDKs in TypeScript, Python, Go, and PHP; validation schemas, query hooks, and test mocks; a command-line interface; and reference docs." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="wash1" cx="85%" cy="-10%" r="70%">
      <stop offset="0%" stop-color="#99cdff" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#99cdff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0044d4"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <rect width="1200" height="560" fill="url(#wash1)"/>

  <text x="80" y="92" font-size="40" font-weight="700" fill="#1a1c21" letter-spacing="-0.5">One description. Every consumer.</text>
  <text x="80" y="132" font-size="24" fill="#43454e">typed SDKs, a CLI, mocks, and docs. Built for agents, owned by you.</text>

  <rect x="80" y="205" width="230" height="230" rx="12" fill="#ffffff" stroke="#dcdde5"/>
  <path d="M 80 217 a 12 12 0 0 1 12 -12 h 206 a 12 12 0 0 1 12 12 v 32 h -230 z" fill="#e7f3ff"/>
  <text x="102" y="233" font-size="15" font-weight="700" fill="#2467f2">openapi.yaml</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#3b3c45">
    <text x="102" y="275">openapi: 3.1.0</text>
    <text x="102" y="296">paths:</text>
    <text x="114" y="317">/orders/{orderId}:</text>
    <text x="126" y="338" fill="#0e8450">get: …</text>
    <text x="102" y="363">securitySchemes:</text>
    <text x="114" y="384" fill="#0e8450">BearerAuth: …</text>
  </g>

  <line x1="310" y1="320" x2="392" y2="320" stroke="#0044d4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="400" y="275" width="300" height="90" rx="12" fill="#16171c"/>
  <g font-family="Menlo, Consolas, monospace" font-size="14">
    <text x="424" y="315" fill="#8a8f9f">$</text>
    <text x="442" y="315" fill="#e8eaf2">redocly</text>
    <text x="510" y="315" fill="#7cc4ff">generate-client</text>
    <text x="442" y="341" fill="#8a8f9f">→ typed · zero deps · yours</text>
  </g>

  <line x1="700" y1="297" x2="782" y2="239" stroke="#0044d4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="313" x2="782" y2="319" stroke="#0044d4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="331" x2="782" y2="399" stroke="#0044d4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="347" x2="782" y2="479" stroke="#0044d4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g font-size="14.5">
    <rect x="790" y="204" width="330" height="58" rx="10" fill="#ffffff" stroke="#dcdde5"/>
    <text x="812" y="228" font-weight="700" fill="#1a1c21">SDKs</text>
    <text x="812" y="248" fill="#555761" font-size="12.5">client.ts · client.py · client.go · client.php</text>

    <rect x="790" y="284" width="330" height="58" rx="10" fill="#ffffff" stroke="#dcdde5"/>
    <text x="812" y="308" font-weight="700" fill="#1a1c21">Schemas, hooks, and mocks</text>
    <text x="812" y="328" fill="#555761" font-size="12.5">client.zod.ts · client.tanstack.ts · client.mocks.ts</text>

    <rect x="790" y="364" width="330" height="58" rx="10" fill="#ffffff" stroke="#dcdde5"/>
    <text x="812" y="388" font-weight="700" fill="#1a1c21">CLI</text>
    <text x="812" y="408" fill="#555761" font-size="12.5">client.cli.ts</text>

    <rect x="790" y="444" width="330" height="74" rx="10" fill="#ffffff" stroke="#dcdde5"/>
    <text x="812" y="468" font-weight="700" fill="#1a1c21">Docs</text>
    <text x="812" y="488" fill="#555761" font-size="12.5">client.python.md · client.cli.md</text>
    <text x="812" y="505" fill="#555761" font-size="12.5">one page per artifact</text>
  </g>
</svg>
